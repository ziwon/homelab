apps:
  # -----------------------------------------------------------
  # Feast Operator Install (Kustomize)
  # -----------------------------------------------------------
  - name: feast-operator
    namespace: feast-operator-system
    project: dev
    syncWave: "5"
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        name: featurestores.feast.dev
        jsonPointers:
          - /metadata/annotations
    source:
      repoURL: https://github.com/ziwon/homelab.git
      targetRevision: main
      path: platform/stacks/kustomize/feast-operator
      kustomize: {}

  # -----------------------------------------------------------
  # Feast FeatureStore Bootstrap
  # -----------------------------------------------------------
  - name: feast-raw
    namespace: feast-system
    project: dev
    syncWave: "10"
    dependencies:
      - feast-operator
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: feast-raw
        values: |
          resources:

            # -----------------------------------------------------------
            # Feast Managed Secrets (Infisical)
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: feast-managed-secrets
                namespace: feast-system
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /feast
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: feast-managed-secrets
                    secretNamespace: feast-system
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Feast FeatureStore CR - Homelab MLOps
            # Redis (Online) + ClickHouse (Offline) + PostgreSQL (Registry)
            # -----------------------------------------------------------
            - apiVersion: feast.dev/v1alpha1
              kind: FeatureStore
              metadata:
                name: homelab
                namespace: feast-system
              spec:
                feastProject: homelab

                services:
                  onlineStore:
                    persistence:
                      store:
                        type: redis
                        secretRef:
                          name: feast-managed-secrets
                    server:
                      image: ghcr.io/ziwon/feast-server:0.57.0
                      env:
                        - name: MPLCONFIGDIR
                          value: /tmp
                      resources:
                        requests:
                          cpu: 100m
                          memory: 128Mi

                  offlineStore:
                    persistence:
                      store:
                        type: feast.infra.offline_stores.contrib.clickhouse_offline_store.clickhouse.ClickhouseOfflineStore
                        secretRef:
                          name: feast-managed-secrets
                    server:
                      image: ghcr.io/ziwon/feast-server:0.57.0

                  registry:
                    local:
                      persistence:
                        store:
                          type: sql
                          secretRef:
                            name: feast-managed-secrets

                  ui:
                    image: ghcr.io/ziwon/feast-server:0.57.0

            # -----------------------------------------------------------
            # Feast Online Feature Server HTTPRoute
            # -----------------------------------------------------------
            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: feast-online
                namespace: feast-system
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - feast.home.lab
                rules:
                  - backendRefs:
                      - name: feast-homelab-online
                        port: 80

            # -----------------------------------------------------------
            # Feast Offline Feature Server HTTPRoute
            # -----------------------------------------------------------
            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: feast-offline
                namespace: feast-system
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - feast-offline.home.lab
                rules:
                  - backendRefs:
                      - name: feast-homelab-offline
                        port: 80

            # -----------------------------------------------------------
            # Feast UI HTTPRoute
            # -----------------------------------------------------------
            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: feast-ui
                namespace: feast-system
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - feast-ui.home.lab
                rules:
                  - backendRefs:
                      - name: feast-homelab-ui
                        port: 80
