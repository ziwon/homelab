services:
  # GPU Isolation with MPS
  nvidia-mps:
    image: nvidia/cuda:12.9.1-base-ubuntu24.04
    container_name: nvidia-mps
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_MPS_PIPE_DIRECTORY=/mps/pipe
      - CUDA_MPS_LOG_DIRECTORY=/mps/log
      - CUDA_MPS_ACTIVE_THREAD_PERCENTAGE=100
    volumes:
      - /cache/nvidia-mps/pipe:/mps/pipe
      - /cache/nvidia-mps/log:/mps/log
    command: >
      bash -c "
        nvidia-cuda-mps-control -d &&
        echo 'MPS daemon started' &&
        tail -f /dev/null
      "
    restart: always
    healthcheck:
      test: [ "CMD", "test", "-e", "/mps/pipe/control" ]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # CPU Isolation with Ray
  ray-node:
    image: ${RAY_IMAGE:-rayproject/ray:2.9.0-py310-gpu}
    container_name: ray_node
    hostname: ray-node
    restart: always
    runtime: nvidia
    depends_on:
      - nvidia-mps
    shm_size: "32gb"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_MPS_PIPE_DIRECTORY=/mps/pipe
      - CUDA_MPS_LOG_DIRECTORY=/mps/log
    volumes:
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - /cache/nvidia-mps/pipe:/mps/pipe
      - /cache/nvidia-mps/log:/mps/log
      - /cache/ray:/tmp/ray
      - /data/ray/storage:/ray/storage
    entrypoint: [ "bash", "/usr/local/bin/entrypoint.sh" ]
    ports:
      - "8265:8265"
      - "6379:6379"
      - "10001:10001"
