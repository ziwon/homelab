services:
  # ---------------------------------------------------------------------------
  # GPU Isolation with MPS (all GPU work goes through here)
  # ---------------------------------------------------------------------------
  nvidia-mps:
    image: nvidia/cuda:12.9.1-base-ubuntu24.04
    container_name: nvidia-mps
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_MPS_PIPE_DIRECTORY=/mps/pipe
      - CUDA_MPS_LOG_DIRECTORY=/mps/log
      - CUDA_MPS_ACTIVE_THREAD_PERCENTAGE=100
    volumes:
      - /cache/nvidia-mps/pipe:/mps/pipe
      - /cache/nvidia-mps/log:/mps/log
    command: >
      bash -c "
        nvidia-cuda-mps-control -d &&
        echo 'MPS daemon started' &&
        tail -f /dev/null
      "
    restart: always
    healthcheck:
      test: [ "CMD", "test", "-e", "/mps/pipe/control" ]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # ---------------------------------------------------------------------------
  # CPU/GPU Orchestration with Ray
  # ---------------------------------------------------------------------------
  ray-node:
    image: ${RAY_IMAGE:-rayproject/ray:2.9.0-py312}
    container_name: ray_node
    hostname: ray-node
    restart: always
    runtime: nvidia
    depends_on:
      - nvidia-mps
    shm_size: "32gb"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_MPS_PIPE_DIRECTORY=/mps/pipe
      - CUDA_MPS_LOG_DIRECTORY=/mps/log
    volumes:
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - /cache/nvidia-mps/pipe:/mps/pipe
      - /cache/nvidia-mps/log:/mps/log
      - /cache/ray:/tmp/ray
      - /data/ray/storage:/ray/storage
    entrypoint: [ "bash", "/usr/local/bin/entrypoint.sh" ]
    ports:
      - "8265:8265"
      - "6379:6379"
      - "10001:10001"

  # ---------------------------------------------------------------------------
  # vLLM - Main Universal LLM Server (Qwen3-8B-Instruct, OpenAI compatible API)
  # ---------------------------------------------------------------------------
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.6.6.post1}
    container_name: vllm
    runtime: nvidia
    restart: unless-stopped
    profiles:
      - vllm
    depends_on:
      nvidia-mps:
        condition: service_healthy
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_MPS_PIPE_DIRECTORY=/mps/pipe
      - CUDA_MPS_LOG_DIRECTORY=/mps/log
      - CUDA_MPS_ACTIVE_THREAD_PERCENTAGE=40
      - HF_HOME=/data/huggingface
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    volumes:
      - /cache/nvidia-mps/pipe:/mps/pipe:ro
      - /cache/nvidia-mps/log:/mps/log:ro
      - /data/LLM/models/hugging-face:/data/huggingface
    command:
      - Qwen/Qwen3-8B-AWQ
      #- Qwen/Qwen3-8B-Instruct
      - --dtype
      - float16
      #- --max-model-len
      #- "4096"
      - --gpu-memory-utilization
      - "0.65"
      - --cpu-offload-gb
      - "16"
      - --swap-space
      - "4"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-num-seqs
      - "16"
      - --served-model-name
      - qwen3-8b
    cpuset: "0-7"
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 22G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # llama.cpp - Multimodal VLM (GLM-4.6V-Flash GGUF)
  # ---------------------------------------------------------------------------
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp
    runtime: nvidia
    restart: unless-stopped
    profiles:
      - gguf
    depends_on:
      nvidia-mps:
        condition: service_healthy
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_MPS_PIPE_DIRECTORY=/mps/pipe
      - CUDA_MPS_ACTIVE_THREAD_PERCENTAGE=40
    volumes:
      - /data/LLM/models/lmstudio-community:/models:ro
      - /cache/nvidia-mps/pipe:/mps/pipe:ro
    command:
      - --model
      - /models/GLM-4.6V-Flash-GGUF/GLM-4.6V-Flash-Q4_K_M.gguf
      - --mmproj
      - /models/GLM-4.6V-Flash-GGUF/mmproj-GLM-4.6V-Flash-F16.gguf
      - --mmproj-offload
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --n-gpu-layers
      - "10"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --cont-batching
      - --flash-attn
      - auto
      - --alias
      - glm-4.6v
    cpuset: "0-7"
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Main Brain: DeepSeek R1 (Distill Qwen3 8B)
  # ---------------------------------------------------------------------------
  llama-cpp-main:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-main
    runtime: nvidia
    restart: unless-stopped
    profiles:
      - qwen3-8b
    depends_on:
      nvidia-mps:
        condition: service_healthy
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_MPS_PIPE_DIRECTORY=/mps/pipe
      - CUDA_MPS_ACTIVE_THREAD_PERCENTAGE=60
    volumes:
      - /data/LLM/models/lmstudio-community:/models:ro
      - /cache/nvidia-mps/pipe:/mps/pipe:ro
    command:
      - --model
      - /models/DeepSeek-R1-0528-Qwen3-8B-GGUF/DeepSeek-R1-0528-Qwen3-8B-Q4_K_M.gguf
      - --alias
      - qwen3-reasoning
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --n-gpu-layers
      - "100"
      - --ctx-size
      - "32768"
      - --cache-type-k
      - "q8_0"
      - --cache-type-v
      - "q8_0"
      - --flash-attn
      - auto
      - --temp
      - "0.6"
      - --top-p
      - "0.95"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  # ---------------------------------------------------------------------------
  # llama.cpp - Trading/FX  (llama3-ko-8b-trading-expert)
  # ---------------------------------------------------------------------------
  llama-cpp-trading:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-trading
    runtime: nvidia
    restart: unless-stopped
    profiles:
      - trading
    depends_on:
      nvidia-mps:
        condition: service_healthy
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_MPS_PIPE_DIRECTORY=/mps/pipe
      - CUDA_MPS_ACTIVE_THREAD_PERCENTAGE=50
    volumes:
      - /data/LLM/models/yhkkk0427:/models:ro
      - /cache/nvidia-mps/pipe:/mps/pipe:ro
    command:
      - --model
      - /models/llama3-ko-8b-trading-expert-Q4_K_M-GGUF/llama3-ko-8b-trading-expert-q4_k_m.gguf
      - --host
      - "0.0.0.0"
      - --port
      - "8002"
      - --n-gpu-layers
      - "35"
      - --ctx-size
      - "4096"
      - --parallel
      - "4"
      - --cont-batching
      - --flash-attn
      - auto
      - --alias
      - llama3-trading
    cpuset: "0-7"
    ports:
      - "8002:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # llama.cpp - Code (Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf)
  # ---------------------------------------------------------------------------
  llama-cpp-code:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-code
    runtime: nvidia
    restart: unless-stopped
    profiles:
      - qwen3
    depends_on:
      nvidia-mps:
        condition: service_healthy
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_MPS_PIPE_DIRECTORY=/mps/pipe
      - CUDA_MPS_ACTIVE_THREAD_PERCENTAGE=70
    volumes:
      - /data/LLM/models/lmstudio-community:/models:ro
      - /cache/nvidia-mps/pipe:/mps/pipe:ro
    command:
      - --model
      - /models/Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
      - --host
      - "0.0.0.0"
      - --port
      - "8003"
      - --n-gpu-layers
      - "30"
      - --ctx-size
      - "24513"
      - --parallel
      - "1"
      - --cache-type-k
      - "q8_0"
      - --cache-type-v
      - "q8_0"
      - --cont-batching
      - --flash-attn
      - auto
      - --alias
      - qwen3-coder
    cpuset: "0-7"
    ports:
      - "8003:8003"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # llama.cpp - Code (GPT-OSS-20B-MXFP4.gguf)
  # ---------------------------------------------------------------------------
  llama-cpp-oss20b:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-oss20b
    runtime: nvidia
    restart: unless-stopped
    profiles:
      - oss20b
    depends_on:
      nvidia-mps:
        condition: service_healthy
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_MPS_PIPE_DIRECTORY=/mps/pipe
      - CUDA_MPS_ACTIVE_THREAD_PERCENTAGE=50
    volumes:
      - /data/LLM/models/lmstudio-community:/models:ro
      - /cache/nvidia-mps/pipe:/mps/pipe:ro
    command:
      - --model
      - /models/gpt-oss-20b-GGUF/gpt-oss-20b-MXFP4.gguf
      - --host
      - "0.0.0.0"
      - --port
      - "8004"
      - --n-gpu-layers
      - "100"
      - --ctx-size
      - "32768"
      - --cache-type-k
      - "q8_0"
      - --cache-type-v
      - "q8_0"
      - --parallel
      - "1"
      - --cont-batching
      - --flash-attn
      - auto
      - --alias
      - gpt-oss-20b
    cpuset: "0-7"
    ports:
      - "8004:8004"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Open WebUI - ChatGPT style Web Interface
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      - OPENAI_API_BASE_URL=http://vllm:8000/v1;http://llama-cpp-main:8001/v1;http://llama-cpp-code:8003/v1;http://llama-cpp-oss20b:8004/v1
      - OPENAI_API_KEY=not-needed

      - WEBUI_AUTH=false
      - WEBUI_NAME=DeepFX AI
      - DEFAULT_MODELS=qwen3-coder

      - OLLAMA_BASE_URL=
      - ENABLE_OLLAMA_API=false
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "3000:8080"
    cpuset: "8-23"

volumes:
  open-webui-data:
    driver: local
