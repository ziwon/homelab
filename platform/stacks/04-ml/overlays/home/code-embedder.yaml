apps:
  - name: code-embedder-raw
    namespace: code-embedder
    project: dev
    syncWave: "10"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: code-embedder-raw
        values: |
          resources:
            - apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: code-embedder-runner
                namespace: code-embedder
              imagePullSecrets:
                - name: harbor-secret

            - apiVersion: v1
              kind: Secret
              metadata:
                name: code-embedder-runner-token
                namespace: code-embedder
                annotations:
                  kubernetes.io/service-account.name: code-embedder-runner
              type: kubernetes.io/service-account-token

            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-workflows-secrets
                namespace: code-embedder
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /argo-workflows
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-workflows-secrets
                    secretNamespace: code-embedder
                    creationPolicy: Owner

            - apiVersion: v1
              kind: Service
              metadata:
                name: restack-ai-embedding
                namespace: code-embedder
              spec:
                type: ClusterIP
                ports:
                  - name: http
                    port: 80
                    targetPort: 8080
                    protocol: TCP

            - apiVersion: discovery.k8s.io/v1
              kind: EndpointSlice
              metadata:
                name: restack-ai-embedding
                namespace: code-embedder
                labels:
                  kubernetes.io/service-name: restack-ai-embedding
              addressType: IPv4
              ports:
                - name: http
                  port: 8080
                  protocol: TCP
              endpoints:
                - addresses:
                    - 172.16.0.48
                  conditions:
                    ready: true

            - apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: code-embedder-runner
                namespace: code-embedder
              rules:
                - apiGroups: [ "argoproj.io" ]
                  resources: [ "workflows", "workflowtemplates" ]
                  verbs: [ "get", "list", "watch", "create" ]
                - apiGroups: [ "argoproj.io" ]
                  resources: [ "workflowtaskresults" ]
                  verbs: [ "create", "patch" ]

            - apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: code-embedder-runner
                namespace: code-embedder
              subjects:
                - kind: ServiceAccount
                  name: code-embedder-runner
                  namespace: code-embedder
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: code-embedder-runner

            - apiVersion: argoproj.io/v1alpha1
              kind: WorkflowTemplate
              metadata:
                name: code-embedder
                namespace: code-embedder
              spec:
                serviceAccountName: code-embedder-runner
                entrypoint: main
                onExit: exit-handler
                imagePullSecrets:
                  - name: harbor-secret
                arguments:
                  parameters:
                    - name: git-repo
                      value: https://github.com/ziwon/homelab.git
                    - name: git-base-ref
                      value: ""
                    - name: git-head-ref
                      value: ""
                    - name: image
                      value: harbor.home.lab/restack/apps/code-embedder:main-4cc2010
                    - name: qdrant-url
                      value: http://qdrant.qdrant.svc:6333
                    - name: qdrant-collection
                      value: codebase-bge-m3
                    - name: llm-embed-url
                      value: http://restack-ai-embedding
                    - name: full-reindex
                      value: "false"
                templates:
                  - name: main
                    dag:
                      tasks:
                        - name: git-clone
                          template: git-clone
                        - name: embed
                          dependencies: [ git-clone ]
                          template: embed
                          arguments:
                            artifacts:
                              - name: repo
                                from: "{{tasks.git-clone.outputs.artifacts.repo}}"

                  - name: git-clone
                    container:
                      image: alpine/git:2.45.2
                      command: [ "/bin/sh", "-c" ]
                      args:
                        - |
                          set -eu
                          git clone "{{workflow.parameters.git-repo}}" /workspace/repo
                          if [ -n "{{workflow.parameters.git-base-ref}}" ]; then
                            git -C /workspace/repo fetch origin "{{workflow.parameters.git-base-ref}}"
                          fi
                          if [ -n "{{workflow.parameters.git-head-ref}}" ]; then
                            git -C /workspace/repo fetch origin "{{workflow.parameters.git-head-ref}}"
                            git -C /workspace/repo checkout "{{workflow.parameters.git-head-ref}}"
                          fi
                      resources:
                        requests:
                          cpu: 100m
                          memory: 128Mi
                        limits:
                          cpu: 500m
                          memory: 512Mi
                    outputs:
                      artifacts:
                        - name: repo
                          path: /workspace/repo

                  - name: embed
                    inputs:
                      artifacts:
                        - name: repo
                          path: /workspace/repo
                    container:
                      image: "{{workflow.parameters.image}}"
                      command: [ "code-embedder" ]
                      env:
                        - name: REPO_PATH
                          value: /workspace/repo
                        - name: REPO_NAME
                          value: homelab
                        - name: GIT_BASE_REF
                          value: "{{workflow.parameters.git-base-ref}}"
                        - name: GIT_HEAD_REF
                          value: "{{workflow.parameters.git-head-ref}}"
                        - name: FULL_REINDEX
                          value: "{{workflow.parameters.full-reindex}}"
                        - name: QDRANT_URL
                          value: "{{workflow.parameters.qdrant-url}}"
                        - name: QDRANT_API_KEY
                          valueFrom:
                            secretKeyRef:
                              name: managed-workflows-secrets
                              key: QDRANT_API_KEY
                        - name: QDRANT_COLLECTION
                          value: "{{workflow.parameters.qdrant-collection}}"
                        - name: LLM_EMBED_URL
                          value: "{{workflow.parameters.llm-embed-url}}"
                        - name: STORE_TEXT
                          value: "true"
                        - name: CREATE_TEXT_INDEX
                          value: "true"
                      resources:
                        requests:
                          cpu: 500m
                          memory: 1Gi
                        limits:
                          cpu: "2"
                          memory: 4Gi

                  - name: exit-handler
                    steps:
                      - - name: slack-notify
                          templateRef:
                            name: global-slack-notification
                            template: send-notification
                            clusterScope: true
                          arguments:
                            parameters:
                              - name: status
                                value: "{{workflow.status}}"
                              - name: name
                                value: "{{workflow.name}}"
                              - name: namespace
                                value: "{{workflow.namespace}}"
                              - name: link
                                value: "https://wf.home.lab/workflows/{{workflow.namespace}}/{{workflow.name}}"
