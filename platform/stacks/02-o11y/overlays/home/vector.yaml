apps:
  - name: vector-raw
    namespace: monitoring
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: vector-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: redpanda-managed-secrets
                namespace: monitoring
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /redpanda 
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: redpanda-managed-secrets
                    secretNamespace: monitoring
                    creationPolicy: Owner

            - apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: redpanda-ca-sync
                namespace: monitoring 
            
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: redpanda-ca-sync
              rules:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "create", "update"]
            
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: redpanda-ca-sync
              subjects:
                - kind: ServiceAccount
                  name: redpanda-ca-sync
                  namespace: monitoring
              roleRef:
                kind: ClusterRole
                name: redpanda-ca-sync
                apiGroup: rbac.authorization.k8s.io

            - apiVersion: batch/v1
              kind: Job
              metadata:
                name: redpanda-root-ca-sync
                namespace: monitoring
              spec:
                template:
                  spec:
                    serviceAccountName: redpanda-ca-sync
                    restartPolicy: OnFailure
                    containers:
                      - name: sync
                        image: bitnami/kubectl:latest
                        command:
                          - /bin/sh
                          - -c
                          - |
                            set -e

                            echo "Fetching CA from redpanda namespace..."
                            CA_B64=$(kubectl get secret redpanda-default-root-certificate \
                              -n redpanda \
                              -o jsonpath='{.data.ca\.crt}')

                            if [ -z "$CA_B64" ]; then
                              echo "ca.crt not found in redpanda-default-root-certificate"
                              exit 1
                            fi

                            CA=$(echo "$CA_B64" | base64 -d)

                            cat <<EOF | kubectl apply -f -
                            apiVersion: v1
                            kind: Secret
                            metadata:
                              name: redpanda-default-root-certificate
                              namespace: monitoring
                            type: Opaque
                            data:
                              ca.crt: $(echo "$CA" | base64 -w0)
                            EOF

                            echo "Synced CA to monitoring/redpanda-default-root-certificate"

  - name: vector
    namespace: monitoring
    project: dev
    syncWave: "10"
    dependencies:
      - vector-raw
    source:
      repoURL: https://helm.vector.dev
      chart: vector
      targetRevision: 0.48.0
      helm:
        releaseName: vector
        values: |
          role: Agent
          dataDir: /var/lib/vector

          extraVolumes:
            - name: vector-data
              hostPath:
                path: /data/vector
                type: DirectoryOrCreate

          extraVolumeMounts:
            - name: vector-data
              mountPath: /var/lib/vector

          securityContext:
            readOnlyRootFilesystem: false

          customConfig:
            sources:
              k8s_logs:
                type: "kubernetes_logs"
            
            transforms:
              remap_logs:
                type: "remap"
                inputs: ["k8s_logs"]
                source: |
                  . = parse_json(.message) ?? .
                  del(.file)
                  del(.kubernetes.pod_owner)

            sinks:
              redpanda:
                type: "kafka"
                inputs: ["remap_logs"]
                bootstrap_servers: "redpanda.redpanda.svc.cluster.local:9093"
                topic: "logs-kubernetes"
                
                encoding:
                  codec: "json"

                sasl:
                  enabled: true
                  mechanism: "SCRAM-SHA-512"
                  username: "vector"
                  password: "${VECTOR_PASSWORD}"

                tls:
                  enabled: true
                  ca_file: "/etc/tls/certs/ca.crt"
                  verify_certificate: true 
                  verify_hostname: false

          env:
            - name: VECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redpanda-managed-secrets
                  key: vector-password

          extraVolumes:
            - name: ca-cert
              secret:
                secretName: redpanda-default-root-certificate
                items:
                  - key: ca.crt
                    path: ca.crt

          extraVolumeMounts:
            - name: ca-cert
              mountPath: /etc/tls/certs
              readOnly: true

          podSecurityContext:
            runAsUser: 0 
          
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
    
