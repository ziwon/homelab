apps:
  - name: vector-raw
    namespace: monitoring
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: vector-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: redpanda-managed-secrets
                namespace: monitoring
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /redpanda 
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: redpanda-managed-secrets
                    secretNamespace: monitoring
                    creationPolicy: Owner

            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: monitoring-managed-secrets
                namespace: monitoring
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /monitoring
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: monitoring-managed-secrets
                    secretNamespace: monitoring
                    creationPolicy: Owner

            - apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: redpanda-ca-sync
                namespace: monitoring 
            
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: redpanda-ca-sync
              rules:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "create", "update"]
            
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: redpanda-ca-sync
              subjects:
                - kind: ServiceAccount
                  name: redpanda-ca-sync
                  namespace: monitoring
              roleRef:
                kind: ClusterRole
                name: redpanda-ca-sync
                apiGroup: rbac.authorization.k8s.io

            - apiVersion: batch/v1
              kind: Job
              metadata:
                name: redpanda-root-ca-sync
                namespace: monitoring
              spec:
                template:
                  spec:
                    serviceAccountName: redpanda-ca-sync
                    restartPolicy: OnFailure
                    containers:
                      - name: sync
                        image: bitnami/kubectl:latest
                        command:
                          - /bin/sh
                          - -c
                          - |
                            set -e

                            echo "Fetching CA from redpanda namespace..."
                            CA_B64=$(kubectl get secret redpanda-default-root-certificate \
                              -n redpanda \
                              -o jsonpath='{.data.ca\.crt}')

                            if [ -z "$CA_B64" ]; then
                              echo "ca.crt not found in redpanda-default-root-certificate"
                              exit 1
                            fi

                            CA=$(echo "$CA_B64" | base64 -d)

                            cat <<EOF | kubectl apply -f -
                            apiVersion: v1
                            kind: Secret
                            metadata:
                              name: redpanda-default-root-certificate
                              namespace: monitoring
                            type: Opaque
                            data:
                              ca.crt: $(echo "$CA" | base64 -w0)
                            EOF

                            echo "Synced CA to monitoring/redpanda-default-root-certificate"

  - name: vector
    namespace: monitoring
    project: dev
    syncWave: "10"
    dependencies:
      - vector-raw
    source:
      repoURL: https://helm.vector.dev
      chart: vector
      targetRevision: 0.48.0
      helm:
        releaseName: vector
        values: |
          role: Agent
          dataDir: /var/lib/vector

          securityContext:
            readOnlyRootFilesystem: false

          customConfig:
            sources:
              k8s_logs:
                type: "kubernetes_logs"
              internal_metrics:
                type: "internal_metrics"
            
            transforms:
              filter_ns:
                type: "filter"
                inputs: ["k8s_logs"]
                condition: |
                  if exists(.kubernetes.pod_namespace) {
                    ns = to_string!(.kubernetes.pod_namespace)
                    ns != "kube-system" && ns != "monitoring"
                  } else {
                    true
                  }
              
              remap_logs:
                type: "remap"
                inputs: ["filter_ns"]
                source: |
                  # Parse .log if it's a JSON log (authentik, etc.)
                  parsed, err = parse_json(.message)
                  if err == null {
                    .log = parsed
                  }

                  # Flatten Kubernetes metadata
                  if exists(.kubernetes) {
                    .k8s = {
                      "ns":   .kubernetes.pod_namespace,
                      "pod":  .kubernetes.pod_name,
                      "node": .kubernetes.pod_node_name,
                      "ct":   .kubernetes.container_name,
                    }

                    .k8s.app = .kubernetes.container_name
                    if exists(.kubernetes.pod_labels."app.kubernetes.io/name") {
                      .k8s.app = .kubernetes.pod_labels."app.kubernetes.io/name"
                    } else if exists(.kubernetes.pod_labels.app) {
                      .k8s.app = .kubernetes.pod_labels.app
                    } else if exists(.kubernetes.pod_labels.name) {
                      .k8s.app = .kubernetes.pod_labels.name
                    }
                  }

                  # Default common level
                  if !exists(.level) {
                    .level = "info"
                  }

                  # Normalize message/level
                  # JSON logs with .log (authentik, etc.)
                  if exists(.log) {
                    # message priority: log.message > log.msg > fallback combination
                    if exists(.log.message) {
                      .message = .log.message
                    } else if exists(.log.msg) {
                      .message = .log.msg
                    } else {
                      msg = ""
                      if exists(.log.method) {
                        msg = to_string!(.log.method)
                      }
                      if exists(.log.domain_url) {
                        if msg != "" { msg = msg + " " }
                        msg = msg + to_string!(.log.domain_url)
                      }
                      if exists(.log.status) {
                        if msg != "" { msg = msg + " " }
                        msg = msg + to_string!(.log.status)
                      }
                      .message = msg
                    }

                    if exists(.log.level) {
                      .level = to_string!(.log.level)
                    }

                    # Align to common timestamp if log.timestamp exists (optional)
                    if exists(.log.timestamp) {
                      parsed_ts, ts_err = parse_timestamp(.log.timestamp, "%+")
                      if ts_err == null {
                        .timestamp = parsed_ts
                      }
                    }

                  # logfmt format (repo-server: time="..." level=.. msg="...")
                  } else if exists(.message) && contains!(.message, " level=") && contains!(.message, " msg=") {
                    parsed_log, err2 = parse_logfmt(.message)
                    if err2 == null {
                      if exists(parsed_log.msg) {
                        .message = parsed_log.msg
                      }
                      if exists(parsed_log.level) {
                        .level = to_string!(parsed_log.level)
                      }
                      if exists(parsed_log.time) {
                        parsed_ts, ts_err2 = parse_timestamp(parsed_log.time, "%+")
                        if ts_err2 == null {
                          .timestamp = parsed_ts
                        }
                      }
                    }

                  # Others (harbor access log, etc.)
                  } else {
                    if exists(.message) {
                      # Pattern A: 2025-11-28T07:52:36Z INFO  ...
                      iso, iso_err = parse_regex(.message,
                        r'^(?P<ts>\d{4}-\d{2}-\d{2}T[0-9:\.]+Z)\s+(?P<level>[A-Z]+)\s+(?P<msg>.*)$'
                      )

                      if iso_err == null {
                        .message = iso.msg
                        .level   = downcase!(iso.level)
                        .timestamp, _ = parse_timestamp(iso.ts, "%+")
                      } else {
                        # Pattern B: 2025-11-28 07:52:25,959 INFO: ...
                        plain, plain_err = parse_regex(.message,
                          r'^(?P<ts>\d{4}-\d{2}-\d{2}\s+[0-9:,]+)\s+(?P<level>[A-Z]+):?\s+(?P<msg>.*)$'
                        )

                        if plain_err == null {
                          .message = plain.msg
                          .level   = downcase!(plain.level)
                          .timestamp, _ = parse_timestamp(plain.ts, "%Y-%m-%d %H:%M:%S,%3f") 
                        }
                      }
                    }

                    # Rough level classification if status exists (use if desired)
                    if exists(.status) {
                      code, code_err = to_int(.status)
                      if code_err == null {
                        if code >= 500 {
                          .level = "error"
                        } else if code >= 400 {
                          .level = "warn"
                        } else {
                          .level = "info"
                        }
                      }
                    }
                  }

                  # Truncate the huge long message in Argo CD server logs
                  if exists(.k8s) && .k8s.ns == "argocd" && .k8s.ct == "repo-server" && exists(.message) {
                    if length!(.message) > 1000 {
                      .raw_message = .message
                      .message = truncate!(.message, limit: 400, suffix: "... [truncated]")
                    }
                  }

                  # Add timestamp if it doesn't exist
                  if !exists(.timestamp) {
                    .timestamp = now()
                  }

                  # Remove heavy original fields
                  del(.file)
                  del(.kubernetes)

              # Filter only error/critical/fatal logs for alerting
              filter_alerts:
                type: "filter"
                inputs: ["remap_logs"]
                condition: |
                  .level == "error" || .level == "critical" || .level == "fatal"

              # Throttle alerts to max 1 per minute per application
              throttle_alerts:
                type: "throttle"
                inputs: ["filter_alerts"]
                window_secs: 60
                threshold: 1
                key_field: '{{ `{{` }} k8s.app }}'

              # Format Slack message
              format_slack:
                type: "remap"
                inputs: ["throttle_alerts"]
                source: |
                  ns = if exists(.k8s) && exists(.k8s.ns) { to_string!(.k8s.ns) } else { "unknown_ns" }
                  app = if exists(.k8s) && exists(.k8s.app) { to_string!(.k8s.app) } else { "unknown_app" }
                  pod = if exists(.k8s) && exists(.k8s.pod) { to_string!(.k8s.pod) } else { "unknown_pod" }

                  raw_level = if exists(.level) { .level } else { "UNKNOWN" }
                  lvl = upcase(to_string!(raw_level))
                  msg = if exists(.message) { to_string!(.message) } else { "No message provided" }
                  ts = format_timestamp!(now(), format: "%Y-%m-%d %H:%M:%S%:z")

                  title = "🚨 Error detected in " + ns
                  msg_body = "*App:* " + app + "\n*Pod:* " + pod + "\n*Level:* " + lvl + "\n```" + msg + "```"

                  . = {
                    "text": title,
                    "blocks": [
                      {
                        "type": "header",
                        "text": {
                          "type": "plain_text",
                          "text": title,
                          "emoji": true
                        }
                      },
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": msg_body
                        }
                      },
                      {
                        "type": "context",
                        "elements": [
                          {
                            "type": "mrkdwn",
                            "text": "Time: " + ts
                          }
                        ]
                      }
                    ]
                  }

            sinks:
              redpanda:
                type: "kafka"
                inputs: ["remap_logs"]
                bootstrap_servers: "redpanda.redpanda.svc.cluster.local:9093"
                topic: "logs.k8s.all"
                
                encoding:
                  codec: "json"

                sasl:
                  enabled: true
                  mechanism: "SCRAM-SHA-512"
                  username: "vector"
                  password: "${VECTOR_PASSWORD}"

                tls:
                  enabled: true
                  ca_file: "/etc/tls/certs/ca.crt"
                  verify_certificate: true 
                  verify_hostname: false

              prometheus_metrics:
                type: "prometheus_exporter"
                inputs: ["internal_metrics"]
                address: "0.0.0.0:9090"

              slack_alert:
                type: "http"
                inputs: ["format_slack"]
                uri: "${SLACK_WEBHOOK_URL}"
                method: "post"
                batch:
                  max_events: 1
                  timeout_secs: 1
                encoding:
                  codec: "json"
                framing:
                  method: "newline_delimited"
                request:
                  headers:
                    "Content-Type": "application/json"
                  rate_limit_duration_secs: 1
                  rate_limit_num: 1

          env:
            - name: VECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redpanda-managed-secrets
                  key: vector-password
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: monitoring-managed-secrets 
                  key: slack-webhook-url   

          extraVolumes:
            - name: ca-cert
              secret:
                secretName: redpanda-default-root-certificate
                items:
                  - key: ca.crt
                    path: ca.crt

            - name: vector-data
              hostPath:
                path: /data/vector
                type: DirectoryOrCreate

          extraVolumeMounts:
            - name: ca-cert
              mountPath: /etc/tls/certs
              readOnly: true

            - name: vector-data
              mountPath: /var/lib/vector

          service:
            enabled: true
            ports:
              - name: http
                port: 8686
                targetPort: 8686
                protocol: TCP
              - name: metrics
                port: 9090
                targetPort: 9090
                protocol: TCP

          podSecurityContext:
            runAsUser: 0 
          
          securityContext:
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL