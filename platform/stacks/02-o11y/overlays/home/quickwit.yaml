apps:
  # -----------------------------------------------------------
  # Quickwit Prerequisites (Secrets)
  # -----------------------------------------------------------
  - name: quickwit-raw
    namespace: monitoring
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: quickwit-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: quickwit-managed-secrets
                namespace: monitoring
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /quickwit
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: quickwit-managed-secrets
                    secretNamespace: monitoring
                    creationPolicy: Owner
                
            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: quickwit
                namespace: monitoring
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - logs.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: quickwit-searcher
                        port: 7280
                        weight: 1

  # -----------------------------------------------------------
  # Quickwit Main Deployment
  # -----------------------------------------------------------
  - name: quickwit
    namespace: monitoring
    project: dev
    syncWave: "10"
    dependencies:
      - quickwit-raw
    source:
      repoURL: https://helm.quickwit.io
      chart: quickwit
      targetRevision: 0.7.21
      helm:
        releaseName: quickwit
        values: |
          image:
            repository: quickwit/quickwit
            tag: 0.8.2

          environmentFrom:
            - secretRef:
                name: quickwit-managed-secrets

          config:
            version: 0.8

            metastore_uri: ${QW_METASTORE_URI}
            default_index_root_uri: ${QW_DEFAULT_INDEX_ROOT_URI}

            storage:
              s3:
                flavor: minio
                endpoint: ${MINIO_ENDPOINT}
                region: ${AWS_REGION}
                access_key_id: ${MINIO_ACCESS_KEY_ID}
                secret_access_key: ${MINIO_SECRET_ACCESS_KEY}
                force_path_style_access: true

          searcher:
            replicaCount: 1
            extraVolumes:
            - name: ca-cert
              secret:
                secretName: redpanda-default-root-certificate
                items:
                  - key: ca.crt
                    path: ca.crt
            extraVolumeMounts:
            - name: ca-cert
              mountPath: /etc/tls/certs
              readOnly: true

          indexer:
            enable_otlp_endpoint: true
            replicaCount: 1
            extraVolumes:
            - name: ca-cert
              secret:
                secretName: redpanda-default-root-certificate
                items:
                  - key: ca.crt
                    path: ca.crt
            extraVolumeMounts:
            - name: ca-cert
              mountPath: /etc/tls/certs
              readOnly: true

          metastore:
            replicaCount: 1

          janitor:
            replicaCount: 1

          control_plane:
            enabled: true

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

  # -----------------------------------------------------------
  # Quickwit Setup (Index & Source Creation)
  # -----------------------------------------------------------
  - name: quickwit-setup
    namespace: monitoring
    project: dev
    syncWave: "15"
    dependencies:
      - quickwit
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: quickwit-setup
        values: |
          resources:
            - apiVersion: batch/v1
              kind: Job
              metadata:
                name: quickwit-index-init
                namespace: monitoring
                annotations:
                  argocd.argoproj.io/hook: Sync
                  argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
              spec:
                template:
                  spec:
                    restartPolicy: OnFailure
                    containers:
                      - name: init
                        image: curlimages/curl:latest
                        env:
                          - name: REDPANDA_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: quickwit-password
                          - name: REDPANDA_USERNAME
                            value: quickwit
                        command:
                          - /bin/sh
                          - -c
                          - |
                            echo "Waiting for Quickwit to be ready..."
                            until curl -s http://quickwit-searcher.monitoring.svc:7280/api/v1/version > /dev/null; do
                              sleep 5
                            done

                            echo "Creating Index (k8s-logs)..."
                            curl -X POST \
                              -H "Content-Type: application/yaml" \
                              http://quickwit-searcher.monitoring.svc:7280/api/v1/indexes \
                              --data-binary @- <<EOF
                            version: 0.8
                            index_id: k8s-logs
                            doc_mapping:
                              mode: dynamic
                              timestamp_field: timestamp
                              field_mappings:
                                - name: timestamp
                                  type: datetime
                                  input_formats:
                                    - unix_timestamp
                                    - iso8601
                                  output_format: iso8601
                                  fast: true
                                - name: log
                                  type: json
                                  stored: true
                                  indexed: true
                            EOF

                            echo "Creating Kafka Source..."
                            curl -X POST \
                              -H "Content-Type: application/yaml" \
                              http://quickwit-searcher.monitoring.svc:7280/api/v1/indexes/k8s-logs/sources \
                              --data-binary @- <<EOF
                            version: 0.8
                            source_id: redpanda-source
                            source_type: kafka
                            num_pipelines: 1
                            params:
                              topic: "logs.k8s.all"
                              client_params:
                                bootstrap.servers: "redpanda.redpanda.svc.cluster.local:9093"
                                group.id: "quickwit-group"
                                auto.offset.reset: "earliest"
                                security.protocol: "SASL_SSL"
                                sasl.mechanism: "SCRAM-SHA-512"
                                sasl.username: "${REDPANDA_USERNAME}"
                                sasl.password: "${REDPANDA_PASSWORD}"
                                ssl.ca.location: "/etc/tls/certs/ca.crt"
                                ssl.endpoint.identification.algorithm: "none"
                            EOF

                            echo "Quickwit Setup Complete!"
                        volumeMounts:
                          - name: ca-cert
                            mountPath: /etc/tls/certs
                            readOnly: true
                    volumes:
                      - name: ca-cert
                        secret:
                          secretName: redpanda-default-root-certificate
                          items:
                            - key: ca.crt
                              path: ca.crt
