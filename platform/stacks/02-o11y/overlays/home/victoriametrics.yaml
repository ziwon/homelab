apps:
  # -----------------------------------------------------------
  # Component A: Prerequisites (Routes)
  # SyncWave: 0
  # -----------------------------------------------------------
  - name: vm-raw
    namespace: monitoring
    project: dev
    syncWave: "0"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: vm-raw
        values: |
          resources:
            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: vmsingle
                namespace: monitoring
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - vm.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: vmsingle-vm-stack-victoria-metrics-k8s-stack 
                        port: 8428

            # Will be created from vector 
            # - apiVersion: secrets.infisical.com/v1alpha1
            #   kind: InfisicalSecret
            #   metadata:
            #     name: monitoring-managed-secrets
            #     namespace: monitoring
            #   spec:
            #     hostAPI: https://app.infisical.com/api
            #     authentication:
            #       universalAuth:
            #         secretsScope:
            #           projectSlug: home-lab
            #           envSlug: "hme"
            #           secretsPath: /monitoring
            #         credentialsRef:
            #           secretName: infisical-secrets
            #           secretNamespace: infisical
            #     managedKubeSecretReferences:
            #       - secretName: monitoring-managed-secrets
            #         secretNamespace: monitoring
            #         creationPolicy: Owner

  # -----------------------------------------------------------
  # Component B: Control Plane (VictoriaMetrics Operator)
  # SyncWave: 5
  # -----------------------------------------------------------
  - name: vm-operator
    namespace: monitoring
    project: dev
    syncWave: "5"
    dependencies:
      - vm-raw
    source:
      repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-metrics-operator
      targetRevision: 0.56.4
      helm:
        releaseName: vm-operator
        values: |
          crds:
            plain: true
            cleanup:
              enabled: true
          operator:
            disable_prometheus_converter: false
            useCustomConfigReloader: true
          serviceMonitor:
            enabled: true

  # -----------------------------------------------------------
  # Component C: Data & Content Engine (VM Stack - Headless)
  # SyncWave: 10
  # -----------------------------------------------------------
  - name: vm-stack
    namespace: monitoring
    project: dev
    syncWave: "10"
    dependencies:
      - vm-operator
    source:
      repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-metrics-k8s-stack
      targetRevision: 0.63.6
      helm:
        releaseName: vm-stack
        values: |
          # Operator & Grafana disabled (managed separately)
          victoria-metrics-operator:
            enabled: false

          grafana:
            enabled: false
            forceDeployDatasource: false # The default datasouce managed from grafana, not vm-stack

          defaultDashboards:
            enabled: true
            defaultTimezone: Asia/Seoul
            labels:
              grafana_dashboard: "1"

          vmsingle:
            enabled: true
            spec:
              retentionPeriod: "30d"
              replicaCount: 1
              extraArgs:
                dedup.minScrapeInterval: "30s"
              storage:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 50Gi
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 2000m
                  memory: 4Gi

          vmagent:
            enabled: true
            spec:
              selectAllByDefault: true
              scrapeInterval: 30s
              externalLabels:
                cluster: homelab
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi

          vmalert:
            enabled: true
            spec:
              evaluationInterval: 30s
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

          alertmanager:
            enabled: true
            spec:
              replicaCount: 1
              configSecret: monitoring-managed-secrets  # Alertmanager config from managed secrets
            
            templates:
              - "/etc/vm/configs/**/*.tmpl"

            monzoTemplate:
              enabled: true

          defaultRules:
            create: true
            labels:
              cluster: homelab
            runbookUrl: "https://runbooks.prometheus-operator.dev/runbooks"
            disabled:
              EtcdHighNumberOfFailedGRPCRequests: true # Optimized for K3s Homelab

          kubelet:
            enabled: false # Managed via VMNodeScrape below

          kubeControllerManager:
            enabled: false
            service:
              enabled: false

          kubeScheduler:
            enabled: false
            service:
              enabled: false

          kubeEtcd:
            enabled: false

          coreDns:
            enabled: true

          kubeProxy:
            enabled: false  # Cilium

          # Dependencies
          prometheus-node-exporter:
            enabled: true
          kube-state-metrics:
            enabled: true

  # -----------------------------------------------------------
  # Component D: Pipeline Integrations (VMServiceScrapes)
  # SyncWave: 15
  # -----------------------------------------------------------
  - name: vm-stack-scrapes
    namespace: monitoring
    project: dev
    syncWave: "15"
    dependencies:
      - vm-stack
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: vm-stack-scrapes
        values: |
          resources:
            # -----------------------------------------------------------
            # Kubelet Scrapes (VMNodeScrape)
            # -----------------------------------------------------------
            - apiVersion: operator.victoriametrics.com/v1beta1
              kind: VMNodeScrape
              metadata:
                name: kubelet-metrics
                namespace: monitoring
              spec:
                path: /metrics
                port: https-metrics
                scheme: https
                tlsConfig:
                  insecureSkipVerify: true
                  caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabelConfigs:
                  - action: labeldrop
                    regex: (feature_node_kubernetes_io_.*|beta_kubernetes_io_.*|nvidia_com_.*|node_role_kubernetes_io_.*)
                metricRelabelConfigs:
                  - action: labeldrop
                    regex: (uid)

            - apiVersion: operator.victoriametrics.com/v1beta1
              kind: VMNodeScrape
              metadata:
                name: kubelet-cadvisor
                namespace: monitoring
              spec:
                path: /metrics/cadvisor
                port: https-metrics
                scheme: https
                tlsConfig:
                  insecureSkipVerify: true
                  caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabelConfigs:
                  - action: labeldrop
                    regex: (feature_node_kubernetes_io_.*|beta_kubernetes_io_.*|nvidia_com_.*|node_role_kubernetes_io_.*)
                metricRelabelConfigs:
                  - action: labeldrop
                    regex: (id|name|image_id)

            - apiVersion: operator.victoriametrics.com/v1beta1
              kind: VMNodeScrape
              metadata:
                name: kubelet-probes
                namespace: monitoring
              spec:
                path: /metrics/probes
                port: https-metrics
                scheme: https
                tlsConfig:
                  insecureSkipVerify: true
                  caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabelConfigs:
                  - action: labeldrop
                    regex: (feature_node_kubernetes_io_.*|beta_kubernetes_io_.*|nvidia_com_.*|node_role_kubernetes_io_.*)
                metricRelabelConfigs:
                  - action: labeldrop
                    regex: (uid|id|name)

            - apiVersion: operator.victoriametrics.com/v1beta1
              kind: VMNodeScrape
              metadata:
                name: kubelet-resources
                namespace: monitoring
              spec:
                path: /metrics/resource
                port: https-metrics
                scheme: https
                tlsConfig:
                  insecureSkipVerify: true
                  caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabelConfigs:
                  - action: labeldrop
                    regex: (feature_node_kubernetes_io_.*|beta_kubernetes_io_.*|nvidia_com_.*|node_role_kubernetes_io_.*)
                metricRelabelConfigs:
                  - action: labeldrop
                    regex: (uid|id|name)

            # -----------------------------------------------------------
            # Service Scrapes (VMServiceScrape)
            # -----------------------------------------------------------
            # Vector Metrics
            - apiVersion: operator.victoriametrics.com/v1beta1
              kind: VMServiceScrape
              metadata:
                name: vector-metrics
                namespace: monitoring
              spec:
                selector:
                  matchLabels:
                    app.kubernetes.io/name: vector
                endpoints:
                  - port: metrics
                    path: /metrics
                    interval: 30s

            # Quickwit Metrics
            - apiVersion: operator.victoriametrics.com/v1beta1
              kind: VMServiceScrape
              metadata:
                name: quickwit-metrics
                namespace: monitoring
              spec:
                selector:
                  matchLabels:
                    app.kubernetes.io/name: quickwit
                endpoints:
                  - port: rest
                    path: /metrics
                    interval: 30s

            # Redpanda Metrics (cross-namespace)
            - apiVersion: operator.victoriametrics.com/v1beta1
              kind: VMServiceScrape
              metadata:
                name: redpanda-metrics
                namespace: monitoring
              spec:
                namespaceSelector:
                  matchNames:
                    - redpanda
                selector:
                  matchLabels:
                    app.kubernetes.io/name: redpanda
                endpoints:
                  - port: admin
                    path: /public_metrics
                    interval: 30s
                    scheme: https
                    tlsConfig:
                      insecureSkipVerify: true