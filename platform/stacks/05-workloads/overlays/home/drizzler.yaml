apps:
  # -----------------------------------------------------------
  # Component A: Prerequisites (HTTPRoute, Secrets)
  # SyncWave: 0
  # -----------------------------------------------------------
  - name: drizzler-raw
    namespace: drizzler
    project: dev
    syncWave: "0"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: drizzler-raw
        values: |
          resources:
            # -----------------------------------------------------------
            # Drizzler Secrets (Infisical)
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-drizzler-secrets
                namespace: drizzler
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /drizzler
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-drizzler-secrets
                    secretNamespace: drizzler
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Drizzler PV for Downloads
            # -----------------------------------------------------------
            - apiVersion: v1
              kind: PersistentVolume
              metadata:
                name: pv-drizzler-downloads
              spec:
                capacity:
                  storage: 30Gi
                accessModes:
                  - ReadWriteOnce
                storageClassName: drizzler-local
                persistentVolumeReclaimPolicy: Retain
                volumeMode: Filesystem
                local:
                  path: /data/drizzler/downloads
                nodeAffinity:
                  required:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: In
                            values:
                              - aaron-lgt

            # -----------------------------------------------------------
            # Drizzler PVC for Downloads
            # -----------------------------------------------------------
            - apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: drizzler-downloads
                namespace: drizzler
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: drizzler-local
                resources:
                  requests:
                    storage: 30Gi

            # -----------------------------------------------------------
            # HTTPRoute for Cilium Gateway
            # -----------------------------------------------------------
            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: drizzler
                namespace: drizzler
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - drizzler.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: drizzler
                        port: 8000

  # -----------------------------------------------------------
  # Component B: Drizzler Helm Chart
  # SyncWave: 5
  # -----------------------------------------------------------
  - name: drizzler
    namespace: drizzler
    project: dev
    syncWave: "5"
    dependencies:
      - drizzler-raw
    source:
      repoURL: oci://ghcr.io/ziwon/drizzler
      chart: .
      targetRevision: 0.2.0
      helm:
        releaseName: drizzler
        values: |
          replicaCount: 1

          image:
            repository: ghcr.io/ziwon/drizzler
            pullPolicy: Always
            tag: "latest"

          imagePullSecrets:
            - name: ghcr-secret

          service:
            type: ClusterIP
            port: 8000

          # Ingress disabled - using HTTPRoute instead
          ingress:
            enabled: false

          persistence:
            enabled: true
            existingClaim: drizzler-downloads

          config:
            httpRequestTimeoutS: "10"
            llmModel: "gemini-3-flash-preview"

          # Reference existing secret from Infisical
          existingSecret: "managed-drizzler-secrets"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
