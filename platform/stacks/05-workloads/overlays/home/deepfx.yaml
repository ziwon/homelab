apps:
  # -----------------------------------------------------------
  # Component A: Prerequisites (HTTPRoutes)
  # SyncWave: 0
  # -----------------------------------------------------------
  - name: deepfx-raw
    namespace: deepfx
    project: dev
    syncWave: "0"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-raw
        values: |
          resources:

            # -----------------------------------------------------------
            # DeepFX Base Secrets for apps
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Shared screts for strategies
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-strategy-shared-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /strategies
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-strategy-shared-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Strategy Secrets: 010101
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-strategy-010101-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /strategies/010101
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-strategy-010101-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Strategy Secrets: 020101
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-strategy-020101-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /strategies/020101
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-strategy-020101-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Strategy Secrets: 030101
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-strategy-030101-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /strategies/030101
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-strategy-030101-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Dashboard Secrets
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-dashboard-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /dashboard
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-dashboard-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Feast Secrets
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-feast-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /feast
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-feast-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: mt5-bridge
                namespace: deepfx
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - mt5.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: deepfx-mt5-bridge
                        port: 3000

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: dashboard
                namespace: deepfx
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - deepfx.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: deepfx-live-dashboard
                        port: 8080

  # ------------------------------------------------------------------
  # Feast Registry Init Job
  # Uses feature-engine image which includes feast definitions
  # Run once to register feature views in Feast registry
  # ------------------------------------------------------------------
  - name: deepfx-feast-init
    namespace: deepfx
    project: dev
    syncWave: "3"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-raw
        values: |
          resources:
            - apiVersion: batch/v1
              kind: Job
              metadata:
                name: feast-apply-init
                namespace: deepfx
                annotations:
                  argocd.argoproj.io/hook: Sync
                  argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
              spec:
                ttlSecondsAfterFinished: 3600
                backoffLimit: 3
                template:
                  spec:
                    restartPolicy: OnFailure
                    imagePullSecrets:
                      - name: harbor-secret
                    containers:
                      - name: feast-apply
                        image: harbor.home.lab/restack/deepfx/feature-engine:latest
                        imagePullPolicy: Always
                        env:
                          - name: FEAST_REDIS_CONNECTION_STRING
                            valueFrom:
                              secretKeyRef:
                                name: managed-feast-secrets
                                key: redis-connection-string
                          - name: FEAST_CLICKHOUSE_HOST
                            value: "clickhouse.clickhouse.svc"
                          - name: FEAST_CLICKHOUSE_USER
                            value: "feast"
                          - name: FEAST_CLICKHOUSE_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: managed-feast-secrets
                                key: clickhouse-password
                                optional: true
                          - name: FEAST_REGISTRY_PATH
                            valueFrom:
                              secretKeyRef:
                                name: managed-feast-secrets
                                key: registry-path
                        workingDir: /app/feast
                        command:
                          - /bin/sh
                          - -c
                          - |
                            set -e
                            echo "=== Feast Apply Job ==="
                            echo "Timestamp: $(date -Iseconds)"

                            # Substitute env vars in feature_store.yaml
                            echo "Substituting environment variables..."
                            envsubst < /app/feast/feature_store.yaml > /tmp/feature_store.yaml
                            cp /tmp/feature_store.yaml /app/feast/feature_store.yaml

                            echo ""
                            echo "Feature store config:"
                            cat /app/feast/feature_store.yaml | grep -v password

                            echo ""
                            echo "Applying feature definitions..."
                            feast apply

                            echo ""
                            echo "=== Verification ==="
                            echo "Feature Views:"
                            feast feature-views list

                            echo ""
                            echo "Entities:"
                            feast entities list

                            echo ""
                            echo "=== Feast Apply Complete ==="
                        resources:
                          requests:
                            cpu: 100m
                            memory: 256Mi
                          limits:
                            cpu: 500m
                            memory: 512Mi

  # -----------------------------------------------------------
  # Component B: Install DeepFX Umbrella Chart
  # SyncWave: 5
  # -----------------------------------------------------------
  - name: deepfx
    namespace: deepfx
    project: dev
    syncWave: "5"
    dependencies:
      - deepfx-raw
    source:
      repoURL: oci://harbor.home.lab/restack/deepfx/deepfx
      chart: .
      targetRevision: 0.2.1
      helm:
        releaseName: deepfx
        values: |
          global:
            namespace: deepfx

          # -----------------------------------------------------------
          # DeepFX MT5 Bridge
          # -----------------------------------------------------------
          mt5-bridge:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/mt5-bridge
              pullPolicy: Always
              tag: main-f4434bc

            imagePullSecrets:
              - name: harbor-secret

            service:
              type: ClusterIP

            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                cpu: 2000m
                memory: 4Gi

            persistence:
              enabled: true
              storageClass: ""
              size: 10Gi

            config:
              logLevel: "INFO"
              mt5Path: "C:\\MT5\\terminal64.exe"

            existingSecret: "managed-deepfx-secrets"

          # -----------------------------------------------------------
          # DeepFX Data Collector
          # -----------------------------------------------------------
          data-collector:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/data-collector
              tag: "main-f4434bc"
              pullPolicy: IfNotPresent

            imagePullSecrets:
              - name: harbor-secret

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            kafka:
              brokers: "redpanda.redpanda.svc:9093"
              securityProtocol: "SASL_SSL"
              auth:
                username: "deepfx"
                passwordSecretName: "managed-deepfx-secrets"
                passwordSecretKey: "redpanda-deepfx-password"
                saslMechanism: "SCRAM-SHA-512"
              tls:
                caSecretName: "redpanda-ca"
                caSecretKey: "ca.crt"
                caFileName: "ca.crt"
                caMountPath: "/etc/ssl/certs/redpanda"
                caFilePath: "/etc/ssl/certs/redpanda/ca.crt"
                skipHostnameVerify: true

              tickTopic: "deepfx.market.tick"
              ohlcvTopic: "deepfx.market.ohlcv"

            collector:
              symbols: "NAS100,XAUUSD,USOUSD,BTCUSD,XAGUSD,EURGBP,AUDNZD,NZDCHF,US30,USDJPY,E\
                URUSD,GBPUSD"
              timeframes: "M1,M5,M15,H1,H4,D1"
              ohlcvInterval: 60
              logLevel: "INFO"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

          # -----------------------------------------------------------
          # DeepFX Account API
          # -----------------------------------------------------------
          account-api:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/account-api
              tag: main-f93b6d9
            mt5:
              host: deepfx-mt5-bridge

            existingSecret: "managed-deepfx-secrets"

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 010101
          # -----------------------------------------------------------
          strategy-010101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-f4434bc
            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            accountApi:
              url: "http://deepfx-account-api:8000"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-010101-secrets"

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 020101
          # -----------------------------------------------------------
          strategy-020101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-f4434bc
            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            accountApi:
              url: "http://deepfx-account-api:8000"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-020101-secrets"

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 030101
          # -----------------------------------------------------------
          strategy-030101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-5b5d062
            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            accountApi:
              url: "http://deepfx-account-api:8000"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-030101-secrets"

          # -----------------------------------------------------------
          # DeepFX Live Dashboard
          # -----------------------------------------------------------
          live-dashboard:
            enabled: true
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/live-dashboard
              tag: main-e63d767
            integrations:
              accountApiUrl: "http://deepfx-account-api:8000"
              mt5BridgeService: "deepfx-mt5-bridge:5555"
            existingSecret: "managed-deepfx-dashboard-secrets"
            service:
              type: ClusterIP
              port: 8080

          # -----------------------------------------------------------
          # DeepFX Feature Engine
          # -----------------------------------------------------------
          feature-engine:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/feature-engine
              tag: "main-0a0293a"

            imagePullSecrets:
              - name: harbor-secret

            kafka:
              brokers: "redpanda.redpanda.svc:9093"
              groupId: "deepfx.feature.engine"
              tickTopic: "deepfx.market.tick"
              ohlcvTopic: "deepfx.market.ohlcv"
              featureTopic: "deepfx.market.feature.latest"
              publishToKafka: true
              securityProtocol: "SASL_SSL"
              auth:
                username: "deepfx"
                passwordSecretName: "managed-deepfx-secrets"
                passwordSecretKey: "redpanda-deepfx-password"
                saslMechanism: "SCRAM-SHA-512"
              tls:
                caSecretName: "redpanda-ca"
                caSecretKey: "ca.crt"
                caFileName: "ca.crt"
                caMountPath: "/etc/ssl/certs/redpanda"
                caFilePath: "/etc/ssl/certs/redpanda/ca.crt"
                skipHostnameVerify: true
                sessionTimeoutMs: 60000
                heartbeatIntervalMs: 20000
                maxPollIntervalMs: 600000

            feast:
              enabled: true
              repoPath: "/app/feast"
              pushBatchSize: 50
              pushIntervalMs: 100
              secretName: "managed-feast-secrets"
              env:
                redisConnectionStringSecretKey: "redis-connection-string"
                clickhousePasswordSecretKey: "clickhouse-password"
                registryPathSecretKey: "registry-path"
                clickhouseHost: "clickhouse.clickhouse.svc"
                clickhouseUser: "feast"

            redis:
              url: "redis://redis-0.redis-headless.redis.svc:6379"
              auth:
                passwordSecretName: "managed-feast-secrets"
                passwordSecretKey: "redis-password"
              keyPrefix: "deepfx:feature:"
              ttlSeconds: 120

            engine:
              tickWindowSeconds: 10
              emitIntervalMs: 200
              logLevel: "INFO"

            resources:
              limits:
                cpu: 2000m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

          # -----------------------------------------------------------
          # DeepFX Nightly Dream RL
          # -----------------------------------------------------------
          nightly-dream:
            enabled: false

            imagePullSecrets:
              - name: harbor-secret

            image:
              repository: harbor.home.lab/restack/deepfx/nightly-dream
              tag: main-3d57991

            existingSecret: "managed-deepfx-nightly-dream-secrets"

            job:
              schedule: "0 22 * * *"
              lookbackHours: 24
              strategyInstanceIdsCsv: ""
              minTradesForAdjustment: 5
              artifactsDir: "/tmp/nightly-dream"
              uploadToS3: true
              logLevel: "INFO"

            database:
              secretName: "managed-deepfx-nightly-dream-secrets"
              secretKey: "FEATURE_ENGINE_DATABASE_DSN"

            s3:
              endpointUrl: "minio-green.minio-green.svc:9000"
              region: "us-east-1"
              bucket: "deepfx"
              prefix: "nightly-dream"
              verifyTls: false
              accessKeySecretName: "managed-deepfx-secrets"
              accessKeySecretKey: "s3-access-key"
              secretAccessKeySecretName: "managed-deepfx-secrets"
              secretAccessKeySecretKey: "s3-secret-key"
