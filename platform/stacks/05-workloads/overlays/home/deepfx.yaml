              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /strategies
                    credentialsRef:
                      secretName: infisical-secrets
