                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: deepfx-live-dashboard
                        port: 8080

            # -----------------------------------------------------------
            # Argo Workflows RBAC: 이노메 인증, k3s containerd에다가 박아버려야 하는데..
            # -----------------------------------------------------------
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: argo-harbor-secret-reader
                namespace: deepfx
              rules:
                - apiGroups: [""]
                  resources: ["secrets"]
                  resourceNames: ["harbor-secret"]
                  verbs: ["get"]

            - apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: argo-harbor-secret-reader-binding
                namespace: deepfx
              subjects:
                - kind: ServiceAccount
                  name: argo-workflows-workflow-controller
                  namespace: argo-workflows
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: argo-harbor-secret-reader

  # ------------------------------------------------------------------
  # Feast Registry Init Job
  # Uses feature-engine image which includes feast definitions
  # Run once to register feature views in Feast registry
  # ------------------------------------------------------------------
  - name: deepfx-feast-init
    namespace: deepfx
    project: dev
    syncWave: "3"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-raw
        values: |
          resources:
            - apiVersion: batch/v1
              kind: Job
              metadata:
                name: feast-apply-init
                namespace: deepfx
                annotations:
                  argocd.argoproj.io/hook: Sync
                  argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
              spec:
                ttlSecondsAfterFinished: 3600
                backoffLimit: 3
                template:
                  spec:
                    restartPolicy: OnFailure
                    imagePullSecrets:
                      - name: harbor-secret
                    containers:
                      - name: feast-apply
                        image: harbor.home.lab/restack/deepfx/feature-engine:latest
                        imagePullPolicy: Always
                        env:
                          - name: FEAST_REDIS_CONNECTION_STRING
                            valueFrom:
                              secretKeyRef:
                                name: managed-feast-secrets
                                key: redis-connection-string
                          - name: FEAST_CLICKHOUSE_HOST
                            value: "clickhouse.clickhouse.svc"
                          - name: FEAST_CLICKHOUSE_USER
                            value: "feast"
                          - name: FEAST_CLICKHOUSE_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: managed-feast-secrets
                                key: clickhouse-password
                                optional: true
                          - name: FEAST_REGISTRY_PATH
                            valueFrom:
                              secretKeyRef:
                                name: managed-feast-secrets
                                key: registry-path
                        workingDir: /app/feast
                        command:
                          - /bin/sh
                          - -c
                          - |
                            set -e
                            echo "=== Feast Apply Job ==="
                            echo "Timestamp: $(date -Iseconds)"

                            # Substitute env vars in feature_store.yaml
                            echo "Substituting environment variables..."
                            envsubst < /app/feast/feature_store.yaml > /tmp/feature_store.yaml
                            cp /tmp/feature_store.yaml /app/feast/feature_store.yaml

                            echo ""
                            echo "Feature store config:"
                            cat /app/feast/feature_store.yaml | grep -v password

                            echo ""
                            echo "Applying feature definitions..."
                            feast apply

                            echo ""
                            echo "=== Verification ==="
                            echo "Feature Views:"
                            feast feature-views list

                            echo ""
                            echo "Entities:"
                            feast entities list

                            echo ""
                            echo "=== Feast Apply Complete ==="
                        resources:
                          requests:
                            cpu: 100m
                            memory: 256Mi
                          limits:
                            cpu: 500m
                            memory: 512Mi

  # -----------------------------------------------------------
  # Component B: Install DeepFX Umbrella Chart
  # SyncWave: 5
  # -----------------------------------------------------------
  - name: deepfx
    namespace: deepfx
    project: dev
    syncWave: "5"
    dependencies:
      - deepfx-raw
    source:
      repoURL: oci://harbor.home.lab/restack/deepfx/deepfx
      chart: .
      targetRevision: 0.3.3
      helm:
        releaseName: deepfx
        values: |
          global:
            namespace: deepfx

          # -----------------------------------------------------------
          # DeepFX MT5 Bridge
          # -----------------------------------------------------------
          mt5-bridge:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/mt5-bridge
              pullPolicy: Always
              tag: main-edeb404

            imagePullSecrets:
              - name: harbor-secret

            service:
              type: ClusterIP

            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                cpu: 2000m
                memory: 4Gi

            persistence:
              enabled: true
              storageClass: ""
              size: 10Gi

            config:
              logLevel: "INFO"
              mt5Path: "C:\\MT5\\terminal64.exe"

            existingSecret: "managed-deepfx-secrets"

          # -----------------------------------------------------------
          # DeepFX Data Collector
          # -----------------------------------------------------------
          data-collector:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/data-collector
              tag: "main-86723fc"
              pullPolicy: IfNotPresent

            imagePullSecrets:
              - name: harbor-secret

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            kafka:
              brokers: "redpanda.redpanda.svc:9093"
              securityProtocol: "SASL_SSL"
              auth:
                username: "deepfx"
                passwordSecretName: "managed-deepfx-secrets"
                passwordSecretKey: "redpanda-deepfx-password"
                saslMechanism: "SCRAM-SHA-512"
              tls:
                caSecretName: "redpanda-ca"
                caSecretKey: "ca.crt"
                caFileName: "ca.crt"
                caMountPath: "/etc/ssl/certs/redpanda"
                caFilePath: "/etc/ssl/certs/redpanda/ca.crt"
                skipHostnameVerify: true

              tickTopic: "deepfx.market.tick"
              ohlcvTopic: "deepfx.market.ohlcv"

            collector:
              symbols: "NAS100,US30,XAUUSD,XAGUSD,USDCHF,CADCHF,EURUSD,GBPUSD,USDJPY,AUDUSD,N\
                ZDUSD,EURGBP,EURJPY,BTCUSD"
              timeframes: "M1,M5,M15,H1,H4,D1"
              ohlcvInterval: 60
              logLevel: "INFO"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

          # -----------------------------------------------------------
          # DeepFX Account API
          # -----------------------------------------------------------
          account-api:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/account-api
              tag: main-6c15072
            mt5:
              host: deepfx-mt5-bridge

            existingSecret: "managed-deepfx-secrets"

          # -----------------------------------------------------------
          # Slack Notification
          # -----------------------------------------------------------
          slackShared:
            enabled: true
            webhookUrlSecretName: "managed-deepfx-secrets"
            webhookUrlSecretKey: "slack-webhook-url"
            notifyEnters: true
            notifyExits: true
            notifySkips: false

          # -----------------------------------------------------------
          # Email Notification
          # -----------------------------------------------------------
          emailShared:
            secretName: "managed-deepfx-secrets"
            secretKey: "DEEPFX_EMAIL_NOTIFICATION"

          # -----------------------------------------------------------
          # DeepFX Strategy Guardian
          # -----------------------------------------------------------
          strategy-guardian:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-guardian
              tag: main-c576af0
            mode: "shadow"
            logLevel: "DEBUG"
            guardianInstanceId: "strategy-guardian"
            existingSecret: "managed-deepfx-strategy-guardian-secrets"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556
              timeoutMs: 15000

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 010101
          # -----------------------------------------------------------
          strategy-010101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-d767610
            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            accountApi:
              url: "http://deepfx-account-api:8000"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-010101-secrets"

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 020101
          # -----------------------------------------------------------
          strategy-020101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-d767610
            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            accountApi:
              url: "http://deepfx-account-api:8000"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-020101-secrets"

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 030101
          # -----------------------------------------------------------
          strategy-030101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-d767610
            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            accountApi:
              url: "http://deepfx-account-api:8000"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-030101-secrets"

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 040101
          # -----------------------------------------------------------
          strategy-040101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: latest
            mode: "live"
            logLevel: "INFO"

            strategyInstanceId: "strategy-040101"
            strategyVersion: "zrevert-v1.0"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-040101-secrets"

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556
              timeoutMs: 15000

            accountApi:
              url: "http://deepfx-account-api:8000"

            featureEngine:
              enabled: true
              redisUrl: "redis://redis-0.redis-headless.redis.svc:6379"
              redisPasswordSecretName: "managed-feast-secrets"
              redisPasswordSecretKey: "redis-password"
              keyPrefix: "deepfx:feature:"

            feast:
              enabled: false
              repoPath: "/app/feast"
              secretName: "managed-feast-secrets"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 040102
          # -----------------------------------------------------------
          strategy-040102:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: latest
            mode: "live"
            logLevel: "INFO"

            strategyInstanceId: "strategy-040102"
            strategyVersion: "zrevert-v1.0"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-040102-secrets"

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556
              timeoutMs: 15000

            accountApi:
              url: "http://deepfx-account-api:8000"

            featureEngine:
              enabled: true
              redisUrl: "redis://redis-0.redis-headless.redis.svc:6379"
              redisPasswordSecretName: "managed-feast-secrets"
              redisPasswordSecretKey: "redis-password"
              keyPrefix: "deepfx:feature:"

            feast:
              enabled: false
              repoPath: "/app/feast"
              secretName: "managed-feast-secrets"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

          # -----------------------------------------------------------
          # DeepFX Live Dashboard
          # -----------------------------------------------------------
          live-dashboard:
            enabled: true
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/live-dashboard
              tag: main-e63d767
            integrations:
              accountApiUrl: "http://deepfx-account-api:8000"
              mt5BridgeService: "deepfx-mt5-bridge:5555"
            existingSecret: "managed-deepfx-dashboard-secrets"
            service:
              type: ClusterIP
              port: 8080

          # -----------------------------------------------------------
          # DeepFX Feature Engine
          # -----------------------------------------------------------
          feature-engine:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/feature-engine
              tag: "main-6550bc2"

            imagePullSecrets:
              - name: harbor-secret

            kafka:
              brokers: "redpanda.redpanda.svc:9093"
              groupId: "deepfx.feature.engine"
              tickTopic: "deepfx.market.tick"
              ohlcvTopic: "deepfx.market.ohlcv"
              featureTopic: "deepfx.market.feature.latest"
              publishToKafka: true
              securityProtocol: "SASL_SSL"
              auth:
                username: "deepfx"
                passwordSecretName: "managed-deepfx-secrets"
                passwordSecretKey: "redpanda-deepfx-password"
                saslMechanism: "SCRAM-SHA-512"
              tls:
                caSecretName: "redpanda-ca"
                caSecretKey: "ca.crt"
                caFileName: "ca.crt"
                caMountPath: "/etc/ssl/certs/redpanda"
                caFilePath: "/etc/ssl/certs/redpanda/ca.crt"
                skipHostnameVerify: true
                sessionTimeoutMs: 60000
                heartbeatIntervalMs: 20000
                maxPollIntervalMs: 600000

            feast:
              enabled: true
              repoPath: "/app/feast"
              pushBatchSize: 50
              pushIntervalMs: 100
              secretName: "managed-feast-secrets"
              env:
                redisConnectionStringSecretKey: "redis-connection-string"
                clickhousePasswordSecretKey: "clickhouse-password"
                registryPathSecretKey: "registry-path"
                clickhouseHost: "clickhouse.clickhouse.svc"
                clickhouseUser: "feast"

            redis:
              url: "redis://redis-0.redis-headless.redis.svc:6379"
              auth:
                passwordSecretName: "managed-feast-secrets"
                passwordSecretKey: "redis-password"
              keyPrefix: "deepfx:feature:"
              ttlSeconds: 120

            engine:
              tickWindowSeconds: 10
              emitIntervalMs: 200
              logLevel: "INFO"

            resources:
              limits:
                cpu: 2000m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

  - name: deepfx-ml-workflows
    namespace: deepfx
    project: dev
    syncWave: "20"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-ml-workflows
        values: |
          resources:
            # -----------------------------------------------------------
            # DeepFX ML Workflows - Nightly Dream Tunner
            # -----------------------------------------------------------
            - apiVersion: argoproj.io/v1alpha1
              kind: CronWorkflow
              metadata:
                name: nightly-dream
                namespace: deepfx
              spec:
                schedule: "0 06 * * *"
                timezone: "Asia/Seoul"
                concurrencyPolicy: Forbid
                workflowSpec:
                  entrypoint: nightly-dream
                  onExit: exit-handler
                  imagePullSecrets:
                    - name: harbor-secret
                  templates:
                    - name: nightly-dream
                      container:
                        image: harbor.home.lab/restack/deepfx/nightly-dream:latest
                        envFrom:
                          - secretRef:
                              name: managed-deepfx-nightly-dream-secrets
                    - name: exit-handler
                      steps:
                        - - name: notify
                            templateRef:
                              name: global-slack-notification
                              template: send-notification
                              clusterScope: true
                            arguments:
                              parameters:
                                - name: status
                                  value: "{{workflow.status}}"
                                - name: name
                                  value: "{{workflow.name}}"
                                - name: namespace
                                  value: "{{workflow.namespace}}"
                                - name: link
                                  value: "https://wf.home.lab/workflows/{{workflow.namespace}}/{{workflow.name}}?tab=workflow"

            # -----------------------------------------------------------
            # DeepFX ML Workflows - RL Trainer
            # -----------------------------------------------------------
            - apiVersion: argoproj.io/v1alpha1
              kind: WorkflowTemplate
              metadata:
                name: rl-trainer
                namespace: deepfx
              spec:
                entrypoint: train
                onExit: exit-handler
                imagePullSecrets:
                  - name: harbor-secret
                templates:
                  - name: train
                    container:
                      image: harbor.home.lab/restack/deepfx/rl-trainer:latest
                      args: ["train", "--algorithm", "ppo", "--iterations", "100"]
                      env:
                        - name: RAY_ADDRESS
                          value: "ray://ray.home.lab:10001"
                        - name: RAY_STORAGE_PATH
                          value: "/data/ray/storage"
                  - name: exit-handler
                    steps:
                      - name: notify
                        templateRef:
                          name: global-slack-notification
                          template: send-notification
                          clusterScope: true
                        arguments:
                          parameters:
                            - name: status
                              value: "{{workflow.status}}"
                            - name: name
                              value: "{{workflow.name}}"
                            - name: namespace
                              value: "{{workflow.namespace}}"
                            - name: link
                              value: "https://wf.home.lab/workflows/{{workflow.namespace}}/{{workflow.name}}?tab=workflow"
