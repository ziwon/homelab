                suspend: true
                schedule: "*/15 * * * *"
                timeZone: "Asia/Seoul"
                concurrencyPolicy: Forbid
                successfulJobsHistoryLimit: 3
                failedJobsHistoryLimit: 3
                jobTemplate:
                  spec:
                    backoffLimit: 0
                    activeDeadlineSeconds: 1800
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: strategy-010102-kronos-shadow-signal
                          app.kubernetes.io/component: shadow-signal
                          app.kubernetes.io/part-of: deepfx
                      spec:
                        serviceAccountName: strategy-010102-kronos-shadow-signal
                        restartPolicy: Never
                        imagePullSecrets:
                          - name: harbor-secret
                        volumes:
                          - name: kronos-runtime-secrets
                            emptyDir:
                              medium: Memory
                          - name: kronos-model-cache
                            hostPath:
                              path: /data/LLM/models
                              type: DirectoryOrCreate
                          - name: mps-pipe
                            hostPath:
                              path: /cache/nvidia-mps/pipe
                              type: DirectoryOrCreate
                          - name: mps-log
                            hostPath:
                              path: /cache/nvidia-mps/log
                              type: DirectoryOrCreate
                        initContainers:
                          - name: load-clickhouse-secret
                            image: harbor.home.lab/restack/deepfx/strategy-010102-kronos:main-02acbc1
                            imagePullPolicy: IfNotPresent
                            command:
                              - python
                              - -c
                              - |
                                import base64
                                import json
                                import ssl
                                import urllib.request

                                token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read().strip()
                                ca = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
                                req = urllib.request.Request(
                                    'https://kubernetes.default.svc/api/v1/namespaces/clickhouse/secrets/clickhouse-managed-secrets',
                                    headers={'Authorization': f'Bearer {token}'},
                                )
                                ctx = ssl.create_default_context(cafile=ca)
                                with urllib.request.urlopen(req, context=ctx, timeout=30) as res:
                                    secret = json.load(res)
                                password = base64.b64decode(secret['data']['DEEPFX_PASSWORD_PLAIN'])
                                with open('/var/run/kronos-secrets/clickhouse-password', 'wb') as f:
                                    f.write(password)
                            volumeMounts:
                              - name: kronos-runtime-secrets
                                mountPath: /var/run/kronos-secrets
                        containers:
                          - name: kronos-shadow-signal
                            image: harbor.home.lab/restack/deepfx/strategy-010102-kronos:main-02acbc1
                            imagePullPolicy: IfNotPresent
                            workingDir: /workspace
                            env:
                              - name: NVIDIA_VISIBLE_DEVICES
                                value: all
                              - name: NVIDIA_DRIVER_CAPABILITIES
                                value: compute,utility
                              - name: HF_HOME
                                value: /models/hugging-quants/kronos-hf
                              - name: HUGGINGFACE_HUB_CACHE
                                value: /models/hugging-quants/kronos-hf/hub
                              - name: TRANSFORMERS_CACHE
                                value: /models/hugging-quants/kronos-hf/transformers
                              - name: PYTORCH_ALLOC_CONF
                                value: expandable_segments:True
                              - name: CH_URL
                                value: http://clickhouse.clickhouse.svc:8123
                              - name: CH_USER
                                value: deepfx
                              - name: PG_DSN
                                valueFrom:
                                  secretKeyRef:
                                    name: managed-deepfx-dashboard-secrets
                                    key: DASHBOARD_DATABASE_DSN
                            command:
                              - /bin/bash
                              - -lc
                              - |
                                set -euo pipefail
                                export CH_PASS="$(cat /var/run/kronos-secrets/clickhouse-password)"
                                mkdir -p /tmp/kronos

                                python research/strategy-010102/scripts/export_clickhouse_ohlcv.py \
                                  --symbols XAGUSD,XAUUSD \
                                  --timeframe M5 \
                                  --since-hours 168 \
                                  --limit 50000 \
                                  --output /tmp/kronos/ohlcv_m5_recent.csv

                                python - <<'PY'
                                import csv
                                from pathlib import Path
                                src = Path('/tmp/kronos/ohlcv_m5_recent.csv')
                                dst = Path('/tmp/kronos/ohlcv_m5_recent_dedup.csv')
                                seen = set()
                                rows = []
                                total = 0
                                with src.open(newline='') as f:
                                    reader = csv.DictReader(f)
                                    fieldnames = reader.fieldnames or []
                                    for row in reader:
                                        total += 1
                                        key = (row.get('symbol'), row.get('timeframe'), row.get('time'))
                                        if key in seen:
                                            continue
                                        seen.add(key)
                                        rows.append(row)
                                with dst.open('w', newline='') as f:
                                    writer = csv.DictWriter(f, fieldnames=fieldnames)
                                    writer.writeheader()
                                    writer.writerows(rows)
                                print(f"dedup_rows={len(rows)} dropped={total - len(rows)}")
                                PY

                                python research/strategy-010102/scripts/kronos_latest_signal.py \
                                  --run-model \
                                  --input /tmp/kronos/ohlcv_m5_recent_dedup.csv \
