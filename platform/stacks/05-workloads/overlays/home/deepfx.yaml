  - name: deepfx-raw
    namespace: deepfx
    project: dev
    syncWave: "0"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-raw
        values: |
          resources:

