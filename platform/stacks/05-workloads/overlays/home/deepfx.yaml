                kind: Role
                name: strategy-010102-kronos-clickhouse-secret-reader

            - apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: strategy-010102-kronos-shadow-signal
                namespace: deepfx
                labels:
                  app.kubernetes.io/name: strategy-010102-kronos-shadow-signal
                  app.kubernetes.io/component: shadow-signal
                  app.kubernetes.io/part-of: deepfx
                  app.kubernetes.io/managed-by: argocd
              spec:
