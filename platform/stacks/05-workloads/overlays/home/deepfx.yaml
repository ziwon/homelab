                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-dashboard-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Feast Secrets
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-feast-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /feast
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
