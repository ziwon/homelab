                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /guardian
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-strategy-guardian-secrets
