apps:
  # -----------------------------------------------------------
  # Component A: Prerequisites (HTTPRoutes)
  # SyncWave: 0
  # -----------------------------------------------------------
  - name: deepfx-raw
    namespace: deepfx
    project: dev
    syncWave: "0"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-raw
        values: |
          resources:

            # -----------------------------------------------------------
            # DeepFX Base Secrets for apps
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Shared screts for strategies
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-strategy-shared-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /strategies
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-strategy-shared-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Strategy Secrets: 010101
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-strategy-010101-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /strategies/010101
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-strategy-010101-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Strategy Secrets: 020101
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-strategy-020101-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /strategies/020101
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-strategy-020101-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Dashboard Secrets
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-dashboard-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /dashboard
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-dashboard-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner


            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: mt5-bridge
                namespace: deepfx
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - mt5.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: deepfx-mt5-bridge
                        port: 3000

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: dashboard
                namespace: deepfx
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - deepfx.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: deepfx-live-dashboard
                        port: 8080

  # -----------------------------------------------------------
  # Component B: Install DeepFX Umbrella Chart
  # SyncWave: 5
  # -----------------------------------------------------------
  - name: deepfx
    namespace: deepfx
    project: dev
    syncWave: "5"
    dependencies:
      - deepfx-raw
    source:
      repoURL: oci://harbor.home.lab/restack/deepfx/deepfx
      chart: .
      targetRevision: 0.1.11
      helm:
        releaseName: deepfx
        values: |
          global:
            namespace: deepfx

          # -----------------------------------------------------------
          # DeepFX MT5 Bridge
          # -----------------------------------------------------------
          mt5-bridge:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/mt5-bridge
              pullPolicy: Always
              tag: main-8b6456b

            imagePullSecrets:
              - name: harbor-secret

            service:
              type: ClusterIP

            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                cpu: 2000m
                memory: 4Gi

            persistence:
              enabled: true
              storageClass: ""
              size: 10Gi

            config:
              logLevel: "INFO"
              mt5Path: "C:\\MT5\\terminal64.exe"

            existingSecret: "managed-deepfx-secrets"

          # -----------------------------------------------------------
          # DeepFX Data Collector
          # -----------------------------------------------------------
          data-collector:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/data-collector
              tag: "main-1b64e33"
              pullPolicy: IfNotPresent

            imagePullSecrets:
              - name: harbor-secret

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            kafka:
              brokers: "redpanda.redpanda.svc:9093"
              securityProtocol: "SASL_SSL"
              auth:
                username: "deepfx"
                passwordSecretName: "managed-deepfx-secrets"
                passwordSecretKey: "redpanda-deepfx-password"
                saslMechanism: "SCRAM-SHA-512"
              tls:
                caSecretName: "redpanda-ca"
                caSecretKey: "ca.crt"
                caFileName: "ca.crt"
                caMountPath: "/etc/ssl/certs/redpanda"
                caFilePath: "/etc/ssl/certs/redpanda/ca.crt"
                skipHostnameVerify: true

              tickTopic: "deepfx.market.tick"
              ohlcvTopic: "deepfx.market.ohlcv"

            collector:
              symbols: "NAS100,XAUUSD,USOUSD,BTCUSD"
              timeframes: "M1,M5,M15,H1,H4,D1"
              ohlcvInterval: 60
              logLevel: "INFO"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

          # -----------------------------------------------------------
          # DeepFX Account API
          # -----------------------------------------------------------
          account-api:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/account-api
              tag: main-1b64e33
            mt5:
              host: deepfx-mt5-bridge

            existingSecret: "managed-deepfx-secrets"

          strategy-010101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-a86eba6
            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            accountApi:
              url: "http://deepfx-account-api:8000"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-010101-secrets"

          strategy-020101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-d214430
            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            accountApi:
              url: "http://deepfx-account-api:8000"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-020101-secrets"

          live-dashboard:
            enabled: true
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/live-dashboard
              tag: main-4a7d65d
            integrations:
              accountApiUrl: "http://deepfx-account-api:8000"
              mt5BridgeService: "deepfx-mt5-bridge:5555"
            existingSecret: "managed-deepfx-dashboard-secrets"
            service:
              type: ClusterIP
              port: 8080

          # -----------------------------------------------------------
          # Future: Feature Engine, NightDreams-RL
          # -----------------------------------------------------------
          # - name: feature-engine
          #   namespace: deepfx
          #   project: home
          #   syncWave: "10"
