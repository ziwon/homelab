                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # H4 writer authentication stays separate from broker credentials.
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-h4-writer
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: home
                      secretsPath: /h4-writer
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-h4-writer
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # H4 connections use explicit keys without the legacy shared environment.
