                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /nightly-dream
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
