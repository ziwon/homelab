                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /strategies/040101
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-strategy-040101-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Strategy Secrets: 040102
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
