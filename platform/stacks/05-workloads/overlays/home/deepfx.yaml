apps:
  # -----------------------------------------------------------
  # Component A: Prerequisites (HTTPRoutes)
  # SyncWave: 0
  # -----------------------------------------------------------
  - name: deepfx-raw
    namespace: deepfx
    project: dev
    syncWave: "0"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: mt5-bridge
                namespace: deepfx
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - mt5.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: mt5-bridge
                        port: 3000

  # -----------------------------------------------------------
  # Component B: Install DeepFX Umbrella Chart
  # SyncWave: 5
  # -----------------------------------------------------------
  - name: deepfx
    namespace: deepfx
    project: dev
    syncWave: "5"
    dependencies:
      - deepfx-raw
    source:
      repoURL: oci://harbor.home.lab/restack/deepfx/deepfx
      chart: .
      targetRevision: 0.1.0
      helm:
        releaseName: deepfx
        values: |
          global:
            namespace: deepfx

          mt5-bridge:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/mt5-bridge
              pullPolicy: Always
              tag: main-5e25ca5

            imagePullSecrets:
              - name: harbor-secret

            service:
              type: ClusterIP

            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                cpu: 2000m
                memory: 4Gi

            persistence:
              enabled: true
              storageClass: ""
              size: 10Gi

            config:
              logLevel: "INFO"

            existingSecret: "managed-deepfx-secrets"
