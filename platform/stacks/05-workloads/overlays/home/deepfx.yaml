apps:
  # -----------------------------------------------------------
  # Component A: Prerequisites (HTTPRoutes)
  # SyncWave: 0
  # -----------------------------------------------------------
  - name: deepfx-raw
    namespace: deepfx
    project: dev
    syncWave: "0"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-secrets
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: "home"
                      secretsPath: /
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-deepfx-secrets
                    secretNamespace: deepfx
                    creationPolicy: Owner

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: mt5-bridge
                namespace: deepfx
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - mt5.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: deepfx-mt5-bridge
                        port: 3000

  # -----------------------------------------------------------
  # Component B: Install DeepFX Umbrella Chart
  # SyncWave: 5
  # -----------------------------------------------------------
  - name: deepfx
    namespace: deepfx
    project: dev
    syncWave: "5"
    dependencies:
      - deepfx-raw
    source:
      repoURL: oci://harbor.home.lab/restack/deepfx/deepfx
      chart: .
      targetRevision: 0.1.5
      helm:
        releaseName: deepfx
        values: |
          global:
            namespace: deepfx

          # -----------------------------------------------------------
          # DeepFX MT5 Bridge
          # -----------------------------------------------------------
          mt5-bridge:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/mt5-bridge
              pullPolicy: Always
              tag: main-107b1e9

            imagePullSecrets:
              - name: harbor-secret

            service:
              type: ClusterIP

            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                cpu: 2000m
                memory: 4Gi

            persistence:
              enabled: true
              storageClass: ""
              size: 10Gi

            config:
              logLevel: "INFO"
              mt5Path: "C:\\MT5\\terminal64.exe"

            existingSecret: "managed-deepfx-secrets"

          # -----------------------------------------------------------
          # DeepFX Data Collector
          # -----------------------------------------------------------
          data-collector:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/data-collector
              tag: "main-a6d6193"
              pullPolicy: IfNotPresent

            imagePullSecrets:
              - name: harbor-secret

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            kafka:
              brokers: "redpanda.redpanda.svc:9093"
              securityProtocol: "SASL_SSL"
              auth:
                username: "deepfx"
                passwordSecretName: "managed-deepfx-secrets"
                passwordSecretKey: "redpanda-deepfx-password"
                saslMechanism: "SCRAM-SHA-512"
              tls:
                caSecretName: "redpanda-ca"
                caSecretKey: "ca.crt"
                caFileName: "ca.crt"
                caMountPath: "/etc/ssl/certs/redpanda"
                caFilePath: "/etc/ssl/certs/redpanda/ca.crt"
                skipHostnameVerify: true

              tickTopic: "deepfx.market.tick"
              ohlcvTopic: "deepfx.market.ohlcv"

            collector:
              symbols: "NAS100,XAUUSD,USOUSD,BTCUSD"
              timeframes: "M1,M5,M15,H1,H4,D1"
              ohlcvInterval: 60
              logLevel: "INFO"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

          # -----------------------------------------------------------
          # DeepFX Account API
          # -----------------------------------------------------------
          account-api:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/account-api
              tag: main-cb41def
            mt5:
              host: deepfx-mt5-bridge

            existingSecret: "managed-deepfx-secrets"
            # Will be injected from Infisical secrets
            # risk:
            #   riskPerTradePct: 1.0
            #   maxDailyDrawdownPct: 5.0
            #   maxTotalDrawdownPct: 10.0
            #   maxOpenPositions: 10
            #   tradingEnabled: true
            #   closeOnlyMode: false

            # -----------------------------------------------------------
            # Future: Feature Engine, Strategy Engine, NightDreams-RL
            # -----------------------------------------------------------
            # - name: feature-engine
            #   namespace: deepfx
            #   project: home
            #   syncWave: "10"
