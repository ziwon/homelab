                        imagePullPolicy: IfNotPresent
                        command: [python, /migration/migrate.py]
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: [ALL]
                        env:
                          - name: PG_SCHEMA
                            value: deepfx
                          - name: PG_DSN
                            valueFrom:
                              secretKeyRef: {name: managed-deepfx-h4-connections, key: PG_DSN}
                          - name: CH_URL
                            valueFrom:
                              secretKeyRef: {name: managed-deepfx-h4-connections, key: CH_URL}
                          - name: CH_USER
