                    secretNamespace: deepfx
                    creationPolicy: Owner

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: mt5-bridge
                namespace: deepfx
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - mt5.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: deepfx-mt5-bridge
                        port: 3000

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: dashboard
                namespace: deepfx
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - deepfx.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: deepfx-live-dashboard
                        port: 8080

            # -----------------------------------------------------------
            # Argo Workflows RBAC: 이노메 인증, k3s containerd에다가 박아버려야 하는데..
            # -----------------------------------------------------------
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: argo-harbor-secret-reader
                namespace: deepfx
              rules:
                - apiGroups: [""]
                  resources: ["secrets"]
                  resourceNames: ["harbor-secret"]
                  verbs: ["get"]

            - apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: argo-harbor-secret-reader-binding
                namespace: deepfx
              subjects:
                - kind: ServiceAccount
                  name: argo-workflows-workflow-controller
                  namespace: argo-workflows
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: argo-harbor-secret-reader

  # ------------------------------------------------------------------
  # Feast Registry Init Job
  # Uses feature-engine image which includes feast definitions
  # Run once to register feature views in Feast registry
  # ------------------------------------------------------------------
  - name: deepfx-feast-init
    namespace: deepfx
    project: dev
    syncWave: "3"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-raw
        values: |
          resources:
            - apiVersion: batch/v1
              kind: Job
              metadata:
                name: feast-apply-init
                namespace: deepfx
                annotations:
                  argocd.argoproj.io/hook: Sync
                  argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
              spec:
                ttlSecondsAfterFinished: 3600
                backoffLimit: 3
                template:
                  spec:
                    restartPolicy: OnFailure
                    imagePullSecrets:
                      - name: harbor-secret
                    containers:
                      - name: feast-apply
                        image: harbor.home.lab/restack/deepfx/feature-engine:latest
                        imagePullPolicy: Always
                        env:
                          - name: FEAST_REDIS_CONNECTION_STRING
                            valueFrom:
                              secretKeyRef:
                                name: managed-feast-secrets
                                key: redis-connection-string
                          - name: FEAST_CLICKHOUSE_HOST
                            value: "clickhouse.clickhouse.svc"
                          - name: FEAST_CLICKHOUSE_USER
                            value: "feast"
                          - name: FEAST_CLICKHOUSE_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: managed-feast-secrets
                                key: clickhouse-password
                                optional: true
                          - name: FEAST_REGISTRY_PATH
                            valueFrom:
                              secretKeyRef:
                                name: managed-feast-secrets
                                key: registry-path
                        workingDir: /app/feast
                        command:
                          - /bin/sh
                          - -c
                          - |
                            set -e
                            echo "=== Feast Apply Job ==="
                            echo "Timestamp: $(date -Iseconds)"

                            # Substitute env vars in feature_store.yaml
                            echo "Substituting environment variables..."
                            envsubst < /app/feast/feature_store.yaml > /tmp/feature_store.yaml
                            cp /tmp/feature_store.yaml /app/feast/feature_store.yaml

                            echo ""
                            echo "Feature store config:"
                            cat /app/feast/feature_store.yaml | grep -v password

                            echo ""
                            echo "Applying feature definitions..."
                            feast apply

                            echo ""
                            echo "=== Verification ==="
                            echo "Feature Views:"
                            feast feature-views list

                            echo ""
                            echo "Entities:"
                            feast entities list

                            echo ""
                            echo "=== Feast Apply Complete ==="
                        resources:
                          requests:
                            cpu: 100m
                            memory: 256Mi
                          limits:
                            cpu: 500m
                            memory: 512Mi

  # -----------------------------------------------------------
  # Component B: Install DeepFX Umbrella Chart
  # SyncWave: 5
  # -----------------------------------------------------------
  - name: deepfx
    namespace: deepfx
    project: dev
    syncWave: "5"
    dependencies:
      - deepfx-raw
    source:
      repoURL: oci://harbor.home.lab/restack/deepfx/deepfx
      chart: .
      targetRevision: 0.3.4
      helm:
        releaseName: deepfx
        values: |
          global:
            namespace: deepfx

          # -----------------------------------------------------------
          # DeepFX MT5 Bridge
          # -----------------------------------------------------------
          mt5-bridge:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/mt5-bridge
              pullPolicy: Always
              tag: main-51dcc9c

            imagePullSecrets:
              - name: harbor-secret

            service:
              type: ClusterIP

            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                cpu: 2000m
                memory: 4Gi

            persistence:
              enabled: true
              storageClass: ""
              size: 10Gi

            config:
              logLevel: "INFO"
              mt5Path: "C:\\MT5\\terminal64.exe"

            existingSecret: "managed-deepfx-secrets"

          # -----------------------------------------------------------
          # DeepFX Data Collector
          # -----------------------------------------------------------
          data-collector:
            enabled: true
            replicaCount: 1

            image:
              repository: harbor.home.lab/restack/deepfx/data-collector
              tag: "main-51dcc9c"
              pullPolicy: IfNotPresent

            imagePullSecrets:
              - name: harbor-secret

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            kafka:
              brokers: "redpanda.redpanda.svc:9093"
              securityProtocol: "SASL_SSL"
              auth:
                username: "deepfx"
                passwordSecretName: "managed-deepfx-secrets"
                passwordSecretKey: "redpanda-deepfx-password"
                saslMechanism: "SCRAM-SHA-512"
              tls:
                caSecretName: "redpanda-ca"
                caSecretKey: "ca.crt"
                caFileName: "ca.crt"
                caMountPath: "/etc/ssl/certs/redpanda"
                caFilePath: "/etc/ssl/certs/redpanda/ca.crt"
                skipHostnameVerify: true

              tickTopic: "deepfx.market.tick"
              ohlcvTopic: "deepfx.market.ohlcv"

            collector:
              symbols: "NAS100,US30,XAUUSD,XAGUSD,USDCHF,CADCHF,EURUSD,GBPUSD,USDJPY,AUDUSD,N\
                ZDUSD,EURGBP,EURJPY,BTCUSD"
              timeframes: "M1,M5,M15,H1,H4,D1"
              ohlcvInterval: 60
              logLevel: "INFO"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

          # -----------------------------------------------------------
          # DeepFX Account API
          # -----------------------------------------------------------
          account-api:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/account-api
              tag: main-51dcc9c
            mt5:
              host: deepfx-mt5-bridge

            existingSecret: "managed-deepfx-secrets"

          # -----------------------------------------------------------
          # Slack Notification
          # -----------------------------------------------------------
          slackShared:
            enabled: true
            webhookUrlSecretName: "managed-deepfx-secrets"
            webhookUrlSecretKey: "slack-webhook-url"
            notifyEnters: true
            notifyExits: true
            notifySkips: false

          # -----------------------------------------------------------
          # Email Notification
          # -----------------------------------------------------------
          emailShared:
            secretName: "managed-deepfx-secrets"
            secretKey: "DEEPFX_EMAIL_NOTIFICATION"

          # -----------------------------------------------------------
          # DeepFX Strategy Guardian
          # -----------------------------------------------------------
          strategy-guardian:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-guardian
              tag: main-db0565c
            mode: "shadow"
            logLevel: "DEBUG"
            guardianInstanceId: "strategy-guardian"
            existingSecret: "managed-deepfx-strategy-guardian-secrets"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556
              timeoutMs: 15000

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 010101
          # -----------------------------------------------------------
          strategy-010101:
            enabled: false
            replicaCount: 0
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-8d0b060
            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            accountApi:
              url: "http://deepfx-account-api:8000"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-010101-secrets"

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 010102 (Double-B v2 live)
          # -----------------------------------------------------------
          strategy-010102:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-54cbc4a
            mode: "live"
            logLevel: "INFO"
            strategyInstanceId: "strategy-010102"
            strategyVersion: "v2"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556
              timeoutMs: 15000

            accountApi:
              url: "http://deepfx-account-api:8000"

            slack:
              enabled: false
              notifyEnters: false
              notifyExits: false
              notifySkips: true
              notifyUpdates: false

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            # Strategy config (symbols, gates, budgets) comes from Infisical:
            # /strategies/010102 → DEEPFX_STRATEGY_CONFIG / DEEPFX_DOUBLE_B_CONFIG
            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-010102-secrets"

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 020101
          # -----------------------------------------------------------
          strategy-020101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-54cbc4a
            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            accountApi:
              url: "http://deepfx-account-api:8000"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-020101-secrets"

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 030101
          # -----------------------------------------------------------
          strategy-030101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: main-54cbc4a
            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556

            accountApi:
              url: "http://deepfx-account-api:8000"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-030101-secrets"

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 040101
          # -----------------------------------------------------------
          strategy-040101:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: latest
            mode: "live"
            logLevel: "INFO"

            strategyInstanceId: "strategy-040101"
            strategyVersion: "zrevert-v1.0"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-040101-secrets"

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556
              timeoutMs: 15000

            accountApi:
              url: "http://deepfx-account-api:8000"

            featureEngine:
              enabled: true
              redisUrl: "redis://redis-0.redis-headless.redis.svc:6379"
              redisPasswordSecretName: "managed-feast-secrets"
              redisPasswordSecretKey: "redis-password"
              keyPrefix: "deepfx:feature:"

            feast:
              enabled: false
              repoPath: "/app/feast"
              secretName: "managed-feast-secrets"

            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

          # -----------------------------------------------------------
          # DeepFX Strategy Engine - 040102
          # -----------------------------------------------------------
          strategy-040102:
            enabled: true
            replicaCount: 1
            imagePullSecrets:
              - name: harbor-secret
            image:
              repository: harbor.home.lab/restack/deepfx/strategy-engine
              tag: latest
            mode: "live"
            logLevel: "INFO"

            strategyInstanceId: "strategy-040102"
            strategyVersion: "zrevert-v1.0"

            dashboard:
              url: "http://deepfx-live-dashboard:8080"

            sharedSecret: "managed-deepfx-strategy-shared-secrets"
            existingSecret: "managed-deepfx-strategy-040102-secrets"

            mt5:
              host: deepfx-mt5-bridge
              commandPort: 5555
              subscribePort: 5556
              timeoutMs: 15000

            accountApi:
              url: "http://deepfx-account-api:8000"

            featureEngine:
              enabled: true
              redisUrl: "redis://redis-0.redis-headless.redis.svc:6379"
              redisPasswordSecretName: "managed-feast-secrets"
              redisPasswordSecretKey: "redis-password"
              keyPrefix: "deepfx:feature:"

            feast:
              enabled: false
              repoPath: "/app/feast"
              secretName: "managed-feast-secrets"

            resources:
