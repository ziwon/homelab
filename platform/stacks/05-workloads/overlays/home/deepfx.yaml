  - name: deepfx-ml-workflows
    namespace: deepfx
    project: dev
    syncWave: "20"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-ml-workflows
        values: |
          resources:
            # -----------------------------------------------------------
            # DeepFX ML Workflows - Nightly Dream Tunner
            # -----------------------------------------------------------
            - apiVersion: argoproj.io/v1alpha1
              kind: CronWorkflow
              metadata:
                name: nightly-dream
                namespace: deepfx
              spec:
                suspend: true
                schedule: "0 06 * * *"
                timezone: "Asia/Seoul"
                concurrencyPolicy: Forbid
                workflowSpec:
                  entrypoint: nightly-dream
                  onExit: exit-handler
                  imagePullSecrets:
                    - name: harbor-secret
                  templates:
                    - name: nightly-dream
                      container:
                        image: harbor.home.lab/restack/deepfx/nightly-dream:latest
                        envFrom:
                          - secretRef:
                              name: managed-deepfx-nightly-dream-secrets
                    - name: exit-handler
                      steps:
                        - - name: notify
                            templateRef:
                              name: global-slack-notification
                              template: send-notification
                              clusterScope: true
                            arguments:
                              parameters:
                                - name: status
                                  value: "{{workflow.status}}"
                                - name: name
                                  value: "{{workflow.name}}"
                                - name: namespace
                                  value: "{{workflow.namespace}}"
                                - name: link
                                  value: "https://wf.home.lab/workflows/{{workflow.namespace}}/{{workflow.name}}?tab=workflow"

            # -----------------------------------------------------------
            # DeepFX ML Workflows - RL Trainer
            # -----------------------------------------------------------
            - apiVersion: argoproj.io/v1alpha1
              kind: WorkflowTemplate
              metadata:
                name: rl-trainer
                namespace: deepfx
              spec:
                entrypoint: train
                onExit: exit-handler
                imagePullSecrets:
                  - name: harbor-secret
                templates:
                  - name: train
                    container:
                      image: harbor.home.lab/restack/deepfx/rl-trainer:latest
                      args: ["train", "--algorithm", "ppo", "--iterations", "100"]
                      env:
                        - name: RAY_ADDRESS
                          value: "ray://ray.home.lab:10001"
                        - name: RAY_STORAGE_PATH
                          value: "/data/ray/storage"
                  - name: exit-handler
                    steps:
                      - name: notify
                        templateRef:
                          name: global-slack-notification
                          template: send-notification
                          clusterScope: true
                        arguments:
                          parameters:
                            - name: status
                              value: "{{workflow.status}}"
                            - name: name
                              value: "{{workflow.name}}"
                            - name: namespace
                              value: "{{workflow.namespace}}"
                            - name: link
                              value: "https://wf.home.lab/workflows/{{workflow.namespace}}/{{workflow.name}}?tab=workflow"
