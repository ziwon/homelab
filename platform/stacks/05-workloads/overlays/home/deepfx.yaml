              kind: InfisicalSecret
              metadata:
                name: managed-deepfx-h4-connections
                namespace: deepfx
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: deepfx
                      envSlug: home
                      secretsPath: /h4-connections
                    credentialsRef:
