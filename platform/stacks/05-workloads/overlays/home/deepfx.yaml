            imagePullSecrets:
              - name: harbor-secret

            kafka:
              brokers: "redpanda.redpanda.svc:9093"
              groupId: "deepfx.feature.engine"
              tickTopic: "deepfx.market.tick"
              ohlcvTopic: "deepfx.market.ohlcv"
              featureTopic: "deepfx.market.feature.latest"
              publishToKafka: true
              securityProtocol: "SASL_SSL"
              auth:
                username: "deepfx"
                passwordSecretName: "managed-deepfx-secrets"
                passwordSecretKey: "redpanda-deepfx-password"
                saslMechanism: "SCRAM-SHA-512"
              tls:
                caSecretName: "redpanda-ca"
                caSecretKey: "ca.crt"
                caFileName: "ca.crt"
                caMountPath: "/etc/ssl/certs/redpanda"
                caFilePath: "/etc/ssl/certs/redpanda/ca.crt"
                skipHostnameVerify: true
                sessionTimeoutMs: 60000
                heartbeatIntervalMs: 20000
                maxPollIntervalMs: 600000

            feast:
              enabled: true
              repoPath: "/app/feast"
              pushBatchSize: 50
              pushIntervalMs: 100
              secretName: "managed-feast-secrets"
              env:
                redisConnectionStringSecretKey: "redis-connection-string"
                clickhousePasswordSecretKey: "clickhouse-password"
                registryPathSecretKey: "registry-path"
                clickhouseHost: "clickhouse.clickhouse.svc"
                clickhouseUser: "feast"

            redis:
              url: "redis://redis-0.redis-headless.redis.svc:6379"
              auth:
                passwordSecretName: "managed-feast-secrets"
                passwordSecretKey: "redis-password"
              keyPrefix: "deepfx:feature:"
              ttlSeconds: 120

            engine:
              tickWindowSeconds: 10
              emitIntervalMs: 200
              logLevel: "INFO"

            resources:
              limits:
                cpu: 2000m
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi

  # -----------------------------------------------------------
  # Strategy 010102 Kronos Shadow Signal CronJob
  # -----------------------------------------------------------
  - name: deepfx-kronos-shadow-signal
    namespace: deepfx
    project: dev
    syncWave: "15"
    dependencies:
      - deepfx
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-kronos-shadow-signal
        values: |
          resources:
            - apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: strategy-010102-kronos-shadow-signal
                namespace: deepfx
                labels:
                  app.kubernetes.io/name: strategy-010102-kronos-shadow-signal
                  app.kubernetes.io/component: shadow-signal
                  app.kubernetes.io/part-of: deepfx
                  app.kubernetes.io/managed-by: argocd

            - apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: strategy-010102-kronos-clickhouse-secret-reader
                namespace: clickhouse
                labels:
                  app.kubernetes.io/name: strategy-010102-kronos-shadow-signal
                  app.kubernetes.io/component: shadow-signal
                  app.kubernetes.io/part-of: deepfx
                  app.kubernetes.io/managed-by: argocd
              rules:
                - apiGroups: [""]
                  resources: ["secrets"]
                  resourceNames: ["clickhouse-managed-secrets"]
                  verbs: ["get"]

            - apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: strategy-010102-kronos-clickhouse-secret-reader
                namespace: clickhouse
                labels:
                  app.kubernetes.io/name: strategy-010102-kronos-shadow-signal
                  app.kubernetes.io/component: shadow-signal
                  app.kubernetes.io/part-of: deepfx
                  app.kubernetes.io/managed-by: argocd
              subjects:
                - kind: ServiceAccount
                  name: strategy-010102-kronos-shadow-signal
                  namespace: deepfx
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: strategy-010102-kronos-clickhouse-secret-reader

            - apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: strategy-010102-kronos-shadow-signal
                namespace: deepfx
                labels:
                  app.kubernetes.io/name: strategy-010102-kronos-shadow-signal
                  app.kubernetes.io/component: shadow-signal
                  app.kubernetes.io/part-of: deepfx
                  app.kubernetes.io/managed-by: argocd
              spec:
                schedule: "*/15 * * * *"
                timeZone: "Asia/Seoul"
                concurrencyPolicy: Forbid
                successfulJobsHistoryLimit: 3
                failedJobsHistoryLimit: 3
                jobTemplate:
                  spec:
                    backoffLimit: 0
                    activeDeadlineSeconds: 1800
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: strategy-010102-kronos-shadow-signal
                          app.kubernetes.io/component: shadow-signal
                          app.kubernetes.io/part-of: deepfx
                      spec:
                        serviceAccountName: strategy-010102-kronos-shadow-signal
                        restartPolicy: Never
                        imagePullSecrets:
                          - name: harbor-secret
                        volumes:
                          - name: kronos-runtime-secrets
                            emptyDir:
                              medium: Memory
                          - name: kronos-model-cache
                            hostPath:
                              path: /data/LLM/models
                              type: DirectoryOrCreate
                          - name: mps-pipe
                            hostPath:
                              path: /cache/nvidia-mps/pipe
                              type: DirectoryOrCreate
                          - name: mps-log
                            hostPath:
                              path: /cache/nvidia-mps/log
                              type: DirectoryOrCreate
                        initContainers:
                          - name: load-clickhouse-secret
                            image: harbor.home.lab/restack/deepfx/strategy-010102-kronos:main-02acbc1
                            imagePullPolicy: IfNotPresent
                            command:
                              - python
                              - -c
                              - |
                                import base64
                                import json
                                import ssl
                                import urllib.request

                                token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read().strip()
                                ca = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
                                req = urllib.request.Request(
                                    'https://kubernetes.default.svc/api/v1/namespaces/clickhouse/secrets/clickhouse-managed-secrets',
                                    headers={'Authorization': f'Bearer {token}'},
                                )
                                ctx = ssl.create_default_context(cafile=ca)
                                with urllib.request.urlopen(req, context=ctx, timeout=30) as res:
                                    secret = json.load(res)
                                password = base64.b64decode(secret['data']['DEEPFX_PASSWORD_PLAIN'])
                                with open('/var/run/kronos-secrets/clickhouse-password', 'wb') as f:
                                    f.write(password)
                            volumeMounts:
                              - name: kronos-runtime-secrets
                                mountPath: /var/run/kronos-secrets
                        containers:
                          - name: kronos-shadow-signal
                            image: harbor.home.lab/restack/deepfx/strategy-010102-kronos:main-02acbc1
                            imagePullPolicy: IfNotPresent
                            workingDir: /workspace
                            env:
                              - name: NVIDIA_VISIBLE_DEVICES
                                value: all
                              - name: NVIDIA_DRIVER_CAPABILITIES
                                value: compute,utility
                              - name: HF_HOME
                                value: /models/hugging-quants/kronos-hf
                              - name: HUGGINGFACE_HUB_CACHE
                                value: /models/hugging-quants/kronos-hf/hub
                              - name: TRANSFORMERS_CACHE
                                value: /models/hugging-quants/kronos-hf/transformers
                              - name: PYTORCH_ALLOC_CONF
                                value: expandable_segments:True
                              - name: CH_URL
                                value: http://clickhouse.clickhouse.svc:8123
                              - name: CH_USER
                                value: deepfx
                              - name: PG_DSN
                                valueFrom:
                                  secretKeyRef:
                                    name: managed-deepfx-dashboard-secrets
                                    key: DASHBOARD_DATABASE_DSN
                            command:
                              - /bin/bash
                              - -lc
                              - |
                                set -euo pipefail
                                export CH_PASS="$(cat /var/run/kronos-secrets/clickhouse-password)"
                                mkdir -p /tmp/kronos

                                python research/strategy-010102/scripts/export_clickhouse_ohlcv.py \
                                  --symbols XAGUSD,XAUUSD \
                                  --timeframe M5 \
                                  --since-hours 168 \
                                  --limit 50000 \
                                  --output /tmp/kronos/ohlcv_m5_recent.csv

                                python - <<'PY'
                                import csv
                                from pathlib import Path
                                src = Path('/tmp/kronos/ohlcv_m5_recent.csv')
                                dst = Path('/tmp/kronos/ohlcv_m5_recent_dedup.csv')
                                seen = set()
                                rows = []
                                total = 0
                                with src.open(newline='') as f:
                                    reader = csv.DictReader(f)
                                    fieldnames = reader.fieldnames or []
                                    for row in reader:
                                        total += 1
                                        key = (row.get('symbol'), row.get('timeframe'), row.get('time'))
                                        if key in seen:
                                            continue
                                        seen.add(key)
                                        rows.append(row)
                                with dst.open('w', newline='') as f:
                                    writer = csv.DictWriter(f, fieldnames=fieldnames)
                                    writer.writeheader()
                                    writer.writerows(rows)
                                print(f"dedup_rows={len(rows)} dropped={total - len(rows)}")
                                PY

                                python research/strategy-010102/scripts/kronos_latest_signal.py \
                                  --run-model \
                                  --input /tmp/kronos/ohlcv_m5_recent_dedup.csv \
                                  --symbols XAGUSD,XAUUSD \
                                  --timeframes M5 \
                                  --model NeoQuasar/Kronos-base \
                                  --lookback 256 \
                                  --horizon 12 \
                                  --threshold-bps 10 \
                                  --tag kronos_metals_v0 \
                                  --output-forecasts-csv /tmp/kronos/kronos_latest_metals_forecasts.csv \
                                  --output-signals-csv /tmp/kronos/kronos_latest_metals_signals.csv

                                python research/strategy-010102/scripts/kronos_decision_event.py \
                                  --input /tmp/kronos/kronos_latest_metals_signals.csv
                            volumeMounts:
                              - name: kronos-runtime-secrets
                                mountPath: /var/run/kronos-secrets
                                readOnly: true
                              - name: kronos-model-cache
                                mountPath: /models
                              - name: mps-pipe
                                mountPath: /mps/pipe
                                readOnly: true
                              - name: mps-log
                                mountPath: /mps/log
                                readOnly: true
                            resources:
                              requests:
                                cpu: "2"
                                memory: 8Gi
                                nvidia.com/gpu: "1"
                              limits:
                                cpu: "4"
                                memory: 16Gi
                                nvidia.com/gpu: "1"

  - name: deepfx-ml-workflows
    namespace: deepfx
    project: dev
    syncWave: "20"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: deepfx-ml-workflows
        values: |
          resources:
            # -----------------------------------------------------------
            # DeepFX ML Workflows - Nightly Dream Tunner
            # -----------------------------------------------------------
            - apiVersion: argoproj.io/v1alpha1
              kind: CronWorkflow
              metadata:
                name: nightly-dream
                namespace: deepfx
              spec:
                schedule: "0 06 * * *"
                timezone: "Asia/Seoul"
                concurrencyPolicy: Forbid
                workflowSpec:
                  entrypoint: nightly-dream
                  onExit: exit-handler
                  imagePullSecrets:
                    - name: harbor-secret
                  templates:
                    - name: nightly-dream
                      container:
                        image: harbor.home.lab/restack/deepfx/nightly-dream:latest
                        envFrom:
                          - secretRef:
                              name: managed-deepfx-nightly-dream-secrets
                    - name: exit-handler
                      steps:
                        - - name: notify
                            templateRef:
                              name: global-slack-notification
                              template: send-notification
                              clusterScope: true
                            arguments:
                              parameters:
                                - name: status
                                  value: "{{workflow.status}}"
                                - name: name
                                  value: "{{workflow.name}}"
                                - name: namespace
                                  value: "{{workflow.namespace}}"
                                - name: link
                                  value: "https://wf.home.lab/workflows/{{workflow.namespace}}/{{workflow.name}}?tab=workflow"

            # -----------------------------------------------------------
            # DeepFX ML Workflows - RL Trainer
            # -----------------------------------------------------------
            - apiVersion: argoproj.io/v1alpha1
              kind: WorkflowTemplate
              metadata:
                name: rl-trainer
                namespace: deepfx
              spec:
                entrypoint: train
                onExit: exit-handler
                imagePullSecrets:
                  - name: harbor-secret
                templates:
                  - name: train
                    container:
                      image: harbor.home.lab/restack/deepfx/rl-trainer:latest
                      args: ["train", "--algorithm", "ppo", "--iterations", "100"]
                      env:
                        - name: RAY_ADDRESS
                          value: "ray://ray.home.lab:10001"
                        - name: RAY_STORAGE_PATH
                          value: "/data/ray/storage"
                  - name: exit-handler
                    steps:
                      - name: notify
                        templateRef:
                          name: global-slack-notification
                          template: send-notification
                          clusterScope: true
                        arguments:
                          parameters:
                            - name: status
                              value: "{{workflow.status}}"
                            - name: name
                              value: "{{workflow.name}}"
                            - name: namespace
                              value: "{{workflow.namespace}}"
                            - name: link
                              value: "https://wf.home.lab/workflows/{{workflow.namespace}}/{{workflow.name}}?tab=workflow"
