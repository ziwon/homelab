apps:
  - name: landing
    namespace: landing
    project: dev
    syncWave: "0"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: landing
        values: |
          resources:
            - apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: landing
                namespace: landing
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: landing
                template:
                  metadata:
                    labels:
                      app: landing
                  spec:
                    imagePullSecrets:
                      - name: harbor-secret
                    containers:
                      - name: landing
                        image: harbor.home.lab/restack/www:main-7805993
                        imagePullPolicy: Always
                        ports:
                          - containerPort: 80
                            protocol: TCP
                    restartPolicy: Always
