apps:
  - name: authentik
    namespace: authentik
    project: dev
    syncWave: "10"
    dependencies:
      - authentik-raw
    source:
      repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2025.10.0
      helm:
        releaseName: authentik
        values: |
          postgres:
            enabled: false
          redis:
            enabled: true

          global:
            envFrom:
              - secretRef:
                  name: authentik-managed-secrets

          server:
            volumes:
              - name: postgres-creds
                secret:
                  secretName: authentik-managed-secrets
            volumeMounts:
              - name: postgres-creds
                mountPath: /postgres-creds
                readOnly: true

          worker:
            volumes:
              - name: postgres-creds
                secret:
                  secretName: authentik-managed-secrets
            volumeMounts:
              - name: postgres-creds
                mountPath: /postgres-creds
                readOnly: true

  - name: authentik-raw
    namespace: authentik
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm: 
        releaseName: authentik-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: authentik-managed-secrets
                namespace: authentik

              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /authentik
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical

                managedKubeSecretReferences:
                  - secretName: authentik-managed-secrets
                    secretNamespace: authentik
                    creationPolicy: Owner
