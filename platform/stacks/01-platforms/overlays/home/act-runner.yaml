apps:
  # Controller that manages GitHub self-hosted runners.
  - name: actions-runner-controller
    namespace: actions-runner
    project: dev
    syncWave: "5"
    dependencies:
      - act-runner-raw
    source:
      repoURL: https://actions-runner-controller.github.io/actions-runner-controller
      chart: actions-runner-controller
      targetRevision: 0.23.2
      helm:
        releaseName: actions-runner-controller
        values: |
          authSecret:
            create: false
            name: arc-github-auth

          githubWebhookServer:
            enabled: false

          metrics:
            enabled: true

  # RunnerDeployment that connects to the homelab repository.
  - name: act-runner-raw
    namespace: actions-runner
    project: dev
    syncWave: "10"
    dependencies:
      - actions-runner-controller
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: act-runner-raw
        values: |
          resources:
            - apiVersion: actions.summerwind.dev/v1alpha1
              kind: RunnerDeployment
              metadata:
                name: homelab-gh
                namespace: actions-runner
              spec:
                replicas: 1
                template:
                  spec:
                    repository: ziwon/homelab
                    labels:
                      - self-hosted
                      - home
                      - build
                    env:
                      - name: RUNNER_FEATURE_FLAGS
                        value: "ContainerHooks"

            - apiVersion: actions.summerwind.dev/v1alpha1
              kind: HorizontalRunnerAutoscaler
              metadata:
                name: homelab-gh
                namespace: actions-runner
              spec:
                scaleTargetRef:
                  name: homelab-gh
                  kind: RunnerDeployment
                minReplicas: 1
                maxReplicas: 3
                metrics:
                  - type: PercentRunnersBusy
                    scaleUpThreshold: "80"
                    scaleDownThreshold: "20"
                    scaleUpAdjustment: 1
                    scaleDownAdjustment: 1

            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-github-auth
                namespace: actions-runner
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /github
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-github-auth
                    secretNamespace: actions-runner
                    creationPolicy: Owner
