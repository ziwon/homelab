apps:
  # Install InfisicalSecret for GitHub Auth
  - name: act-runner-raw
    namespace: act-runner
    project: dev
    syncWave: "0"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: act-runner-secret
        values: |
          resources:
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: arc-system
            
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: act-runner

            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-github-auth
                namespace: act-runner

              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: hme
                      secretsPath: /github
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical

                managedKubeSecretReferences:
                  - secretName: managed-github-auth
                    secretNamespace: act-runner
                    creationPolicy: Owner

  # Install gha-runner-scale-set-controller chart
  - name: gha-runner-scale-set-controller
    namespace: arc-system
    project: dev
    syncWave: "5"
    dependencies:
      - act-runner-raw
    source:
      repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set-controller
      targetRevision: 0.13.0
      helm:
        releaseName: arc
        values: |
          replicaCount: 1
          logLevel: info

  # Install gha-runner-scale-set chart
  - name: gha-runner-scale-set
    namespace: act-runner
    project: dev
    syncWave: "10"
    dependencies:
      - gha-runner-scale-set-controller
      - act-runner-raw
    source:
      repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.13.0
      helm:
        releaseName: homelab-gh
        values: |
          githubConfigUrl: https://github.com/ziwon

          githubConfigSecret: managed-github-auth

          runnerScaleSetName: "homelab-gh"

          minRunners: 1
          maxRunners: 3

          containerMode:
            type: dind

          template:
            spec:
              containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:latest
                env:
                  - name: RUNNER_FEATURE_FLAGS
                    value: "ContainerHooks"
                resources:
                  requests:
                    cpu: "500m"
                    memory: "512Mi"
                  limits:
                    cpu: "2"
                    memory: "2Gi"
