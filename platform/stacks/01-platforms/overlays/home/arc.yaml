apps:
  # Install InfisicalSecret for GitHub Auth
  - name: arc-runners-raw
    namespace: arc-runners
    project: dev
    syncWave: "0"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: arc-runners-secret
        values: |
          resources:
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: arc-systems

            - apiVersion: v1
              kind: Namespace
              metadata:
                name: arc-runners

            - apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: arc-secret-reader
                namespace: arc-runners
              rules:
              - apiGroups: [""]
                resources: ["secrets"]
                verbs: ["get", "list", "watch"]

            - apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: arc-secret-reader
                namespace: arc-runners
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: arc-secret-reader
              subjects:
              - kind: ServiceAccount
                name: arc-gha-rs-controller
                namespace: arc-systems

            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-github-auth-restack
                namespace: arc-runners

              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: hme
                      secretsPath: /github/restack
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical

                managedKubeSecretReferences:
                  - secretName: managed-github-auth-restack
                    secretNamespace: arc-runners
                    creationPolicy: Owner

            # InfisicalSecret for ziwon personal account
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-github-auth-ziwon
                namespace: arc-runners

              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: hme
                      secretsPath: /github/ziwon
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical

                managedKubeSecretReferences:
                  - secretName: managed-github-auth-ziwon
                    secretNamespace: arc-runners
                    creationPolicy: Owner

            # ClusterRole for GitHub Actions runners to query cluster state
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: arc-runner-reader
              rules:
              # Read-only access to common resources
              - apiGroups: [""]
                resources:
                  - pods
                  - pods/log
                  - services
                  - endpoints
                  - configmaps
                  - namespaces
                verbs: ["get", "list", "watch"]

              # Read ArgoCD Applications
              - apiGroups: ["argoproj.io"]
                resources:
                  - applications
                  - applicationsets
                  - appprojects
                verbs: ["get", "list", "watch"]

              # Read deployments and other workloads
              - apiGroups: ["apps"]
                resources:
                  - deployments
                  - statefulsets
                  - daemonsets
                  - replicasets
                verbs: ["get", "list", "watch"]

              # Read Gateway API resources
              - apiGroups: ["gateway.networking.k8s.io"]
                resources:
                  - gateways
                  - httproutes
                verbs: ["get", "list", "watch"]

              # Read Infisical secrets (metadata only)
              - apiGroups: ["secrets.infisical.com"]
                resources:
                  - infisicalsecrets
                verbs: ["get", "list"]

            # Bind ClusterRole to runner ServiceAccount
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: arc-runner-reader
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: arc-runner-reader
              subjects:
              - kind: ServiceAccount
                name: homelab-gh-gha-rs-no-permission
                namespace: arc-runners

  # Install gha-runner-scale-set-controller chart
  - name: gha-runner-scale-set-controller
    namespace: arc-systems
    project: dev
    syncWave: "5"
    dependencies:
      - arc-runners-raw
    source:
      repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set-controller
      targetRevision: 0.13.0
      helm:
        releaseName: arc
        values: |
          replicaCount: 1
          logLevel: debug

  # Install gha-runner-scale-set chart
  - name: gha-runner-scale-set
    namespace: arc-runners
    project: dev
    syncWave: "10"
    dependencies:
      - gha-runner-scale-set-controller
      - arc-runners-raw
    source:
      repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.13.0
      helm:
        releaseName: homelab-gh
        values: |
          githubConfigUrl: https://github.com/restack
          githubConfigSecret: managed-github-auth-restack
          runnerScaleSetName: "homelab-gh"

          minRunners: 1
          maxRunners: 3

          containerMode: {}

          controllerServiceAccount:
            name: arc-gha-rs-controller
            namespace: arc-systems

          template:
            spec:
              imagePullSecrets:
                - name: harbor-pull-secret

              volumes:
                - name: dind-sock
                  emptyDir: {}

                - name: work
                  emptyDir: {}

                - name: harbor-ca
                  secret:
                    secretName: managed-github-auth
                    items:
                      - key: homelab-ca.crt
                        path: ca.crt

              containers:
                - name: runner
                  image: harbor.home.lab/restack/actions-runner:latest
                  imagePullPolicy: Always
                  command: ["/home/runner/run.sh"]
                  env:
                    - name: DOCKER_HOST
                      value: unix:///var/run/docker.sock
                  volumeMounts:
                    - name: work
                      mountPath: /home/runner/_work
                    - name: dind-sock
                      mountPath: /var/run

                - name: dind
                  image: docker:dind
                  securityContext:
                    privileged: true
                  args:
                    - dockerd
                    - --host=unix:///var/run/docker.sock
                    - --group=1001
                  env:
                    - name: DOCKER_TLS_CERTDIR
                      value: ""
                  volumeMounts:
                    - name: work
                      mountPath: /home/runner/_work
                    - name: dind-sock
                      mountPath: /var/run
                    - name: harbor-ca
                      mountPath: /etc/docker/certs.d/harbor.home.lab
                      readOnly: true

  # Install gha-runner-scale-set for ziwon personal account
  - name: gha-runner-scale-set-ziwon
    namespace: arc-runners
    project: dev
    syncWave: "10"
    dependencies:
      - gha-runner-scale-set-controller
      - arc-runners-raw
    source:
      repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.13.0
      helm:
        releaseName: homelab-ziwon
        values: |
          githubConfigUrl: https://github.com/ziwon
          githubConfigSecret: managed-github-auth-ziwon
          runnerScaleSetName: "homelab-ziwon"

          minRunners: 1
          maxRunners: 3

          containerMode: {}

          controllerServiceAccount:
            name: arc-gha-rs-controller
            namespace: arc-systems

          template:
            spec:
              imagePullSecrets:
                - name: harbor-pull-secret

              volumes:
                - name: dind-sock
                  emptyDir: {}

                - name: work
                  emptyDir: {}

                - name: harbor-ca
                  secret:
                    secretName: managed-github-auth-ziwon
                    items:
                      - key: homelab-ca.crt
                        path: ca.crt

              containers:
                - name: runner
                  image: harbor.home.lab/restack/actions-runner:latest
                  imagePullPolicy: Always
                  command: ["/home/runner/run.sh"]
                  env:
                    - name: DOCKER_HOST
                      value: unix:///var/run/docker.sock
                  volumeMounts:
                    - name: work
                      mountPath: /home/runner/_work
                    - name: dind-sock
                      mountPath: /var/run

                - name: dind
                  image: docker:dind
                  securityContext:
                    privileged: true
                  args:
                    - dockerd
                    - --host=unix:///var/run/docker.sock
                    - --group=1001
                  env:
                    - name: DOCKER_TLS_CERTDIR
                      value: ""
                  volumeMounts:
                    - name: work
                      mountPath: /home/runner/_work
                    - name: dind-sock
                      mountPath: /var/run
                    - name: harbor-ca
                      mountPath: /etc/docker/certs.d/harbor.home.lab
                      readOnly: true
