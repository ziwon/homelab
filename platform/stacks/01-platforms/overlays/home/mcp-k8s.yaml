apps:
  # HTTPRoute for Gateway API access + RBAC for kubernetes-mcp-server
  - name: kubernetes-mcp-server-raw
    namespace: mcp
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: "2.0.2"
      helm:
        releaseName: kubernetes-mcp-server-raw
        values: |
          resources:
            # --- Gateway API ---
            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: kubernetes-mcp-server
                namespace: mcp
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - k8s-mcp.home.lab
                rules:
                  - backendRefs:
                      - name: kubernetes-mcp-server
                        port: 8080

            # --- RBAC: ClusterRole ---
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: kubernetes-mcp-server-readonly
              rules:
                # Core
                - apiGroups: [""]
                  resources:
                    - pods
                    - pods/log
                    - pods/status
                    - services
                    - endpoints
                    - configmaps
                    # - secrets
                    - events
                    - namespaces
                    - nodes
                    - persistentvolumeclaims
                    - persistentvolumes
                    - replicationcontrollers
                  verbs: ["get", "list", "watch"]

                # Apps
                - apiGroups: ["apps"]
                  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
                  verbs: ["get", "list", "watch"]

                # Batch
                - apiGroups: ["batch"]
                  resources: ["jobs", "cronjobs"]
                  verbs: ["get", "list", "watch"]

                # Networking
                - apiGroups: ["networking.k8s.io"]
                  resources: ["ingresses", "networkpolicies"]
                  verbs: ["get", "list", "watch"]

                # Metrics API (kubectl top)
                - apiGroups: ["metrics.k8s.io"]
                  resources: ["nodes", "pods"]
                  verbs: ["get", "list"]

                # Node subresources (optional; keep get-only)
                - apiGroups: [""]
                  resources: ["nodes/proxy", "nodes/stats"]
                  verbs: ["get"]

                # Autoscaling
                - apiGroups: ["autoscaling"]
                  resources: ["horizontalpodautoscalers"]
                  verbs: ["get", "list", "watch"]

                # Storage
                - apiGroups: ["storage.k8s.io"]
                  resources: ["storageclasses"]
                  verbs: ["get", "list", "watch"]

            # --- RBAC: ClusterRoleBinding ---
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: kubernetes-mcp-server-readonly
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: kubernetes-mcp-server-readonly
              subjects:
                - kind: ServiceAccount
                  name: kubernetes-mcp-server
                  namespace: mcp

  # Kubernetes MCP Server
  - name: kubernetes-mcp-server
    namespace: mcp
    project: dev
    syncWave: "10"
    dependencies:
      - kubernetes-mcp-server-raw
    source:
      repoURL: oci://ghcr.io/containers/charts/kubernetes-mcp-server
      chart: .
      targetRevision: "0.1.0"
      helm:
        releaseName: kubernetes-mcp-server
        values: |
          ingress:
            enabled: false
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          service:
            port: 8080
            type: ClusterIP
          serviceAccount:
            create: true
          rbac:
            create: true
            extraClusterRoleBindings:
              - name: use-view-role
                roleRef:
                  name: view
                  external: true
          image:
            registry: quay.io
            repository: containers/kubernetes_mcp_server
            version: latest
            pullPolicy: Always
          podSecurityContext:
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
