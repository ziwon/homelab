apps:
  - name: argo-workflows
    namespace: argo-workflows
    project: dev
    syncWave: "10"
    dependencies:
      - argo-workflows-raw
    source:
      repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 0.45.28
      helm:
        releaseName: argo-workflows
        values: |
          server:
            ingress:
              enabled: false
            extraArgs:
              - --auth-mode=server
          controller:
            workflowNamespaces:
              - argo-workflows
              - deepfx
          artifactRepository:
            archiveLogs: true
            s3:
              endpoint: minio-green.minio-green.svc:9000
              bucket: ml-artifacts
              insecure: true
              accessKeySecret:
                name: managed-workflows-secrets
                key: accessKey
              secretKeySecret:
                name: managed-workflows-secrets
                key: secretKey

  - name: argo-workflows-raw
    namespace: argo-workflows
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: argo-workflows-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-workflows-secrets
                namespace: argo-workflows
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /argo-workflows
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-workflows-secrets
                    secretNamespace: argo-workflows
                    creationPolicy: Owner

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: argo-workflows
                namespace: argo-workflows
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - wf.home.lab
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: argo-workflows-server
                        port: 2746
