apps:
  - name: argo-workflows
    namespace: argo-workflows
    project: dev
    syncWave: "10"
    dependencies:
      - argo-workflows-raw
    source:
      repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 0.45.28
      helm:
        releaseName: argo-workflows
        values: |
          server:
            ingress:
              enabled: false
            extraArgs:
              - --auth-mode=server
          controller:
            workflowNamespaces:
              - argo-workflows
              - deepfx
          artifactRepository:
            archiveLogs: true
            s3:
              endpoint: minio-green.minio-green.svc:9000
              bucket: ml-artifacts
              insecure: true
              accessKeySecret:
                name: managed-workflows-secrets
                key: accessKey
              secretKeySecret:
                name: managed-workflows-secrets
                key: secretKey

  - name: argo-workflows-raw
    namespace: argo-workflows
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: argo-workflows-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-workflows-secrets
                namespace: argo-workflows
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /argo-workflows
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-workflows-secrets
                    secretNamespace: argo-workflows
                    creationPolicy: Owner

  - name: argo-workflows-templates
    namespace: argo-workflows
    project: dev
    syncWave: "15"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: argo-workflows-templates
        values: |
          resources:
            - apiVersion: argoproj.io/v1alpha1
              kind: ClusterWorkflowTemplate
              metadata:
                name: global-slack-notification
              spec:
                templates:
                - name: send-notification
                  inputs:
                    parameters:
                    - name: status       # {{workflow.status}}
                    - name: name         # {{workflow.name}}
                    - name: namespace    # {{workflow.namespace}}
                    - name: link         # {{workflow.uiURL}}
                  container:
                    image: curlimages/curl
                    command: [sh, -c]
                    args:
                    - |
                      STATUS="{{inputs.parameters.status}}"
                      if [ "$STATUS" = "Succeeded" ]; then
                        EMOJI=":white_check_mark:"
                        TITLE="Workflow Succeeded"
                      elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Error" ]; then
                        EMOJI=":x:"
                        TITLE="Workflow Failed"
                      else
                        EMOJI=":warning:"
                        TITLE="Workflow Status: $STATUS"
                      fi

                      cat <<EOF > /tmp/slack-payload.json
                      {
                        "blocks": [
                          {
                            "type": "header",
                            "text": {
                              "type": "plain_text",
                              "text": "$EMOJI $TITLE",
                              "emoji": true
                            }
                          },
                          {
                            "type": "section",
                            "fields": [
                              {
                                "type": "mrkdwn",
                                "text": "*Workflow:*\n{{inputs.parameters.name}}"
                              },
                              {
                                "type": "mrkdwn",
                                "text": "*Namespace:*\n{{inputs.parameters.namespace}}"
                              },
                              {
                                "type": "mrkdwn",
                                "text": "*Status:*\n$STATUS"
                              }
                            ]
                          },
                          {
                            "type": "divider"
                          },
                          {
                            "type": "actions",
                            "elements": [
                              {
                                "type": "button",
                                "text": {
                                  "type": "plain_text",
                                  "text": "View in Argo UI",
                                  "emoji": true
                                },
                                "style": "primary",
                                "url": "{{inputs.parameters.link}}"
                              }
                            ]
                          }
                        ]
                      }
                      EOF

                      curl -X POST -H 'Content-type: application/json' \
                      --data @/tmp/slack-payload.json \
                      $SLACK_WEBHOOK_URL
                    env:
                    - name: SLACK_WEBHOOK_URL
                      valueFrom:
                        secretKeyRef:
                          name: managed-workflows-secrets
                          key: slack-webhook-url
