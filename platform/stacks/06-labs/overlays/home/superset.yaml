apps:
  - name: superset
    namespace: superset
    chart: superset
    repoURL: http://apache.github.io/superset
    targetRevision: "0.15.0"
    createNamespace: true
    values: |
      replicaCount: 1

      image:
        repository: apache/superset
        tag: latest

      service:
        type: ClusterIP
        port: 8088

      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      postgresql:
        enabled: true

      redis:
        enabled: true

      # Enable Celery worker
      celery:
        enabled: true

      # Enable Flower monitoring
      flower:
        enabled: true

      # Additional Superset configuration
      config:
        # Enable CSRF protection
        CSRF_ENABLED: true
        # Enable CORS
        CORS_ORIGINS: "*"
        # Enable security headers
        SECURITY_HEADERS: true

      # Set up ingress if needed
      ingress:
        enabled: false

      # Persistence configuration
      persistence:
        enabled: false

      # Node selector and tolerations
      nodeSelector: {}
      tolerations: []

      # Security context
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false

      # Liveness and readiness probes
      livenessProbe:
        httpGet:
          path: /health
          port: 8088
        initialDelaySeconds: 30
        periodSeconds: 10

      readinessProbe:
        httpGet:
          path: /ready
          port: 8088
        initialDelaySeconds: 5
        periodSeconds: 5
