apps:
  - name: superset-raw
    namespace: superset
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: "2.0.2"
      helm:
        releaseName: superset-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-superset-secrets
                namespace: superset
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /superset
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-superset-secrets
                    secretNamespace: superset
                    creationPolicy: Owner

  - name: superset
    namespace: superset
    project: dev
    syncWave: "10"
    dependencies:
      - superset-raw
    source:
      repoURL: http://apache.github.io/superset/
      chart: superset
      targetRevision: "0.15.0"
      helm:
        releaseName: superset
        values: |
          replicaCount: 1

          # Database configuration
          postgresql:
            enabled: false

          # External database setup
          supersetNode:
            connections:
              db_host: "superset-postgres.postgres.svc"
              db_port: "5432"
              db_user: "superset"
              db_pass: "superset"
              db_name: "superset"
              redis_host: "superset-redis-headless.superset.svc"
              redis_port: "6379"
              redis_user: ""
              redis_password: "superset"
              redis_cache_db: "1"
              redis_celery_db: "0"
              redis_ssl:
                enabled: false

          # External secrets
          secretEnv:
            create: false

          # Service configuration
          service:
            type: ClusterIP
            port: 8088

          # Resources
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          # Init configuration
          init:
            enabled: true
            createAdmin: true
            adminUser:
              username: admin
              firstname: Superset
              lastname: Admin
              email: admin@superset.com
              password: admin
            loadExamples: false

          # Redis configuration
          redis:
            enabled: false

          # Persistence
          persistence:
            enabled: true
            size: 10Gi
            storageClassName: local-path

          # Environment variables
          extraEnvVars:
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: managed-superset-secrets
                  key: secret-key
            - name: DB_HOST
              value: "superset-postgres.postgres.svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "superset"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: managed-superset-secrets
                  key: db-password
            - name: DB_NAME
              value: "superset"
            - name: REDIS_HOST
              value: "superset-redis-headless.superset.svc"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: managed-superset-secrets
                  key: redis-password
            - name: REDIS_CACHE_DB
              value: "1"
            - name: REDIS_CELERY_DB
              value: "0"

          # Additional configurations
          configOverrides:
            secret: |
              SECRET_KEY = "CHANGE_ME_TO_A_COMPLEX_RANDOM_SECRET"

          # Security context
          podSecurityContext:
            runAsUser: 0

          # Container security context
          containerSecurityContext:
            runAsUser: 0

          # Startup probe
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 1
            failureThreshold: 60
            periodSeconds: 5
            successThreshold: 1

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
            periodSeconds: 15
            successThreshold: 1

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
            periodSeconds: 15
            successThreshold: 1

          # Ingress (disabled by default)
          ingress:
            enabled: false

          # Additional containers
          extraContainers: []

          # Affinity
          affinity: {}

          # Tolerations
          tolerations: []

          # Topology spread constraints
          topologySpreadConstraints: []

          # Node selector
          nodeSelector: {}

          # Priority class name
          priorityClassName: ~

          # Extra labels
          extraLabels: {}

          # Extra config mount path
          extraConfigMountPath: "/app/configs"

          # Config mount path
          configMountPath: "/app/pythonpath"

          # Extra config files
          extraConfigs: {}

          # Extra secrets
          extraSecrets: {}

          # Extra volumes
          extraVolumes: []

          # Extra volume mounts
          extraVolumeMounts: []

          # Extra environment variables
          extraEnv: {}

          # Extra secret environment variables
          extraSecretEnv: {}

          # Extra environment variables in raw format
          extraEnvRaw: []

          # Extra config overrides files
          configOverridesFiles: {}

          # Bootstrap script
          bootstrapScript: |
            #!/bin/bash
            if [ ! -f ~/bootstrap ]; then echo "Running Superset with uid 0" > ~/bootstrap; fi

          # Service account
          serviceAccount:
            create: false

          # Run as user
          runAsUser: 0

          # Bootstrap script
          bootstrapScript: |
