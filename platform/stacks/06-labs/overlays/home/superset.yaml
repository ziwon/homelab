apps:
  - name: superset-raw
    namespace: superset
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: "2.0.2"
      helm:
        releaseName: superset-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-superset-secrets
                namespace: superset
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /superset
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-superset-secrets
                    secretNamespace: superset
                    creationPolicy: Owner

  - name: superset
    namespace: superset
    project: dev
    syncWave: "10"
    dependencies:
      - superset-raw
    source:
      repoURL: http://apache.github.io/superset/
      chart: superset
      targetRevision: "0.15.0"
      helm:
        releaseName: superset
        values: |
          replicaCount: 1

          # Database configuration
          postgresql:
            enabled: false

          # Redis configuration
          redis:
            enabled: false

          # External database setup
          supersetNode:
            connections:
              db_host: "postgres.postgres.svc"
              db_port: "5432"
              db_user: superset
              db_pass: superset
              db_name: superset
              redis_host: "redis.redis.svc"
              redis_port: "6379"
              redis_user: ""
              redis_password: superset
              redis_cache_db: "1"
              redis_celery_db: "0"
              redis_ssl:
                enabled: false
                ssl_cert_reqs: CERT_NONE

          # External secrets
          secretEnv:
            create: false

          # Service configuration
          service:
            type: ClusterIP
            port: 8088

          # Resource limits
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          # Init container
          init:
            enabled: true
            initContainers:
              - name: wait-for-postgres-redis
                image: apache/superset:dockerize
                imagePullPolicy: IfNotPresent
                envFrom:
                  - secretRef:
                      name: "superset-env"
                command:
                  - /bin/sh
                  - -c
                  - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -wait "tcp://$REDIS_HOST:$REDIS_PORT" -timeout 120s

          # Init script
          init:
            createAdmin: true
            adminUser:
              username: admin
              firstname: Superset
              lastname: Admin
              email: admin@superset.com
              password: admin

          # Persistence
          persistence:
            enabled: true
            size: 10Gi
            storageClassName: local-path

          # Security context
          podSecurityContext: {}
          containerSecurityContext: {}

          # Probes
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 1
            failureThreshold: 60
            periodSeconds: 5
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
            periodSeconds: 15
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
            periodSeconds: 15
            successThreshold: 1

          # Additional environment variables
          extraEnvVars:
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: managed-superset-secrets
                  key: secret-key
            - name: DATABASE_HOST
              value: "postgres.postgres.svc"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              value: superset
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: managed-superset-secrets
                  key: database-password
            - name: DATABASE_NAME
              value: superset
            - name: REDIS_HOST
              value: "redis.redis.svc"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: managed-superset-secrets
                  key: redis-password
            - name: REDIS_DB
              value: "1"

          # Additional configuration
          configFromSecret: "superset-config"
          envFromSecret: "superset-env"

          # Additional volumes
          extraVolumes:
            - name: config
              configMap:
                name: superset-config
            - name: secrets
              secret:
                secretName: managed-superset-secrets

          extraVolumeMounts:
            - name: config
              mountPath: /app/pythonpath
            - name: secrets
              mountPath: /app/secrets

          # Additional labels
          extraLabels:
            app.kubernetes.io/name: superset
            app.kubernetes.io/instance: superset
            app.kubernetes.io/version: "0.15.0"

          # Additional annotations
          annotations:
            app.kubernetes.io/name: superset
            app.kubernetes.io/instance: superset
            app.kubernetes.io/version: "0.15.0"

          # Node selector
          nodeSelector: {}

          # Tolerations
          tolerations: []

          # Affinity
          affinity: {}

          # Topology spread constraints
          topologySpreadConstraints: []

          # Priority class name
          priorityClassName: ~

          # Service account
          serviceAccountName: ~

          # Image pull secrets
          imagePullSecrets: []

          # Init image
          initImage:
            repository: apache/superset
            tag: dockerize
            pullPolicy: IfNotPresent

          # Bootstrap script
          bootstrapScript: |
            #!/bin/bash
            if [ ! -f ~/bootstrap ]; then echo "Running Superset with uid {{ .Values.runAsUser }}" > ~/bootstrap; fi

          # Config overrides
          configOverrides: {}

          # Config overrides files
          configOverridesFiles: {}

          # Config mount path
          configMountPath: "/app/pythonpath"

          # Extra config mount path
          extraConfigMountPath: "/app/configs"

          # Extra configs
          extraConfigs: {}

          # Extra secrets
          extraSecrets: {}

          # Extra containers
          extraContainers: []

          # Extra init containers
          extraInitContainers: []

          # Extra deployment annotations
          deploymentAnnotations: {}

          # Extra pod annotations
          podAnnotations: {}

          # Extra pod labels
          podLabels: {}

          # Extra deployment labels
          deploymentLabels: {}

          # Extra service annotations
          serviceAnnotations: {}

          # Extra ingress annotations
          ingressAnnotations: {}

          # Extra ingress hosts
          ingressHosts: []

          # Extra ingress tls
          ingressTLS: []

          # Extra ingress extra hosts
          ingressExtraHostsRaw: []

          # Extra ingress path type
          ingressPathType: ImplementationSpecific

          # Extra ingress path
          ingressPath: /

          # Extra ingress class name
          ingressClassName: ~

          # Extra ingress enabled
          ingressEnabled: false

          # Extra service type
          serviceType: ClusterIP

          # Extra service port
          servicePort: 8088

          # Extra service load balancer IP
          serviceLoadBalancerIP: ~

          # Extra service node port
          serviceNodePort: ~

          # Extra service annotations
          serviceAnnotations: {}

          # Extra service load balancer source ranges
          serviceLoadBalancerSourceRanges: []

          # Extra service external name
          serviceExternalName: ~

          # Extra service external traffic policy
          serviceExternalTrafficPolicy: ~

          # Extra service internal traffic policy
          serviceInternalTrafficPolicy: ~

          # Extra service session affinity
          serviceSessionAffinity: ~

