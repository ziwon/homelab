apps:
  - name: superset
    namespace: superset
    chart: superset
    repoURL: http://apache.github.io/superset
    targetRevision: "0.15.0"
    createNamespace: true
    values: |
      replicaCount: 1

      image:
        repository: apache/superset
        tag: latest

      service:
        type: ClusterIP
        port: 8088

      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      postgresql:
        enabled: true

      redis:
        enabled: true

      # Enable Celery worker
      celery:
        enabled: true

      # Enable Flower monitoring
      flower:
        enabled: true

      # Additional Superset configuration
      config:
        # Enable CSRF protection
        CSRF_ENABLED: true
        # Enable CORS
        CORS_ORIGINS: "*"
        # Enable SSL (if needed)
        SSL_ENABLED: false

      # Set default admin user
      admin:
        username: admin
        password: admin
        email: admin@example.com
        first_name: Admin
        last_name: User

      # Persistence configuration
      persistence:
        enabled: true
        size: 10Gi

      # Ingress configuration (if needed)
      ingress:
        enabled: false
        hosts:
          - host: superset.home.lab
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: superset-tls
            hosts:
              - superset.home.lab
