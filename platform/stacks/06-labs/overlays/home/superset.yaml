apps:
  - name: superset-raw
    namespace: superset
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: "2.0.2"
      helm:
        releaseName: superset-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: superset-managed-secrets
                namespace: superset
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /superset
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: superset-managed-secrets
                    secretNamespace: superset
                    creationPolicy: Owner

  - name: superset
    namespace: superset
    project: dev
    syncWave: "10"
    dependencies:
      - superset-raw
    source:
      repoURL: http://apache.github.io/superset/
      chart: superset
      targetRevision: "0.15.0"
      helm:
        releaseName: my-superset
        values: |
          replicaCount: 1

          # Database configuration
          postgresql:
            enabled: false

          # Redis configuration
          redis:
            enabled: true

          # External database connection
          supersetNode:
            connections:
              db_host: "{{ .Release.Name }}-postgresql"
              db_port: "5432"
              db_user: superset
              db_pass: superset
              db_name: superset
              redis_host: "{{ .Release.Name }}-redis-headless"
              redis_port: "6379"
              redis_user: ""
              redis_cache_db: "1"
              redis_celery_db: "0"
              redis_password: superset

          # Service configuration
          service:
            type: ClusterIP
            port: 8088

          # Resource limits
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          # Init configuration
          init:
            createAdmin: true
            adminUser:
              username: admin
              firstname: Superset
              lastname: Admin
              email: admin@superset.com
              password: admin
            loadExamples: false

          # Security settings
          secretEnv:
            create: true

          # Environment variables
          extraEnvVars:
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: superset-managed-secrets
                  key: SUPERSET_SECRET_KEY
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: superset-managed-secrets
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: superset-managed-secrets
                  key: DATABASE_PORT
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: superset-managed-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superset-managed-secrets
                  key: DATABASE_PASSWORD
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: superset-managed-secrets
                  key: DATABASE_NAME
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: superset-managed-secrets
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: superset-managed-secrets
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superset-managed-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              valueFrom:
                secretKeyRef:
                  name: superset-managed-secrets
                  key: REDIS_DB

          # Persistence
          persistence:
            enabled: true
            size: 10Gi
            storageClassName: local-path

          # Security context
          podSecurityContext:
            runAsUser: 0

          # Container security context
          containerSecurityContext:
            runAsUser: 0

          # Additional configurations
          extraConfigMountPath: "/app/configs"

          # Additional volumes
          extraVolumes:
            - name: superset-config
              configMap:
                name: superset-config

          # Additional volume mounts
          extraVolumeMounts:
            - name: superset-config
              mountPath: /app/configs

          # Additional containers
          extraContainers: []

          # Additional init containers
          initContainers:
            - name: wait-for-postgres-redis
              image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
              imagePullPolicy: "{{ .Values.initImage.pullPolicy }}"
              envFrom:
                - secretRef:
                    name: "{{ tpl .Values.envFromSecret . }}"
              command:
                - /bin/sh
                - -c
                - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -wait "tcp://$REDIS_HOST:$REDIS_PORT" -timeout 120s

          # Additional environment variables
          extraEnvVarsSecret: superset-managed-secrets

          # Additional secret environment variables
          extraSecretEnv:
            SUPERSET_SECRET_KEY: ""

          # Additional config overrides
          configOverrides:
            secret: |
              # Generate your own secret key for encryption. Use `openssl rand -base64 42` to generate a good key
              SECRET_KEY = 'CHANGE_ME_TO_A_COMPLEX_RANDOM_SECRET'

          # Additional config mount path
          configMountPath: "/app/pythonpath"

          # Additional config files
          configOverridesFiles: {}

          # Additional files to be mounted as ConfigMap
          extraConfigs: {}

          # Additional files to be mounted as Secrets
          extraSecrets: {}

          # Additional environment variables in RAW format
          extraEnvRaw: []

          # Additional environment variables to pass as secrets
          extraSecretEnv: {}

          # Additional files to be mounted as ConfigMap
          extraConfigMountPath: "/app/configs"

          # Additional environment variables to pass as secrets
          extraSecretEnv: {}

          # Additional environment variables in RAW format
          extraEnvRaw: []

          # Additional environment variables to pass as secrets
          extraSecretEnv: {}

