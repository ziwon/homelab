apps:
  - name: superset
    namespace: superset
    chart: superset
    repoURL: http://apache.github.io/superset
    targetRevision: "0.15.0"
    createNamespace: true
    values: |
      replicaCount: 1

      image:
        repository: apachesuperset.docker.scarf.sh/apache/superset
        tag: ~
        pullPolicy: IfNotPresent

      service:
        type: ClusterIP
        port: 8088

      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      postgresql:
        enabled: true
        auth:
          username: superset
          password: superset
          database: superset
        image:
          tag: "14.17.0-debian-12-r3"
        primary:
          service:
            ports:
              postgresql: "5432"
          persistence:
            enabled: true
            accessModes:
              - ReadWriteOnce

      redis:
        enabled: true
        architecture: standalone
        auth:
          enabled: false
          password: superset
        master:
          persistence:
            enabled: false
            accessModes:
              - ReadWriteOnce

      init:
        enabled: true
        createAdmin: true
        adminUser:
          username: admin
          firstname: Superset
          lastname: Admin
          email: admin@superset.com
          password: admin
        loadExamples: false

      supersetNode:
        replicas:
          enabled: true
          replicaCount: 1
        connections:
          db_user: superset
          db_pass: superset
          db_name: superset

      supersetWorker:
        replicas:
          enabled: true
          replicaCount: 1

      extraLabels:
        app.kubernetes.io/name: superset
        app.kubernetes.io/instance: superset
        app.kubernetes.io/managed-by: argocd

    extraResources:
      - apiVersion: secrets.infisical.com/v1alpha1
        kind: InfisicalSecret
        metadata:
          name: managed-superset-secrets
        spec:
          hostAPI: https://app.infisical.com/api
          resyncInterval: 60
          authentication:
            universalAuth:
              secretsScope:
                projectSlug: homelab
                envSlug: hme
                secretsPath: "/superset"
              credentialsRef:
                secretName: infisical-universal-auth
                secretNamespace: infisical
          managedSecretReference:
            secretName: superset-env
            secretNamespace: superset
            secretType: Opaque