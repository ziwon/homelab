apps:
  - name: superset
    namespace: superset
    chart: superset
    repoURL: http://apache.github.io/superset
    targetRevision: "0.15.0"
    createNamespace: true
    values: |
      replicaCount: 1

      image:
        repository: apache/superset
        tag: latest

      service:
        type: ClusterIP
        port: 8088

      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      postgresql:
        enabled: true

      redis:
        enabled: true

      config:
        extraConfig:
          CELERY_WORKER: "celery worker"
          CELERY_BEAT: "celery beat"
          FLOWER: "flower"

      superset_init:
        enabled: true
        command: ["/bin/sh", "-c", "superset init"]

      env:
        - name: SUPERSET_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: superset-env
              key: SUPERSET_SECRET_KEY
        - name: SUPERSET_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: superset-env
              key: SUPERSET_DATABASE_PASSWORD

      ingress:
        enabled: true
        hosts:
          - host: superset.home.lab
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - superset.home.lab
            secretName: superset-tls

      persistence:
        enabled: true
        size: 10Gi

      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false

      livenessProbe:
        httpGet:
          path: /health
          port: 8088
        initialDelaySeconds: 30
        periodSeconds: 10

      readinessProbe:
        httpGet:
          path: /ready
          port: 8088
        initialDelaySeconds: 5
        periodSeconds: 5

      nodeSelector:
        kubernetes.io/os: linux

      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Equal

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
