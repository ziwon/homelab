apps:
  - name: superset
    namespace: superset
    project: dev
    syncWave: "10"
    source:
      repoURL: http://apache.github.io/superset/
      chart: superset
      targetRevision: "0.15.0"
      helm:
        releaseName: superset
        values: |
          replicaCount: 1
          postgresql:
            enabled: false
          redis:
            enabled: false
          persistence:
            enabled: true
            size: 10Gi
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          supersetNode:
            connections:
              db_host: "postgres.postgres.svc"
              db_port: "5432"
              db_user: superset
              db_pass: "superset"
              db_name: superset
              redis_host: "redis-0.redis-headless.redis.svc"
              redis_port: "6379"
              redis_user: ""
              redis_cache_db: "1"
              redis_celery_db: "0"
          init:
            createAdmin: true
            adminUser:
              username: admin
              firstname: Superset
              lastname: Admin
              email: admin@superset.com
              password: admin
