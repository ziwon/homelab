apps:
  - name: superset
    namespace: labs
    project: dev
    syncWave: "10"
    dependencies:
      - superset-raw
    source:
      repoURL: http://apache.github.io/superset
      chart: superset
      targetRevision: "0.15.0"
      helm:
        releaseName: superset
        values: |
          replicaCount: 1

          # External PostgreSQL configuration
          postgresql:
            enabled: false
          
          # Built-in Redis configuration
          redis:
            enabled: true
          
          # Database connection details
          extraEnvVars:
            - name: DATABASE_HOST
              value: cluster-pg-db-pgbouncer.postgres.svc
            - name: DATABASE_PORT
              value: "5432"
            - name: REDIS_HOST
              value: redis.redis.svc
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superset-managed-secrets
                  key: redis-password

          extraEnvVarsSecret: superset-managed-secrets
          
          # Service configuration
          service:
            type: ClusterIP
            port: 8080
          
          # Persistence
          persistence:
            enabled: true
            size: 10Gi
            storageClassName: local-path
          
          # Resource limits and requests
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          
          # Security context
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          
          # Probes
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          
          # Disable ingress by default
          ingress:
            enabled: false
          
          # Additional configuration
          config:
            superset_config:
              SECRET_KEY: "$(SECRET_KEY)"
              SQLALCHEMY_DATABASE_URI: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
              REDIS_URL: "redis://$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"

          # Additional volumes and volume mounts
          additionalVolumes:
            - name: superset-config
              configMap:
                name: superset-config
          
          additionalVolumeMounts:
            - name: superset-config
              mountPath: /app/superset/config

          # Node selector and tolerations
          nodeSelector: {}
          tolerations: []
          affinity: {}
