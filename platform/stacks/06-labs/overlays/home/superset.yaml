          # Superset node configuration
          supersetNode:
            replicas:
              enabled: true
              replicaCount: 1
            autoscaling:
              enabled: false
              minReplicas: 1
              maxReplicas: 100
              targetCPUUtilizationPercentage: 80
            podDisruptionBudget:
              enabled: false
              minAvailable: 1
              maxUnavailable: 1

          # Superset worker configuration
