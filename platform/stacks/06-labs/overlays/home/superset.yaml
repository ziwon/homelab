apps:
  - name: superset
    namespace: superset
    chart: superset
    repoURL: https://github.com/apache/superset-helm.git
    targetRevision: "0.15.0"
    createNamespace: true
    values: |
      replicaCount: 1

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
