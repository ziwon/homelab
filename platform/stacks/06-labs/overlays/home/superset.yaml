apps:
  - name: superset
    namespace: superset
    chart: superset
    repoURL: http://apache.github.io/superset
    targetRevision: "0.15.0"
    createNamespace: true
    values: |
      replicaCount: 1

      image:
        repository: apache/superset
        tag: latest

      service:
        type: ClusterIP
        port: 8088

      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      postgresql:
        enabled: true

      redis:
        enabled: true

      # Superset specific configurations
      celery:
        enabled: true

      flower:
        enabled: true

      # Enable features mentioned in issue
      features:
        # Enable the feature that allows Superset to use Redis for caching
        redis: true

      # Additional Superset configuration
      config:
        # Enable CSRF protection
        csrf_protect: true

      # Security context
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false

    extraResources:
      - apiVersion: secrets.infisical.com/v1alpha1
        kind: InfisicalSecret
        metadata:
          name: superset-secrets
        spec:
          hostAPI: https://app.infisical.com/api
          resyncInterval: 60
          authentication:
            universalAuth:
              secretsScope:
                projectSlug: homelab
                envSlug: hme
                secretsPath: "/superset"
              credentialsRef:
                secretName: infisical-universal-auth
                secretNamespace: infisical
          managedSecretReference:
            secretName: superset-env
            secretNamespace: superset
            secretType: Opaque
