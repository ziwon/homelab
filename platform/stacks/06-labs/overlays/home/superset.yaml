apps:
  - name: superset
    namespace: superset
    project: dev
    syncWave: "10"
    source:
      repoURL: http://apache.github.io/superset
      chart: superset
      targetRevision: "0.15.0"
      helm:
        releaseName: my-superset
        values: |
          # Database configuration
          postgresql:
            enabled: false
          
          # Redis configuration
          supersetNode:
            connections:
              redis_host: redis-0.redis-headless.redis.svc
              redis_port: "6379"
              db_host: cluster-pg-db-ha.postgres.svc
              db_port: "5432"
              db_user: superset
              db_pass: superset
              db_name: superset
          
          # Service configuration
          service:
            type: ClusterIP
            port: 8088
          
          # Resource configuration
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          
          # Init configuration
          init:
            createAdmin: true
            adminUser:
              username: admin
              firstname: Superset
              lastname: Admin
              email: admin@superset.com
              password: admin
            
          # Persistence
          persistence:
            enabled: true
            size: 10Gi
            storageClassName: local-path
          
          # Security context
          podSecurityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          
          # Extra environment variables
          extraEnvVars:
            - name: DATABASE_HOST
              value: cluster-pg-db-ha.postgres.svc
            - name: DATABASE_PORT
              value: "5432"
            - name: REDIS_HOST
              value: redis-0.redis-headless.redis.svc
            - name: REDIS_PORT
              value: "6379"
          
          # Secret reference
          envFromSecret: managed-superset-secrets
          
          # Probes
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 1
            failureThreshold: 60
            periodSeconds: 5
            successThreshold: 1
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
            periodSeconds: 15
            successThreshold: 1
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
            periodSeconds: 15
            successThreshold: 1