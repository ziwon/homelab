apps:
  - name: superset
    namespace: superset
    chart: superset
    repoURL: https://apache.github.io/superset
    targetRevision: "0.15.0"
    createNamespace: true
    values: |
      replicaCount: 1

      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
