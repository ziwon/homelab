apps:
  - name: superset
    namespace: superset
    chart: superset
    repoURL: http://apache.github.io/superset
    targetRevision: "0.15.0"
    createNamespace: true
    values: |
      replicaCount: 1

      image:
        repository: apache/superset
        tag: latest

      service:
        type: ClusterIP
        port: 8088

      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      postgresql:
        enabled: true

      redis:
        enabled: true

      # Superset configuration
      config:
        # Celery worker configuration
        celery:
          worker:
            concurrency: 4

        # Flower monitoring
        flower:
          enabled: true

      # Additional configuration for Superset
      # This section can be extended based on requirements
      # For now, we'll keep it minimal

    extraResources:
      - apiVersion: secrets.infisical.com/v1alpha1
        kind: InfisicalSecret
        metadata:
          name: superset-raw-secrets
        spec:
          hostAPI: https://app.infisical.com/api
          resyncInterval: 60
          authentication:
            universalAuth:
              secretsScope:
                projectSlug: homelab
                envSlug: hme
                secretsPath: "/superset"
              credentialsRef:
                secretName: infisical-universal-auth
                secretNamespace: infisical
          managedSecretReference:
            secretName: managed-superset-secrets
            secretNamespace: superset
            secretType: Opaque
