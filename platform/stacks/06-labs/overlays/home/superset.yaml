apps:
  - name: superset-raw
    namespace: superset
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: superset-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: managed-superset-secrets
                namespace: superset
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /superset
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: managed-superset-secrets
                    secretNamespace: superset
                    creationPolicy: Owner

  - name: superset
    namespace: superset
    project: dev
    syncWave: "10"
    dependencies:
      - superset-raw
    source:
      repoURL: http://apache.github.io/superset
      chart: superset
      targetRevision: "0.15.0"
      helm:
        releaseName: superset
        values: |
          # Database configuration
          postgresql:
            enabled: false

          # Redis configuration
          redis:
            enabled: false

          # Superset node configuration
          supersetNode:
            connections:
              db_host: "postgres-0.postgres.postgres.svc"
              db_port: "5432"
              db_user: superset
              db_pass: superset
              db_name: superset
              redis_host: "redis-0.redis-headless.redis.svc"
              redis_port: "6379"
              redis_user: ""
              redis_password: superset
              redis_cache_db: "1"
              redis_celery_db: "0"
              redis_ssl:
                enabled: false
                ssl_cert_reqs: CERT_NONE

          # Service configuration
          service:
            type: ClusterIP
            port: 8088

          # Resource configuration
          resources: {}

          # Init configuration
          init:
            enabled: true
            createAdmin: true
            adminUser:
              username: admin
              firstname: Superset
              lastname: Admin
              email: admin@superset.com
              password: admin
            loadExamples: false

          # Security context
          podSecurityContext: {}
          containerSecurityContext: {}

          # Image configuration
          image:
            repository: apachesuperset.docker.scarf.sh/apache/superset
            tag: "0.15.0"
            pullPolicy: IfNotPresent

          # Persistence
          persistence:
            enabled: true
            size: 10Gi
            storageClassName: local-path

          # Ingress configuration
          ingress:
            enabled: false

          # Extra environment variables
          extraEnvVars:
            - name: DATABASE_HOST
              value: "postgres-0.postgres.postgres.svc"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              value: superset
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: managed-superset-secrets
                  key: db-password
            - name: DATABASE_NAME
              value: superset
            - name: REDIS_HOST
              value: "redis-0.redis-headless.redis.svc"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: managed-superset-secrets
                  key: redis-password

          # Extra config files
          extraConfigs:
            superset_config.py: |
              # Superset configuration
              import os
              from superset.config import Config

              # Database configuration
              SQLALCHEMY_DATABASE_URI = 'postgresql://superset:superset@postgres-0.postgres.postgres.svc:5432/superset'

              # Redis configuration
              REDIS_HOST = 'redis-0.redis-headless.redis.svc'
              REDIS_PORT = 6379
              REDIS_PASSWORD = 'superset'
              REDIS_CACHE_DB = 1
              REDIS_CELERY_DB = 0

              # Security settings
              SECRET_KEY = 'CHANGE_ME_TO_A_COMPLEX_RANDOM_SECRET'

              # Session configuration
              SESSION_COOKIE_SECURE = False
              SESSION_COOKIE_HTTPONLY = True
              SESSION_COOKIE_SAMESITE = 'Lax'

              # Security headers
              FORCE_HTTPS = False

              # Logging
              LOG_LEVEL = 'INFO'

              # Security
              CSRF_ENABLED = True
              CSRF_TIME_LIMIT = 3600

              # Security
              SECRET_KEY = 'CHANGE_ME_TO_A_COMPLEX_RANDOM_SECRET'

              # Security
              SECRET_KEY = 'CHANGE_ME_TO_A_COMPLEX_RANDOM_SECRET'

