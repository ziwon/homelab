apps:
  - name: superset
    namespace: superset
    chart: superset
    repoURL: http://apache.github.io/superset
    targetRevision: "0.15.0"
    createNamespace: true
    values: |
      replicaCount: 1

      image:
        repository: apachesuperset.docker.scarf.sh/apache/superset
        tag: ~
        pullPolicy: IfNotPresent

      service:
        type: ClusterIP
        port: 8088

      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      postgresql:
        enabled: true
        auth:
          username: superset
          password: superset
          database: superset
        primary:
          service:
            ports:
              postgresql: "5432"

      redis:
        enabled: true
        auth:
          enabled: false
          password: superset
        master:
          persistence:
            enabled: false

      init:
        enabled: true
        createAdmin: true
        adminUser:
          username: admin
          firstname: Superset
          lastname: Admin
          email: admin@superset.com
          password: admin

      extraEnv: {}

      extraSecretEnv: {}

      configOverrides: {}

      configOverridesFiles: {}

      extraConfigs: {}

      extraSecrets: {}

      extraVolumes: []

      extraVolumeMounts: []

      extraLabels: {}

      secretEnv:
        create: true

      serviceAccount:
        create: false

      ingress:
        enabled: false

      tolerations: []

      affinity: {}

      nodeSelector: {}

      priorityClassName: ~

      topologySpreadConstraints: []

      podDisruptionBudget:
        enabled: false

      livenessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 15
        timeoutSeconds: 1
        failureThreshold: 3
        periodSeconds: 15
        successThreshold: 1

      readinessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 15
        timeoutSeconds: 1
        failureThreshold: 3
        periodSeconds: 15
        successThreshold: 1

      startupProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 15
        timeoutSeconds: 1
        failureThreshold: 60
        periodSeconds: 5
        successThreshold: 1

    extraResources:
      - apiVersion: secrets.infisical.com/v1alpha1
        kind: InfisicalSecret
        metadata:
          name: managed-superset-secrets
        spec:
          hostAPI: https://app.infisical.com/api
          resyncInterval: 60
          authentication:
            universalAuth:
              secretsScope:
                projectSlug: homelab
                envSlug: hme
                secretsPath: "/superset"
              credentialsRef:
                secretName: infisical-universal-auth
                secretNamespace: infisical
          managedSecretReference:
            secretName: superset-env
            secretNamespace: superset
            secretType: Opaque