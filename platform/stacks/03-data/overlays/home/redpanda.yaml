apps:
  # -----------------------------------------------------------
  # Redpanda Operator Install
  # -----------------------------------------------------------
  - name: redpanda-operator
    namespace: redpanda
    project: dev
    syncWave: "5"
    source:
      repoURL: https://charts.redpanda.com
      chart: operator
      targetRevision: v25.1.4
      helm:
        releaseName: redpanda-controller
        values: |
          crds:
            enabled: true

  # -----------------------------------------------------------
  # Redpanda Cluster Bootstrap
  # -----------------------------------------------------------
  - name: redpanda-raw
    namespace: redpanda
    project: dev
    syncWave: "10"
    dependencies:
      - redpanda-operator
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: redpanda-raw
        values: |
          resources:

            # -----------------------------------------------------------
            # Redpanda Managed Secrets
            # -----------------------------------------------------------
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: redpanda-managed-secrets
                namespace: redpanda
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /redpanda
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: redpanda-managed-secrets
                    secretNamespace: redpanda
                    creationPolicy: Owner

            # -----------------------------------------------------------
            # Redpanda Cluster
            # -----------------------------------------------------------
            - apiVersion: cluster.redpanda.com/v1alpha2
              kind: Redpanda
              metadata:
                name: redpanda
                namespace: redpanda
              spec:
                chartRef: {}
                clusterSpec:
                  external:
                    domain: redpanda.home.lab
                  tls:
                    enabled: true

                  auth:
                    sasl:
                      enabled: true
                      secretRef: redpanda-managed-secrets
                      users: [] # Use InfisicalSecret to set password

                  statefulset:
                    initContainers:
                      setDataDirOwnership:
                        enabled: true
                    replicas: 1

                  storage:
                    persistentVolume:
                      enabled: true
                      size: 20Gi
                      storageClass: local-path

                  console:
                    enabled: false

                  monitoring:
                    enabled: false
                    scrapeInterval: 30s

            # -----------------------------------------------------------
            # Redpanda Console
            # -----------------------------------------------------------
            - apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: redpanda-console
                namespace: redpanda
                labels:
                  app: redpanda-console
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: redpanda-console
                template:
                  metadata:
                    labels:
                      app: redpanda-console
                  spec:
                    containers:
                      - name: console
                        image: docker.redpanda.com/redpandadata/console:v3.2.1
                        imagePullPolicy: IfNotPresent
                        args:
                          - "--config.filepath="
                        ports:
                          - containerPort: 8080
                            name: http
                        env:
                          - name: KAFKA_BROKERS
                            value: "redpanda.redpanda.svc.cluster.local:9093"
                          - name: KAFKA_VERSION
                            value: "3.7.0"
                          - name: KAFKA_SASL_ENABLED
                            value: "true"
                          - name: KAFKA_SASL_USERNAME
                            value: "admin"
                          - name: KAFKA_SASL_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: superuser-password
                          - name: KAFKA_SASL_MECHANISM
                            value: "SCRAM-SHA-256"
                          - name: KAFKA_TLS_ENABLED
                            value: "true"
                          - name: KAFKA_TLS_CAFILEPATH
                            value: "/etc/tls/certs/ca.crt"
                          - name: KAFKA_SCHEMAREGISTRY_ENABLED
                            value: "true"
                          - name: KAFKA_SCHEMAREGISTRY_URLS
                            value: "https://redpanda.redpanda.svc.cluster.local:8081"
                          - name: KAFKA_SCHEMAREGISTRY_TLS_ENABLED
                            value: "true"
                          - name: KAFKA_SCHEMAREGISTRY_TLS_CAFILEPATH
                            value: "/etc/tls/certs/ca.crt"
                          - name: KAFKA_SCHEMAREGISTRY_USERNAME
                            value: "admin"
                          - name: KAFKA_SCHEMAREGISTRY_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: superuser-password
                        volumeMounts:
                          - name: ca-cert
                            mountPath: /etc/tls/certs
                            readOnly: true
                        livenessProbe:
                          httpGet:
                            path: /admin/health
                            port: http
                          initialDelaySeconds: 10
                        readinessProbe:
                          httpGet:
                            path: /admin/health
                            port: http
                          initialDelaySeconds: 10
                    volumes:
                      - name: ca-cert
                        secret:
                          secretName: redpanda-default-cert
                          items:
                            - key: ca.crt
                              path: ca.crt

            - apiVersion: v1
              kind: Service
              metadata:
                name: redpanda-console
                namespace: redpanda
              spec:
                selector:
                  app: redpanda-console
                ports:
                  - name: http
                    port: 8080
                    targetPort: 8080

            # -----------------------------------------------------------
            # Redpanda User ACL Init Job
            # -----------------------------------------------------------
            - apiVersion: batch/v1
              kind: Job
              metadata:
                name: redpanda-init-acl
                namespace: redpanda
              spec:
                template:
                  spec:
                    restartPolicy: OnFailure
                    containers:
                      - name: rpk-acl
                        image: redpandadata/redpanda:latest
                        env:
                          - name: SUPERUSER_NAME
                            value: "kubernetes-controller"

                          - name: SUPERUSER_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-bootstrap-user
                                key: password

                          - name: SUPERUSER_AUTHENTICATION_MECHANISM
                            value: SCRAM-SHA-256

                          - name: ADMIN_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: superuser-password

                          - name: VECTOR_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: vector-password

                          # DeepFX workload user
                          - name: DEEPFX_USER
                            value: "deepfx"
                          - name: DEEPFX_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: deepfx-password
                                optional: true

                          - name: QUICKWIT_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: quickwit-password

                          - name: AUTHENTICATION_MECHANISM
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: authentication-mechanism

                        volumeMounts:
                          - name: tls
                            mountPath: /etc/tls/certs/default
                            readOnly: true
                        command:
                          - /bin/sh
                          - -c
                          - |
                            set -e

                            echo "Waiting for Redpanda cluster to be ready..."
                            BROKERS="redpanda.redpanda.svc.cluster.local:9093"
                            ADMIN_API_URL="https://redpanda.redpanda.svc.cluster.local:9644"
                            CA_CERT="/etc/tls/certs/default/ca.crt"
                            RPK_OPTS="-X tls.enabled=true -X tls.ca=$CA_CERT -X user=$SUPERUSER_NAME -X pass=$SUPERUSER_PASSWORD -X sasl.mechanism=$SUPERUSER_MECHANISM"

                            echo "Waiting for Redpanda cluster..."
                            until rpk cluster info --brokers $BROKERS $RPK_OPTS >/dev/null 2>&1; do
                              echo "Redpanda not ready yet..."
                              sleep 5
                            done

                            echo "Connected as Bootstrap User: $SUPERUSER_NAME"

                            echo "Creating custom users..."
                            rpk security user create admin -p "$ADMIN_PASSWORD" --mechanism $AUTHENTICATION_MECHANISM --api-urls "$ADMIN_API_URL" --admin-api-tls-truststore "$CA_CERT" $RPK_OPTS || echo "User admin might already exist"
                            rpk security user create vector -p "$VECTOR_PASSWORD" --mechanism $AUTHENTICATION_MECHANISM --api-urls "$ADMIN_API_URL" --admin-api-tls-truststore "$CA_CERT" $RPK_OPTS || echo "User vector might already exist"
                            rpk security user create quickwit -p "$QUICKWIT_PASSWORD" --mechanism $AUTHENTICATION_MECHANISM --api-urls "$ADMIN_API_URL" --admin-api-tls-truststore "$CA_CERT" $RPK_OPTS || echo "User quickwit might already exist"

                            echo "Creating ACLs..."
                            # Admin: Full Control
                            rpk security acl create --allow-principal User:admin --operation all --cluster --brokers $BROKERS $RPK_OPTS || true
                            rpk security acl create --allow-principal User:admin --operation all --topic "*" --brokers $BROKERS $RPK_OPTS || true
                            rpk security acl create --allow-principal User:admin --operation all --group "*" --brokers $BROKERS $RPK_OPTS || true

                            # Vector: Logs Write
                            rpk security acl create --allow-principal User:vector --operation write,describe \
                              --topic "logs." --resource-pattern-type PREFIXED \
                              --brokers $BROKERS $RPK_OPTS || true

                            # Quickwit: Logs Read
                            rpk security acl create --allow-principal User:quickwit --operation read,describe \
                              --topic "logs." --resource-pattern-type PREFIXED \
                              --brokers $BROKERS $RPK_OPTS || true

                            rpk security acl create --allow-principal User:quickwit --operation read,describe \
                              --group "quickwit-" --resource-pattern-type PREFIXED \
                              --brokers $BROKERS $RPK_OPTS || true

                            # DeepFX: Market data write
                            if [ -n "${DEEPFX_PASSWORD:-}" ]; then
                              echo "[deepfx] ensuring user exists: ${DEEPFX_USER}"

                              # 1) Create user (idempotent-ish)
                              rpk security user create "$DEEPFX_USER" \
                                -p "$DEEPFX_PASSWORD" \
                                --mechanism "$AUTHENTICATION_MECHANISM" \
                                --api-urls "$ADMIN_API_URL" \
                                --admin-api-tls-truststore "$CA_CERT" \
                                $RPK_OPTS \
                              || echo "[deepfx] user $DEEPFX_USER might already exist (or create failed)"

                              # 2) Producer permissions (write/describe)
                              echo "[deepfx] applying producer ACLs (topic write/describe)"
                              rpk security acl create --allow-principal "User:$DEEPFX_USER" --operation write,describe \
                                --topic "deepfx.market." --resource-pattern-type PREFIXED \
                                --brokers "$BROKERS" $RPK_OPTS \
                              || echo "[deepfx] WARN: failed to create producer ACL for prefixed topic deepfx.market."

                              rpk security acl create --allow-principal "User:$DEEPFX_USER" --operation write,describe \
                                --topic "deepfx.market.tick" \
                                --brokers "$BROKERS" $RPK_OPTS \
                              || echo "[deepfx] WARN: failed to create producer ACL for topic deepfx.market.tick"

                              rpk security acl create --allow-principal "User:$DEEPFX_USER" --operation write,describe \
                                --topic "deepfx.market.ohlcv" \
                                --brokers "$BROKERS" $RPK_OPTS \
                              || echo "[deepfx] WARN: failed to create producer ACL for topic deepfx.market.ohlcv"

                              # 3) Consumer permissions (read/describe on topics)
                              echo "[deepfx] applying consumer ACLs (topic read/describe)"
                              rpk security acl create --allow-principal "User:$DEEPFX_USER" --operation read,describe \
                                --topic "deepfx.market.tick" \
                                --brokers "$BROKERS" $RPK_OPTS \
                              || echo "[deepfx] WARN: failed to create consumer ACL for topic deepfx.market.tick"

                              rpk security acl create --allow-principal "User:$DEEPFX_USER" --operation read,describe \
                                --topic "deepfx.market.ohlcv" \
                                --brokers "$BROKERS" $RPK_OPTS \
                              || echo "[deepfx] WARN: failed to create consumer ACL for topic deepfx.market.ohlcv"

                              # 4) Consumer Group permissions (READ only is the safe default)
                              # Group name must match ClickHouse kafka_group_name exactly.
                              echo "[deepfx] applying consumer group ACLs (group read)"
                              rpk security acl create --allow-principal "User:$DEEPFX_USER" --operation read \
                                --group "ch.homelab.deepfx.ticks" \
                                --brokers "$BROKERS" $RPK_OPTS \
                              || echo "[deepfx] WARN: failed to create group ACL for ch.homelab.deepfx.ticks"

                              rpk security acl create --allow-principal "User:$DEEPFX_USER" --operation read \
                                --group "ch.homelab.deepfx.ohlcv" \
                                --brokers "$BROKERS" $RPK_OPTS \
                              || echo "[deepfx] WARN: failed to create group ACL for ch.homelab.deepfx.ohlcv"

                              echo "[deepfx] done. current ACLs (filtered):"
                              rpk security acl list --brokers "$BROKERS" $RPK_OPTS \
                                | grep -E "User:${DEEPFX_USER}|deepfx\.market|ch\.homelab\.deepfx" \
                                || true
                            else
                              echo "DEEPFX_PASSWORD not set; skipping deepfx user/ACL setup"
                            fi

                            echo "All done."

                    volumes:
                      - name: tls
                        secret:
                          secretName: redpanda-default-root-certificate
                          defaultMode: 420

            # -----------------------------------------------------------
            # Redpanda Console HTTPRoute
            # -----------------------------------------------------------
            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: redpanda-console
                namespace: redpanda
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - redpanda-console.home.lab
                rules:
                  - backendRefs:
                      - name: redpanda-console
                        port: 8080

            # -----------------------------------------------------------
            # Redpanda Schema Registry HTTPRoute
            # -----------------------------------------------------------
            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: redpanda-schema-registry
                namespace: redpanda
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - schema.redpanda.home.lab
                rules:
                  - backendRefs:
                      - name: redpanda
                        port: 8081

            # -----------------------------------------------------------
            # Redpanda HTTP Proxy HTTPRoute
            # -----------------------------------------------------------
            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: redpanda-http-proxy
                namespace: redpanda
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - http.redpanda.home.lab
                rules:
                  - backendRefs:
                      - name: redpanda
                        port: 8082

  # -----------------------------------------------------------
  # Redpanda Topics - Logs
  # -----------------------------------------------------------
  - name: redpanda-topics-logs
    namespace: redpanda
    project: dev
    syncWave: "20"
    dependencies:
      - redpanda-operator
      - redpanda-raw
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: redpanda-topics
        values: |
          resources:
            - apiVersion: cluster.redpanda.com/v1alpha2
              kind: Topic
              metadata:
                name: logs.k8s.all
                namespace: redpanda
              spec:
                interval: 1h # even 15m too noisy for homelab

                partitions: 3
                replicationFactor: 1

                additionalConfig:
                  cleanup.policy: "delete"
                  retention.ms: "86400000"      # 1d (consumer buffer for handling failures)
                  retention.bytes: "5368709120" # 5G
                  segment.bytes: "67108864"     # 64MB
                  segment.ms: "3600000"         # 1H (rapid segment rollover)

                kafkaApiSpec:
                  brokers:
                    - "redpanda-0.redpanda.redpanda.svc.cluster.local:9093"
                  tls:
                    caCertSecretRef:
                      name: "redpanda-default-cert"
                      key: "ca.crt"
                  sasl:
                    mechanism: "SCRAM-SHA-256"
                    username: "admin"
                    passwordSecretRef:
                      name: "redpanda-managed-secrets"
                      key: "superuser-password"

  # -----------------------------------------------------------
  # Redpanda Topics - DeepFX Market Data
  # -----------------------------------------------------------
  - name: redpanda-topics-deepfx
    namespace: redpanda
    project: dev
    syncWave: "25"
    dependencies:
      - redpanda-operator
      - redpanda-raw
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: redpanda-topics-deepfx
        values: |
          resources:
            # -----------------------------------------------------------
            # DeepFX Market Data - Tick
            # -----------------------------------------------------------
            - apiVersion: cluster.redpanda.com/v1alpha2
              kind: Topic
              metadata:
                name: deepfx.market.tick
                namespace: redpanda
              spec:
                interval: 1h

                partitions: 6
                replicationFactor: 1

                additionalConfig:
                  cleanup.policy: "delete"
                  retention.ms: "86400000"       # 1d (consumer buffer for handling failures)
                  retention.bytes: "10737418240" # 10G
                  segment.bytes: "67108864"      # 64MB
                  segment.ms: "3600000"          # 1H (rapid segment rollover)

                kafkaApiSpec:
                  brokers:
                    - "redpanda-0.redpanda.redpanda.svc.cluster.local:9093"
                  tls:
                    caCertSecretRef:
                      name: "redpanda-default-cert"
                      key: "ca.crt"
                  sasl:
                    mechanism: "SCRAM-SHA-256"
                    username: "admin"
                    passwordSecretRef:
                      name: "redpanda-managed-secrets"
                      key: "superuser-password"

            # -----------------------------------------------------------
            # DeepFX Market Data - OHLCV
            # -----------------------------------------------------------
            - apiVersion: cluster.redpanda.com/v1alpha2
              kind: Topic
              metadata:
                name: deepfx.market.ohlcv
                namespace: redpanda
              spec:
                interval: 1h

                partitions: 3
                replicationFactor: 1

                additionalConfig:
                  cleanup.policy: "delete"
                  retention.ms: "86400000"      # 1d (consumer buffer for handling failures)
                  retention.bytes: "5368709120" # 5G
                  segment.bytes: "67108864"     # 64MB
                  segment.ms: "3600000"         # 1H (rapid segment rollover)

                kafkaApiSpec:
                  brokers:
                    - "redpanda-0.redpanda.redpanda.svc.cluster.local:9093"
                  tls:
                    caCertSecretRef:
                      name: "redpanda-default-cert"
                      key: "ca.crt"
                  sasl:
                    mechanism: "SCRAM-SHA-256"
                    username: "admin"
                    passwordSecretRef:
                      name: "redpanda-managed-secrets"
                      key: "superuser-password"

            # -----------------------------------------------------------
            # DeepFX Feature Engine - Latest
            # -----------------------------------------------------------
            # Feature Engine computed features topic
            # Throttled output: ~200ms per symbol (vs raw tick ~10ms)
            # Consumed by: ClickHouse Kafka Engine, (future) strategy-engine
            # -----------------------------------------------------------
            - apiVersion: cluster.redpanda.com/v1alpha2
              kind: Topic
              metadata:
                name: deepfx.market.feature.latest
                namespace: redpanda
              spec:
                interval: 1h

                partitions: 3
                replicationFactor: 1

                additionalConfig:
                  cleanup.policy: "delete"
                  retention.ms: "86400000"      # 1d (ClickHouse ingests in real-time)
                  retention.bytes: "2147483648" # 2G (throttled output, smaller than tick)
                  segment.bytes: "67108864"     # 64MB
                  segment.ms: "3600000"         # 1H

                kafkaApiSpec:
                  brokers:
                    - "redpanda-0.redpanda.redpanda.svc.cluster.local:9093"
                  tls:
                    caCertSecretRef:
                      name: "redpanda-default-cert"
                      key: "ca.crt"
                  sasl:
                    mechanism: "SCRAM-SHA-256"
                    username: "admin"
                    passwordSecretRef:
                      name: "redpanda-managed-secrets"
                      key: "superuser-password"
