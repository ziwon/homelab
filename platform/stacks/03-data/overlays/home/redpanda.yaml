apps:
  # Install Redpanda Operator
  - name: redpanda-operator
    namespace: redpanda
    project: dev
    syncWave: "5"
    source:
      repoURL: https://charts.redpanda.com
      chart: operator
      targetRevision: v25.1.4
      helm:
        releaseName: redpanda-controller
        values: |
          crds:
            enabled: true

  # Install Redpanda ClusterCRD + InfisicalSecret + ACL Init Job + HTTPRoute
  - name: redpanda-raw
    namespace: redpanda
    project: dev
    syncWave: "10"
    dependencies:
      - redpanda-operator
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: redpanda-raw
        values: |
          resources:
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: redpanda

            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: redpanda-managed-secrets
                namespace: redpanda
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /redpanda
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: redpanda-managed-secrets
                    secretNamespace: redpanda
                    creationPolicy: Owner

            - apiVersion: cluster.redpanda.com/v1alpha2
              kind: Redpanda
              metadata:
                name: redpanda
                namespace: redpanda
              spec:
                clusterSpec:
                  external:
                    domain: redpanda.home.lab

                  auth:
                    sasl:
                      enabled: true
                      secretRef: redpanda-managed-secrets
                      users: []

                  statefulset:
                    initContainers:
                      setDataDirOwnership:
                        enabled: true
                    replicas: 1

                  storage:
                    persistentVolume:
                      enabled: true
                      size: 20Gi
                      storageClass: local-path

                  console:
                    enabled: true

                  monitoring:
                    enabled: true
                    scrapeInterval: 30s

            - apiVersion: batch/v1
              kind: Job
              metadata:
                name: redpanda-init-acl
                namespace: redpanda
              spec:
                template:
                  spec:
                    restartPolicy: OnFailure
                    containers:
                      - name: rpk-acl
                        image: redpandadata/redpanda:latest
                        env:
                          - name: SUPERUSER_NAME
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: superuser-name

                          - name: SUPERUSER_PASS
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: superuser-password

                          - name: SUPERUSER_AUTHENTICATION_MECHANISM
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: superuser-authentication-mechanism

                          - name: VECTOR_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: vector-password

                          - name: QUICKWIT_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: quickwit-password

                          - name: AUTHENTICATION_MECHANISM
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: authentication-mechanism
                        volumeMounts:
                          - name: tls
                            mountPath: /etc/tls/certs/default
                            readOnly: true
                        command:
                          - /bin/sh
                          - -c
                          - |
                            set -e

                            echo "Waiting for Redpanda cluster to be ready..."
                            BROKERS="redpanda.redpanda.svc.cluster.local:9093"
                            CA_CERT="/etc/tls/certs/default/ca.crt"

                            until rpk cluster info --brokers $BROKERS -X tls.enabled=true -X tls.ca=$CA_CERT >/dev/null 2>&1; do
                              echo "Redpanda not ready yet..."
                              sleep 5
                            done

                            echo "Creating ACLs..."

                            # 1. Admin: Cluster Full Control
                            rpk security acl create \
                              --allow-principal User:admin \
                              --operation all \
                              --cluster \
                              -X user="$SUPERUSER_NAME" \
                              -X pass="$SUPERUSER_PASS" \
                              -X sasl.mechanism="$SUPERUSER_AUTHENTICATION_MECHANISM" \
                              -X tls.enabled=true \
                              -X tls.ca=$CA_CERT \
                              --brokers $BROKERS || true

                            # 2. Admin: Topic Full Control (Wildcard)
                            rpk security acl create \
                              --allow-principal User:admin \
                              --operation all \
                              --topic "*" \
                              -X user="$SUPERUSER_NAME" \
                              -X pass="$SUPERUSER_PASS" \
                              -X sasl.mechanism="$SUPERUSER_AUTHENTICATION_MECHANISM" \
                              -X tls.enabled=true \
                              -X tls.ca=$CA_CERT \
                              --brokers $BROKERS || true

                            # 3. Admin: Group Full Control (Wildcard)
                            rpk security acl create \
                              --allow-principal User:admin \
                              --operation all \
                              --group "*" \
                              -X user="$SUPERUSER_NAME" \
                              -X pass="$SUPERUSER_PASS" \
                              -X sasl.mechanism="$SUPERUSER_AUTHENTICATION_MECHANISM" \
                              -X tls.enabled=true \
                              -X tls.ca=$CA_CERT \
                              --brokers $BROKERS || true

                            # 4. Vector: Logs Write Only
                            rpk security acl create \
                              --allow-principal User:vector \
                              --operation write,describe \
                              --topic "logs-*" \
                              -X user="vector" \
                              -X pass="$VECTOR_PASSWORD" \
                              -X sasl.mechanism="$AUTHENTICATION_MECHANISM" \
                              -X tls.enabled=true \
                              -X tls.ca=$CA_CERT \
                              --brokers $BROKERS || true

                            # 5. Quickwit: Logs Read Only
                            rpk security acl create \
                              --allow-principal User:quickwit \
                              --operation read,describe \
                              --topic "logs-*" \
                              --group "quickwit-*" \
                              -X user="quickwit" \
                              -X pass="$QUICKWIT_PASSWORD" \
                              -X sasl.mechanism="$AUTHENTICATION_MECHANISM" \
                              -X tls.enabled=true \
                              -X tls.ca=$CA_CERT \
                              --brokers $BROKERS || true

                            echo "ACL init done."

                    volumes:
                      - name: tls
                        secret:
                          secretName: redpanda-default-cert
                          defaultMode: 420

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: redpanda-console
                namespace: redpanda
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - redpanda-console.home.lab
                rules:
                  - backendRefs:
                      - name: redpanda-console
                        port: 8080

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: redpanda-schema-registry
                namespace: redpanda
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - schema.redpanda.home.lab
                rules:
                  - backendRefs:
                      - name: redpanda
                        port: 8081

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: redpanda-http-proxy
                namespace: redpanda
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - http.redpanda.home.lab
                rules:
                  - backendRefs:
                      - name: redpanda
                        port: 8082