apps:
  # Install Redpanda Operator
  - name: redpanda-operator
    namespace: redpanda
    project: dev
    syncWave: "5"
    source:
      repoURL: https://charts.redpanda.com
      chart: operator
      targetRevision: v25.1.4
      helm:
        releaseName: redpanda-controller
        values: |
          crds:
            enabled: true

  # Install Redpanda ClusterCRD + InfisicalSecret + ACL Init Job + HTTPRoute
  - name: redpanda-raw
    namespace: redpanda
    project: dev
    syncWave: "10"
    dependencies:
      - redpanda-operator
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: redpanda-raw
        values: |
          resources:
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: redpanda

            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: redpanda-managed-secrets
                namespace: redpanda
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /redpanda
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: redpanda-managed-secrets
                    secretNamespace: redpanda
                    creationPolicy: Owner

            - apiVersion: cluster.redpanda.com/v1alpha2
              kind: Redpanda
              metadata:
                name: redpanda
                namespace: redpanda
              spec:
                clusterSpec:
                  external:
                    domain: redpanda.home.lab

                  auth:
                    sasl:
                      enabled: true
                      secretRef: redpanda-managed-secrets
                      users: []

                  statefulset:
                    initContainers:
                      setDataDirOwnership:
                        enabled: true
                    replicas: 1

                  storage:
                    persistentVolume:
                      enabled: true
                      size: 20Gi
                      storageClass: local-path

                  console:
                    enabled: true
                    authentication:
                      sasl:
                        enabled: true
                        mechanism: scram-sha-512
                        username: admin
                        passwordSecretRef:
                          name: redpanda-managed-secrets
                          key: superuser-password

                  monitoring:
                    enabled: true
                    scrapeInterval: 30s

            - apiVersion: batch/v1
              kind: Job
              metadata:
                name: redpanda-init-acl
                namespace: redpanda
              spec:
                template:
                  spec:
                    restartPolicy: OnFailure
                    containers:
                      - name: rpk-acl
                        image: redpandadata/redpanda:latest
                        env:
                          - name: SUPERUSER_NAME
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: superuser-name
                          - name: SUPERUSER_PASS
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: superuser-password
                          - name: SUPERUSER_MECHANISM
                            valueFrom:
                              secretKeyRef:
                                name: redpanda-managed-secrets
                                key: superuser-mechanism
                        command:
                          - /bin/sh
                          - -c
                          - |
                            set -e

                            echo "Waiting for Redpanda cluster to be ready..."
                            until rpk cluster info --brokers redpanda.redpanda.svc.cluster.local:9092 >/dev/null 2>&1; do
                              echo "Redpanda not ready yet, sleeping..."
                              sleep 5
                            done

                            echo "Creating ACLs with superuser $SUPERUSER_NAME"

                            # Create ACLs for the superuser
                            rpk security acl create \
                              --allow-principal User:admin \
                              --operation create,describe,alter,alter-config \
                              --cluster \
                              --user "$SUPERUSER_NAME" \
                              --password "$SUPERUSER_PASS" \
                              --sasl-mechanism "$SUPERUSER_MECHANISM" \
                              --brokers redpanda.redpanda.svc.cluster.local:9092 || true

                            # Create ACLs for vector
                            rpk security acl create \
                              --allow-principal User:vector \
                              --operation write,describe \
                              --topic logs-* \
                              --user "$SUPERUSER_NAME" \
                              --password "$SUPERUSER_PASS" \
                              --sasl-mechanism "$SUPERUSER_MECHANISM" \
                              --brokers redpanda.redpanda.svc.cluster.local:9092 || true

                            # Create ACLs for quickwit
                            rpk security acl create \
                              --allow-principal User:quickwit \
                              --operation read,describe \
                              --topic logs-* \
                              --user "$SUPERUSER_NAME" \
                              --password "$SUPERUSER_PASS" \
                              --sasl-mechanism "$SUPERUSER_MECHANISM" \
                              --brokers redpanda.redpanda.svc.cluster.local:9092 || true

                            echo "ACL init done."

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: redpanda-console
                namespace: redpanda
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - redpanda-console.home.lab
                rules:
                  - backendRefs:
                      - name: redpand-console
                        port: 8080

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: redpanda-schema-registry
                namespace: redpanda
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - schema.redpanda.home.lab
                rules:
                  - backendRefs:
                      - name: redpanda
                        port: 8081

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: redpanda-http-proxy
                namespace: redpanda
              spec:
                parentRefs:
                  - name: cilium
                    namespace: infra
                    sectionName: https-private
                hostnames:
                  - http.redpanda.home.lab
                rules:
                  - backendRefs:
                      - name: redpanda
                        port: 8082