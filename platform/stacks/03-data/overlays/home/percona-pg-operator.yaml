apps:
  - name: percona-pg-operator
    namespace: percona
    project: dev
    syncWave: "10"
    sourceType: helm
    chartRepo: https://percona.github.io/percona-helm-charts
    chartName: pg-operator
    chartVersion: "2.7.0"
    releaseName: pg-operator
  - name: percona-pg-db
    namespace: percona
    project: dev
    syncWave: "10"
    dependencies:
      - percona-pg-operator
    sourceType: helm
    chartRepo: https://percona.github.io/percona-helm-charts
    chartName: pg-db
    chartVersion: "2.7.0"
    releaseName: cluster
    values: |
      crVersion: 2.7.0            
      postgresVersion: 17         

      instances:
        - name: instance1
          replicas: 1              # 3 for HA, Primary + 2 replicas (HA)

      dataVolumeClaimSpec:     
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi     
        storageClassName: local-path 

      proxy:
        pgBouncer:
          replicas: 2
          image: docker.io/percona/percona-pgbouncer:1.24.1

      backups:
        enabled: true
        trackLatestRestorableTime: true
        pgbackrest:
          image: docker.io/percona/percona-pgbackrest:2.55.0

          configuration:
            - secret:
                name: minio-credentials  

          repos:
            - name: repo2
              s3:
                bucket: pg-backups 
                endpoint: http://minio.minio.svc.cluster.local:9000
                region: us-east-1
              schedules:
                full: "0 3 * * 0"                  # 일 새벽 03:00 전체백업           
                incremental: "0 3 * * 1-6"         # 월~토 새벽 03:00 증분백업

          global:
            repo2-s3-uri-style: path
            repo2-retention-full: "14"             
            repo2-retention-full-type: time    

          manual:
            repoName: repo2
            options:
              - --type=full
      pmm:
        enabled: false  

      secrets:
        name: ""
  - name: percona-raw
    namespace: percona
    project: dev
    syncWave: "30"
    sourceType: raw
    chartRepo: https://bedag.github.io/helm-charts
    chartName: raw
    chartVersion: "2.0.2"
    releaseName: pg-cluster
    values: |
      resources:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: percona
        - apiVersion: secrets.infisical.com/v1alpha1
          kind: InfisicalSecret
          metadata:
            name: minio-credentials
            namespace: percona
          spec:
            hostAPI: https://app.infisical.com/api
            authentication:
              universalAuth:
                secretsScope:
                  projectSlug: "home-lab"
                  envSlug: "hme"
                  secretsPath: "/minio"
                credentialsRef:
                  secretName: infisical-secrets
                  secretNamespace: infisical
            managedSecretReference:
              secretName: minio-credentials
              secretNamespace: percona
              creationPolicy: "Owner"