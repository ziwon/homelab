apps:
  - name: percona-pg-operator
    namespace: percona
    project: dev
    syncWave: "10"
    sourceType: helm
    chartRepo: https://percona.github.io/percona-helm-charts
    chartName: pg-operator
    chartVersion: "2.7.0"
    releaseName: pg-operator
    values: |
      operator:
        createCRD: true
  - name: percona-pg-db
    namespace: percona
    project: dev
    syncWave: "10"
    dependencies:
      - percona-pg-operator
    sourceType: helm
    chartRepo: https://percona.github.io/percona-helm-charts
    chartName: pg-db
    chartVersion: "2.7.0"
    releaseName: pg-db
    values: |
      postgresVersion: 17.5.2
      pmm:
        enabled: true
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      backup:
        pgbackrest:
          configuration:
            - secret:
                name: minio-credentials
          repos:
            - name: repo2
              s3:
                bucket: "pg-backups"
                endpoint: "http://minio.minio.service.cluster.local:9000"
                region: "us-east-1"
                uriStyle: "path"
                verifyTLS: false
  - name: percona-raw
    namespace: percona
    project: dev
    syncWave: "30"
    sourceType: raw
    chartRepo: https://bedag.github.io/helm-charts
    chartName: raw
    chartVersion: "2.0.2"
    releaseName: pg-cluster
    values: |
      resources:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: percona
        - apiVersion: secrets.infisical.com/v1alpha1
          kind: InfisicalSecret
          metadata:
            name: minio-credentials
            namespace: percona
          spec:
            hostAPI: https://app.infisical.com/api
            authentication:
              universalAuth:
                secretsScope:
                  projectSlug: "home-lab"
                  envSlug: "hme"
                  secretsPath: "/minio"
                credentialsRef:
                  secretName: infisical-secrets
                  secretNamespace: infisical
            managedSecretReference:
              secretName: minio-credentials
              secretNamespace: percona
              creationPolicy: "Owner"