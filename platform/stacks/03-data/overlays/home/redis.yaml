apps:
  - name: redis
    namespace: redis
    project: dev
    syncWave: "10"
    dependencies:
      - redis-raw
    source:
      repoURL: oci://registry-1.docker.io/cloudpirates
      chart: redis
      targetRevision: 0.15.3 
      helm:
        releaseName: redis
        values: |
          architecture: replication
          replicaCount: 3

          auth:
            enabled: true
            sentinel: true
            existingSecret: redis-managed-secrets
            existingSecretPasswordKey: password

          persistence:
            enabled: true
            storageClass: local-path
            size: 10Gi

          sentinel:
            enabled: true
            masterName: master
            quorum: 2

          metrics:
            enabled: true
            service:
              type: ClusterIP
              port: 9121
            serviceMonitor:
              enabled: false

  - name: redis-raw
    namespace: redis
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: redis-raw
        values: |
          resources:
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: redis

            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: redis-managed-secrets
                namespace: redis
              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: hme
                      secretsPath: /redis
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical
                managedKubeSecretReferences:
                  - secretName: redis-managed-secrets
                    secretNamespace: redis
                    creationPolicy: Owner