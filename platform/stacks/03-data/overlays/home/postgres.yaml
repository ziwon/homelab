apps:
  # Install Bundle
  - name: percona-pg-operator
    namespace: postgres
    project: dev
    syncWave: "10"
    source:
      repoURL: https://github.com/percona/percona-postgresql-operator.git
      targetRevision: v2.7.0
      path: deploy
      kustomize:
        resources:
          - bundle.yaml

  # Install PostgreSQL Cluster
  - name: percona-pg-db
    namespace: postgres
    project: dev
    syncWave: "10"
    dependencies:
      - percona-pg-operator
    source:
      repoURL: https://percona.github.io/percona-helm-charts
      chart: pg-db
      targetRevision: 2.7.0
      helm:
        releaseName: cluster
        values: |
          crVersion: 2.7.0            
          postgresVersion: 17         

          instances:
            - name: instance1
              replicas: 1              # 3 for HA, Primary + 2 replicas (HA)
              dataVolumeClaimSpec:     
                storageClassName: local-path 
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 100Gi     

          proxy:
            pgBouncer:
              replicas: 2
              image: docker.io/percona/percona-pgbouncer:1.24.1

          backups:
            enabled: true
            trackLatestRestorableTime: true
            pgbackrest:
              image: docker.io/percona/percona-pgbackrest:2.55.0

              configuration:
                - secret:
                    name: repo2-minio-credentials  

              repos:
                - name: repo1
                  volume:
                    volumeClaimSpec:
                      storageClassName: local-path 
                      accessModes:
                        - ReadWriteOnce
                      resources:
                        requests:
                          storage: 10Gi     
                - name: repo2
                  s3:
                    bucket: pg-backups 
                    endpoint: http://minio.minio.svc.cluster.local:9000
                    region: us-east-1
                  schedules:
                    full: "0 3 * * 0"                  # 일 새벽 03:00 전체백업           
                    incremental: "0 3 * * 1-6"         # 월~토 새벽 03:00 증분백업

              global:
                repo1-retention-full: "7"
                repo1-retention-full-type: time
                repo2-retention-full: "14"
                repo2-retention-full-type: time
                repo2-s3-uri-style: path 

              manual:
                repoName: repo2
                options:
                  - --type=full
          pmm:
            enabled: false  

          secrets:
            name: ""

  # Install InfisicalSecret for MinIO credentials
  - name: percona-raw
    namespace: postgres
    project: dev
    syncWave: "30"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: pg-cluster
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: repo2-minio-credentials
                namespace: postgres

              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /postgres
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical

                managedSecretReference:
                  secretName: repo2-minio-credentials
                  secretNamespace: postgres
                  creationPolicy: Owner