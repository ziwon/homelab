apps:
  # https://hub.docker.com/u/percona/
  # Install Bundle
  - name: percona-pg-operator
    namespace: postgres
    project: dev
    syncWave: "10"
    ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: perconapgclusters.pgv2.percona.com
      jsonPointers:
        - /metadata/annotations
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: postgresclusters.postgres-operator.crunchydata.com
      jsonPointers:
        - /metadata/annotations
    source:
      repoURL: https://github.com/ziwon/homelab.git
      targetRevision: main
      path: platform/stacks/kustomize/percona-operator
      kustomize: {} # Needed to recognize as kustomize source

  # Install PostgreSQL Cluster
  - name: percona-pg-db
    namespace: postgres
    project: dev
    syncWave: "10"
    dependencies:
      - percona-raw
      - percona-pg-operator
    source:
      repoURL: https://percona.github.io/percona-helm-charts
      chart: pg-db
      targetRevision: 2.7.0
      helm:
        releaseName: cluster
        values: |
          crVersion: 2.7.0            
          postgresVersion: 17         

          secretName: postgres-managed-secrets

          instances:
            - name: instance1
              replicas: 1              # 3 for HA, Primary + 2 replicas (HA)
              dataVolumeClaimSpec:     
                storageClassName: local-path 
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 100Gi

          patroni:
            dynamicConfiguration:
              postgresql:
                pg_hba:
                  - local all all scram-sha-256
                  - host all all 0.0.0.0/0 scram-sha-256
                  - host all all ::0/0 scram-sha-256
                parameters:
                  max_connections: 100                     

                  shared_buffers: 512MB                     
                  effective_cache_size: 1280MB              
                  maintenance_work_mem: 64MB                
                  work_mem: 2621kB                                            

                  wal_buffers: 16MB                         
                  min_wal_size: 80MB                        
                  max_wal_size: 512MB                       
                  
                  checkpoint_completion_target: 0.9         
                  
                  default_statistics_target: 100            
                  random_page_cost: 1.1                     
                  effective_io_concurrency: 200             
                  
                  max_worker_processes: 4                  
                  max_parallel_workers: 4                 
                  max_parallel_workers_per_gather: 2      
                  max_parallel_maintenance_workers: 2  

          users:
            - name: authentik
              databases:
                - authentik
              databases:
                - authentik
              options: "CREATEDB CREATEROLE"

          proxy:
            pgBouncer:
              config:
                global:
                  server_tls_sslmode: require
                  client_tls_sslmode: disable 
                  pool_mode: transaction
                  default_pool_size: "20"
                  max_client_conn: "200"
                replicas: 1
              image: docker.io/percona/percona-pgbouncer:1.24.1

          backups:
            enabled: true
            trackLatestRestorableTime: true
            pgbackrest:
              image: docker.io/percona/percona-pgbackrest:2.56.0

              restore:
                enabled: false
                repoName: repo1

              configuration:
                - secret:
                    name: postgres-managed-secrets 

              repos:
                - name: repo1
                  volume:
                    volumeClaimSpec:
                      storageClassName: local-path 
                      accessModes:
                        - ReadWriteOnce
                      resources:
                        requests:
                          storage: 10Gi
                    
                - name: repo2
                  s3:
                    bucket: pg-backups 
                    endpoint: http://minio.minio.svc.cluster.local:9000
                    region: us-east-1
                  schedules:
                    full: "0 3 * * 0"                  # 일 새벽 03:00 전체백업           
                    incremental: "0 3 * * 1-6"         # 월~토 새벽 03:00 증분백업

              global:
                repo1-retention-full: "7"
                repo1-retention-full-type: time
                repo2-retention-full: "14"
                repo2-retention-full-type: time
                repo2-s3-uri-style: path 

              manual:
                repoName: repo2
                options:
                  - --type=full
          pmm:
            enabled: false  

          tlsOnly: false

          secrets:
            name: "cluster"

  # Install InfisicalSecret for MinIO credentials
  - name: percona-raw
    namespace: postgres
    project: dev
    syncWave: "5"
    source:
      repoURL: https://bedag.github.io/helm-charts
      chart: raw
      targetRevision: 2.0.2
      helm:
        releaseName: percona-raw
        values: |
          resources:
            - apiVersion: secrets.infisical.com/v1alpha1
              kind: InfisicalSecret
              metadata:
                name: postgres-managed-secrets
                namespace: postgres

              spec:
                hostAPI: https://app.infisical.com/api
                authentication:
                  universalAuth:
                    secretsScope:
                      projectSlug: home-lab
                      envSlug: "hme"
                      secretsPath: /postgres
                    credentialsRef:
                      secretName: infisical-secrets
                      secretNamespace: infisical

                managedKubeSecretReferences:
                  - secretName: postgres-managed-secrets
                    secretNamespace: postgres
                    creationPolicy: Owner

            - apiVersion: v1
              kind: Service
              metadata:
                name: pg-lb
                namespace: postgres
                labels:
                  io.cilium/lb-db: "true"
              spec:
                type: LoadBalancer
                selector:
                  postgres-operator.crunchydata.com/patroni: cluster-pg-db-ha
                ports:
                  - name: postgres
                    port: 5432
                    targetPort: postgres
                    protocol: TCP