apiVersion: v1
kind: List
items:
- apiVersion: postgresql.cnpg.io/v1
  kind: Cluster
  metadata:
    name: postgres
  spec:
    instances: 1
    storage:
      size: 10Gi
    bootstrap:
      initdb:
        database: postgres
        owner: postgres
        secret:
          name: postgres-credentials
    # Superset database and user
    additionalConfig:
      shared_preload_libraries: pg_cron
    # Superset database
    databases:
      - name: superset
        owner: superset
        secret:
          name: superset-db-credentials
    # Superset user
    users:
      - name: superset
        passwordSecret:
          name: superset-db-credentials
        options:
          CREATEDB: true
          CREATEROLE: true
    # Additional users for other applications
    # ... other users if needed
    # Superset monitoring user
    users:
      - name: superset-monitoring
        passwordSecret:
          name: superset-monitoring-db-credentials
        options:
          CREATEDB: false
          CREATEROLE: false
