apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: issue-local-llm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ziwon/homelab.git
    targetRevision: main
    path: .github/workflows/issue-local-llm.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
