{{- $open := "{{" -}}
{{- $close := "}}" -}}

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - matrix:
        generators:
          - git:
              repoURL: '{{ .Values.repository }}'
              revision: '{{ .Values.revision }}'
              files:
                - path: 'platform/stacks/*/overlays/{{ .Values.environment }}/*.yaml'
          - list:
              elementsYaml: '{{$open}} $apps := get . "apps" {{$close}}{{$open}} if $apps {{$close}}{{$open}} toJson $apps {{$close}}{{$open}} else {{$close}}[]{{$open}} end {{$close}}'

  template:
    metadata:
      name: "{{$open}} .name {{$close}}"
      namespace: argocd
      labels:
        layer: '{{$open}}- $filePath := get .path "path" {{$close}}{{$open}} if $filePath {{$close}}{{$open}} index (splitList "/" $filePath) 2 {{$close}}{{$open}} else {{$close}}unknown{{$open}} end {{$close}}'
        environment: "{{ .Values.environment }}"
        managed-by: argocd
        app-type: '{{$open}} if hasKey . "source" {{$close}}{{$open}}- if hasKey .source "chart" {{$close}}helm{{$open}}- else if hasKey .source "kustomize" {{$close}}kustomize{{$open}}- else {{$close}}raw{{$open}}- end {{$close}}{{$open}} else if hasKey . "sourceType" {{$close}}{{$open}} .sourceType {{$close}}{{$open}} else {{$close}}unknown{{$open}} end {{$close}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{$open}} default "0" .syncWave {{$close}}'

    spec:
      project: '{{$open}} .project {{$close}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{$open}} .namespace {{$close}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

      source:
{{$open}}- if hasKey . "source" {{$close}}
{{$open}}- if hasKey .source "repoURL" {{$close}}
        repoURL: '{{$open}} .source.repoURL {{$close}}'
{{$open}}- end {{$close}}
{{$open}}- if hasKey .source "chart" {{$close}}
        chart: '{{$open}} .source.chart {{$close}}'
{{$open}}- end {{$close}}
{{$open}}- if hasKey .source "targetRevision" {{$close}}
        targetRevision: '{{$open}} .source.targetRevision {{$close}}'
{{$open}}- end {{$close}}
{{$open}}- if hasKey .source "path" {{$close}}
        path: '{{$open}} .source.path {{$close}}'
{{$open}}- end {{$close}}
{{$open}}- if hasKey .source "helm" {{$close}}
        helm:
{{$open}} with .source.helm {{$close}}
{{$open}}- if hasKey . "releaseName" {{$close}}
          releaseName: '{{$open}} .releaseName {{$close}}'
{{$open}}- end {{$close}}
{{$open}}- if hasKey . "values" {{$close}}
          values: |
{{$open}} .values | indent 10 {{$close}}
{{$open}}- end {{$close}}
{{$open}} end {{$close}}
{{$open}}- end {{$close}}
{{$open}}- if hasKey .source "kustomize" {{$close}}
        kustomize:
{{$open}} with .source.kustomize {{$close}}
{{$open}}- if hasKey . "resources" {{$close}}
          resources:
{{$open}}- range .resources {{$close}}
            - "{{$open}} . {{$close}}"
{{$open}}- end {{$close}}
{{$open}}- end {{$close}}
{{$open}}- if hasKey . "components" {{$close}}
          components:
{{$open}}- range .components {{$close}}
            - "{{$open}} . {{$close}}"
{{$open}}- end {{$close}}
{{$open}}- end {{$close}}
{{$open}}- if hasKey . "images" {{$close}}
          images:
{{$open}}- range .images {{$close}}
            - "{{$open}} . {{$close}}"
{{$open}}- end {{$close}}
{{$open}}- end {{$close}}
{{$open}} end {{$close}}
{{$open}}- else {{$close}}
        repoURL: ''
{{$open}}- end {{$close}}

  templatePatch: |
    {{- $hasDeps := hasKey . "dependencies" }}
    {{- $hasIgnore := hasKey . "ignoreDifferences" }}
    {{- if or $hasDeps $hasIgnore }}
      spec:
    {{- if $hasDeps }}
        dependencies:
    {{- range .dependencies }}
          - "{{ . }}"
    {{- end }}
    {{- end }}
    {{- if $hasIgnore }}
        ignoreDifferences:
    {{- range .ignoreDifferences }}
          - {{- if hasKey . "group" }}group: "{{ .group }}"{{ end }}
            {{- if hasKey . "kind" }}kind: "{{ .kind }}"{{ end }}
            {{- if hasKey . "name" }}name: "{{ .name }}"{{ end }}
            {{- if hasKey . "namespace" }}namespace: "{{ .namespace }}"{{ end }}
            {{- if hasKey . "jsonPointers" }}
            jsonPointers:
    {{- range .jsonPointers }}
              - "{{ . }}"
    {{- end }}
            {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
