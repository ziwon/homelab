{{- $open := "{{" -}}
{{- $close := "}}" -}}

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - matrix:
        generators:
          - git:
              repoURL: '{{ .Values.repository }}'
              revision: '{{ .Values.revision }}'
              files:
                - path: 'platform/stacks/*/overlays/{{ .Values.environment }}/*.yaml'
          - list:
              elementsYaml: '{{$open}} $apps := get . "apps" {{$close}}{{$open}} if $apps {{$close}}{{$open}} toJson $apps {{$close}}{{$open}} else {{$close}}[]{{$open}} end {{$close}}'

  template:
    metadata:
      name: "{{$open}} .name {{$close}}"
      namespace: argocd
      labels:
        layer: '{{$open}}- $filePath := get .path "path" {{$close}}{{$open}} if $filePath {{$close}}{{$open}} index (splitList "/" $filePath) 2 {{$close}}{{$open}} else {{$close}}unknown{{$open}} end {{$close}}'
        environment: "{{ .Values.environment }}"
        managed-by: argocd
        app-type: '{{$open}} .sourceType {{$close}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{$open}} default "0" .syncWave {{$close}}'

    spec:
      project: '{{$open}} .project {{$close}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{$open}} .namespace {{$close}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

      source:
{{$open}}- if eq .sourceType "helm" {{$close}}
        repoURL: '{{$open}} .chartRepo {{$close}}'
        chart: '{{$open}} .chartName {{$close}}'
        targetRevision: '{{$open}} .chartVersion {{$close}}'
        helm:
          releaseName: '{{$open}} default .name .releaseName {{$close}}'
{{$open}}- if hasKey . "values" {{$close}}
          values: |
{{$open}} .values | indent 12 {{$close}}
{{$open}}- end {{$close}}
{{$open}}- else if eq .sourceType "raw" {{$close}}
        repoURL: '{{$open}} default "https://bedag.github.io/helm-charts" .chartRepo {{$close}}'
        chart: '{{$open}} default "raw" .chartName {{$close}}'
        targetRevision: '{{$open}} default "2.0.2" .chartVersion {{$close}}'
        path: '{{$open}} default "" (index . "rawPath") {{$close}}'
        helm:
          releaseName: '{{$open}} default .name .releaseName {{$close}}'
{{$open}}- if hasKey . "values" {{$close}}
          values: |
{{$open}} .values | indent 12 {{$close}}
{{$open}}- end {{$close}}
{{$open}}- else if eq .sourceType "kustomize" {{$close}}
        repoURL: '{{$open}} .repoURL {{$close}}'
        targetRevision: '{{$open}} .targetRevision {{$close}}'
        path: '{{$open}} default "" .path {{$close}}'
{{$open}}- if and (hasKey . "kustomize") (gt (len .kustomize) 0) {{$close}}
        kustomize:
{{$open}} with .kustomize {{$close}}
{{$open}}- if hasKey . "resources" {{$close}}
          resources:
{{$open}}- range .resources {{$close}}
            - "{{$open}} . {{$close}}"
{{$open}}- end {{$close}}
{{$open}}- end {{$close}}
{{$open}}- if hasKey . "components" {{$close}}
          components:
{{$open}}- range .components {{$close}}
            - "{{$open}} . {{$close}}"
{{$open}}- end {{$close}}
{{$open}}- end {{$close}}
{{$open}}- if hasKey . "images" {{$close}}
          images:
{{$open}}- range .images {{$close}}
            - "{{$open}} . {{$close}}"
{{$open}}- end {{$close}}
{{$open}}- end {{$close}}
{{$open}} end {{$close}}
{{$open}}- end {{$close}}
{{$open}}- else {{$close}}
        repoURL: '{{$open}} .repoURL {{$close}}'
        targetRevision: '{{$open}} .targetRevision {{$close}}'
        path: '{{$open}} default "" .path {{$close}}'
{{$open}}- end {{$close}}



  templatePatch: |
    {{- $hasDeps := hasKey . "dependencies" }}
    {{- $hasIgnore := hasKey . "ignoreDifferences" }}
    {{- if or $hasDeps $hasIgnore }}
      spec:
    {{- if $hasDeps }}
        dependencies:
    {{- range .dependencies }}
          - "{{ . }}"
    {{- end }}
    {{- end }}
    {{- if $hasIgnore }}
        ignoreDifferences:
    {{- range .ignoreDifferences }}
          - {{- if hasKey . "group" }}group: "{{ .group }}"{{ end }}
            {{- if hasKey . "kind" }}kind: "{{ .kind }}"{{ end }}
            {{- if hasKey . "name" }}name: "{{ .name }}"{{ end }}
            {{- if hasKey . "namespace" }}namespace: "{{ .namespace }}"{{ end }}
            {{- if hasKey . "jsonPointers" }}
            jsonPointers:
    {{- range .jsonPointers }}
              - "{{ . }}"
    {{- end }}
            {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
