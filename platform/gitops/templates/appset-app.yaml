{{- $o := "{{" -}}
{{- $c := "}}" -}}

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - matrix:
        generators:
          - git:
              repoURL: '{{ .Values.repository }}'
              revision: '{{ .Values.revision }}'
              files:
                - path: 'platform/stacks/*/overlays/{{ .Values.environment }}/*.yaml'
          - list:
              elementsYaml: '{{$o}} $apps := get . "apps" {{$c}}{{$o}} if $apps {{$c}}{{$o}} toJson $apps {{$c}}{{$o}} else {{$c}}[]{{$o}} end {{$c}}'

  template:
    metadata:
      name: "{{$o}} .name {{$c}}"
      namespace: argocd
      labels:
        layer: '{{$o}}- $filePath := get .path "path" {{$c}}{{$o}} if $filePath {{$c}}{{$o}} index (splitList "/" $filePath) 2 {{$c}}{{$o}} else {{$c}}unknown{{$o}} end {{$c}}'
        environment: "{{ .Values.environment }}"
        managed-by: argocd
        app-type: '{{$o}} if hasKey . "source" {{$c}}{{$o}}- if hasKey .source "chart" {{$c}}helm{{$o}}- else if hasKey .source "kustomize" {{$c}}kustomize{{$o}}- else {{$c}}raw{{$o}}- end {{$c}}{{$o}} else if hasKey . "sourceType" {{$c}}{{$o}} .sourceType {{$c}}{{$o}} else {{$c}}unknown{{$o}} end {{$c}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{$o}} default "0" .syncWave {{$c}}'

    spec:
      # debug: {{ toJson . }}
      project: '{{$o}} .project {{$c}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{$o}} .namespace {{$c}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      source:
        repoURL: 'https://placeholder.invalid'
        path: '.'

  templatePatch: |
    spec:
      source:
    {{$o}} if hasKey . "source" {{$c}}
    {{$o}} toYaml .source | indent 10 {{$c}}
    {{$o}} else {{$c}}
        repoURL: ''
    {{$o}} end {{$c}}

      dependencies:
    {{- range .dependencies }}
        - "{{ . }}"
    {{- end }}

      ignoreDifferences:
    {{- range .ignoreDifferences }}
        - {{- if hasKey . "group" }}group: "{{ .group }}"{{ end }}
          {{- if hasKey . "kind" }}kind: "{{ .kind }}"{{ end }}
          {{- if hasKey . "name" }}name: "{{ .name }}"{{ end }}
          {{- if hasKey . "namespace" }}namespace: "{{ .namespace }}"{{ end }}
          {{- if hasKey . "jsonPointers" }}
          jsonPointers:
    {{- range .jsonPointers }}
            - "{{ . }}"
    {{- end }}
          {{- end }}
    {{- end }}
        - group: secrets.infisical.com
          kind: InfisicalSecret
          jsonPointers:
            - /spec/managedKubeSecretReferences/0/secretType
            - /status
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - .spec.parentRefs[].group
            - .spec.parentRefs[].kind
            - .spec.rules[].backendRefs[].group
            - .spec.rules[].backendRefs[].kind
            - .spec.rules[].matches
            - .spec.rules[].backendRefs[].weight
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.volumeClaimTemplates[]?.apiVersion
            - .spec.volumeClaimTemplates[]?.kind
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor