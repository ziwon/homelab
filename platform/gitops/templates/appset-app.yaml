{{- $open := "{{" -}}
{{- $close := "}}" -}}

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - matrix:
        generators:
          - git:
              repoURL: '{{ .Values.repository }}'
              revision: '{{ .Values.revision }}'
              files:
                - path: 'platform/stacks/*/overlays/{{ .Values.environment }}/*.yaml'
          - list:
              elementsYaml: '{{$open}} $apps := get . "apps" {{$close}}{{$open}} if $apps {{$close}}{{$open}} toJson $apps {{$close}}{{$open}} else {{$close}}[]{{$open}} end {{$close}}'

  template:
    metadata:
      name: "{{$open}} .name {{$close}}"
      namespace: argocd
      labels:
        layer: '{{$open}}- $filePath := get .path "path" {{$close}}{{$open}} if $filePath {{$close}}{{$open}} index (splitList "/" $filePath) 2 {{$close}}{{$open}} else {{$close}}unknown{{$open}} end {{$close}}'
        environment: "{{ .Values.environment }}"
        managed-by: argocd
        app-type: '{{$open}} if hasKey . "source" {{$close}}{{$open}}- if hasKey .source "chart" {{$close}}helm{{$open}}- else if hasKey .source "kustomize" {{$close}}kustomize{{$open}}- else {{$close}}raw{{$open}}- end {{$close}}{{$open}} else if hasKey . "sourceType" {{$close}}{{$open}} .sourceType {{$close}}{{$open}} else {{$close}}unknown{{$open}} end {{$close}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{$open}} default "0" .syncWave {{$close}}'

    spec:
      # debug: {{ toJson . }}
      project: '{{$open}} .project {{$close}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{$open}} .namespace {{$close}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      source:
        repoURL: 'https://placeholder.invalid'
        path: '.'

  templatePatch: |
    spec:
      source:
    {{$open}} if hasKey . "source" {{$close}}
    {{$open}} toYaml .source | indent 10 {{$close}}
    {{$open}} else {{$close}}
        repoURL: ''
    {{$open}} end {{$close}}

    {{- if hasKey . "dependencies" }}
      dependencies:
    {{- range .dependencies }}
        - "{{ . }}"
    {{- end }}
    {{- end }}

    {{- if hasKey . "ignoreDifferences" }}
      ignoreDifferences:
    {{- range .ignoreDifferences }}
        - {{- if hasKey . "group" }}group: "{{ .group }}"{{ end }}
          {{- if hasKey . "kind" }}kind: "{{ .kind }}"{{ end }}
          {{- if hasKey . "name" }}name: "{{ .name }}"{{ end }}
          {{- if hasKey . "namespace" }}namespace: "{{ .namespace }}"{{ end }}
          {{- if hasKey . "jsonPointers" }}
          jsonPointers:
    {{- range .jsonPointers }}
            - "{{ . }}"
    {{- end }}
          {{- end }}
    {{- end }}
    {{- end }}