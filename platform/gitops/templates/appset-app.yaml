{{- $open := "{{" -}}
{{- $close := "}}" -}}

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - matrix:
        generators:
          - git:
              repoURL: '{{ .Values.repository }}'
              revision: '{{ .Values.revision }}'
              files:
                - path: 'platform/stacks/*/overlays/{{ .Values.environment }}/*.yaml'
          - list:
              elementsYaml: '{{$open}} $apps := get . "apps" {{$close}}{{$open}} if $apps {{$close}}{{$open}} toJson $apps {{$close}}{{$open}} else {{$close}}[]{{$open}} end {{$close}}'

  template:
    metadata:
      name: "{{$open}} .name {{$close}}"
      namespace: argocd
      labels:
        layer: '{{$open}}- $filePath := get .path "path" {{$close}}{{$open}} if $filePath {{$close}}{{$open}} index (splitList "/" $filePath) 2 {{$close}}{{$open}} else {{$close}}unknown{{$open}} end {{$close}}'
        environment: "{{ .Values.environment }}"
        managed-by: argocd
        app-type: '{{$open}} .sourceType {{$close}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{$open}} default "0" .syncWave {{$close}}'

    spec:
      project: '{{$open}} .project {{$close}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{$open}} .namespace {{$close}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

      source:
{{- if eq .sourceType "helm" }}
        repoURL: "{{ default $.Values.repository .chartRepo }}"
        chart: "{{ .chartName }}"
        targetRevision: "{{ .chartVersion }}"
        helm:
          releaseName: "{{ default .name .releaseName }}"
  {{- if hasKey . "values" }}
          values: |
{{ .values | indent 12 }}
  {{- end }}
{{- else if eq .sourceType "raw" }}
        repoURL: "{{ default "https://bedag.github.io/helm-charts" .chartRepo }}"
        chart: "{{ default "raw" .chartName }}"
        targetRevision: "{{ default "2.0.2" .chartVersion }}"
        path: "{{ default "" (index . "rawPath") }}"
        helm:
          releaseName: "{{ default .name .releaseName }}"
  {{- if hasKey . "values" }}
          values: |
{{ .values | indent 12 }}
  {{- end }}
{{- else if eq .sourceType "kustomize" }}
        repoURL: "{{ default $.Values.repository .repoURL }}"
        targetRevision: "{{ default $.Values.revision .targetRevision }}"
        path: "{{ default "" .path }}"
  {{- if and (hasKey . "kustomize") (gt (len .kustomize) 0) }}
        kustomize:
    {{- with .kustomize }}
    {{- if hasKey . "resources" }}
          resources:
      {{- range .resources }}
            - "{{ . }}"
      {{- end }}
    {{- end }}
    {{- if hasKey . "components" }}
          components:
      {{- range .components }}
            - "{{ . }}"
      {{- end }}
    {{- end }}
    {{- if hasKey . "images" }}
          images:
      {{- range .images }}
            - "{{ . }}"
      {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- else }}
        repoURL: "{{ $.Values.repository }}"
        targetRevision: "{{ $.Values.revision }}"
        path: "{{ default "" .path }}"
{{- end }}



  templatePatch: |
    {{$open}}- $hasDeps := and (hasKey . "dependencies") (gt (len .dependencies) 0) {{$close}}
    {{$open}}- $hasIgnoreDiff := and (hasKey . "ignoreDifferences") (gt (len .ignoreDifferences) 0) {{$close}}
    {{$open}} if or $hasDeps $hasIgnoreDiff {{$close}}
      spec:
    {{$open}} if $hasDeps {{$close}}
        dependencies:
    {{$open}} range .dependencies {{$close}}
          - "{{$open}} . {{$close}}"
    {{$open}} end {{$close}}
    {{$open}} if $hasIgnoreDiff {{$close}}
        ignoreDifferences:
    {{$open}} range .ignoreDifferences {{$close}}
          - {{$open}}- if hasKey . "group" {{$close}}group: "{{$open}} .group {{$close}}"{{$open}} end {{$close}}
            {{$open}}- if hasKey . "kind" {{$close}}kind: "{{$open}} .kind {{$close}}"{{$open}} end {{$close}}
            {{$open}}- if hasKey . "name" {{$close}}name: "{{$open}} .name {{$close}}"{{$open}} end {{$close}}
            {{$open}}- if hasKey . "namespace" {{$close}}namespace: "{{$open}} .namespace {{$close}}"{{$open}} end {{$close}}
            {{$open}}- if hasKey . "jsonPointers" {{$close}}
            jsonPointers:
    {{$open}} range .jsonPointers {{$close}}
              - "{{$open}} . {{$close}}"
    {{$open}} end {{$close}}
            {{$open}} end {{$close}}
            {{$open}}- if hasKey . "jqPathExpressions" {{$close}}
            jqPathExpressions:
    {{$open}} range .jqPathExpressions {{$close}}
              - "{{$open}} . {{$close}}"
    {{$open}} end {{$close}}
            {{$open}} end {{$close}}
    {{$open}} end {{$close}}
    {{$open}} end {{$close}}
