{{- $open := "{{" -}}
{{- $close := "}}" -}}

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - matrix:
        generators:
          - git:
              repoURL: '{{ .Values.repository }}'
              revision: '{{ .Values.revision }}'
              files:
                - path: 'platform/stacks/*/overlays/{{ .Values.environment }}/*.yaml'
          - list:
              elementsYaml: '{{$open}} $apps := get . "apps" {{$close}}{{$open}} if $apps {{$close}}{{$open}} toJson $apps {{$close}}{{$open}} else {{$close}}[]{{$open}} end {{$close}}'

  template:
    metadata:
      name: "{{$open}} .name {{$close}}"
      namespace: argocd
      labels:
        layer: '{{$open}}- $filePath := get .path "path" {{$close}}{{$open}} if $filePath {{$close}}{{$open}} index (splitList "/" $filePath) 2 {{$close}}{{$open}} else {{$close}}unknown{{$open}} end {{$close}}'
        environment: "{{ .Values.environment }}"
        managed-by: argocd
        app-type: '{{$open}} .sourceType {{$close}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{$open}} default "0" .syncWave {{$close}}'

    spec:
      project: '{{$open}} .project {{$close}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{$open}} .namespace {{$close}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

      source:
        repoURL: '{{$open}} if eq .sourceType "helm" {{$close}}{{$open}} .chartRepo {{$close}}{{$open}} else if eq .sourceType "raw" {{$close}}{{$open}} default "https://bedag.github.io/helm-charts" .chartRepo {{$close}}{{$open}} else {{$close}}{{ .Values.repository }}{{$open}} end {{$close}}'
        chart: '{{$open}} if eq .sourceType "helm" {{$close}}{{$open}} .chartName {{$close}}{{$open}} else if eq .sourceType "raw" {{$close}}{{$open}} default "raw" .chartName {{$close}}{{$open}} end {{$close}}'
        targetRevision: '{{$open}} if eq .sourceType "helm" {{$close}}{{$open}} .chartVersion {{$close}}{{$open}} else if eq .sourceType "raw" {{$close}}{{$open}} default "2.0.2" .chartVersion {{$close}}{{$open}} else {{$close}}{{ .Values.revision }}{{$open}} end {{$close}}'
        path: '{{$open}} if eq .sourceType "raw" {{$close}}{{$open}} default "" (index . "rawPath") {{$close}}{{$open}} end {{$close}}'
        helm:
          releaseName: '{{$open}} default .name .releaseName {{$close}}'
{{- if hasKey . "values" }}
          values: |
            {{$open}} .values {{$close}}
{{- end }}

  templatePatch: |
    {{$open}}- $hasDeps := and (hasKey . "dependencies") (gt (len .dependencies) 0) {{$close}}
    {{$open}}- $hasSyncOptions := hasKey . "syncOptions" {{$close}}
    {{$open}}- $hasAutoPrune := hasKey . "autoPrune" {{$close}}
    {{$open}}- $hasAutoSelfHeal := hasKey . "autoSelfHeal" {{$close}}
    {{$open}}- $hasIgnoreDiff := and (hasKey . "ignoreDifferences") (gt (len .ignoreDifferences) 0) {{$close}}
    {{$open}} if or $hasDeps $hasSyncOptions $hasAutoPrune $hasAutoSelfHeal $hasIgnoreDiff {{$close}}
      spec:
    {{$open}} if $hasDeps {{$close}}
        dependencies:
    {{$open}} range .dependencies {{$close}}
          - "{{$open}} . {{$close}}"
    {{$open}} end {{$close}}
    {{$open}} if or $hasSyncOptions $hasAutoPrune $hasAutoSelfHeal {{$close}}
        syncPolicy:
    {{$open}} if or $hasAutoPrune $hasAutoSelfHeal {{$close}}
          automated:
    {{$open}} if $hasAutoPrune {{$close}}
            prune: {{$open}} if .autoPrune {{$close}}true{{$open}} else {{$close}}false{{$open}} end {{$close}}
    {{$open}} end {{$close}}
    {{$open}} if $hasAutoSelfHeal {{$close}}
            selfHeal: {{$open}} if .autoSelfHeal {{$close}}true{{$open}} else {{$close}}false{{$open}} end {{$close}}
    {{$open}} end {{$close}}
    {{$open}} end {{$close}}
    {{$open}} if $hasSyncOptions {{$close}}
    {{$open}} if gt (len .syncOptions) 0 {{$close}}
          syncOptions:
    {{$open}} range .syncOptions {{$close}}
            - "{{$open}} . {{$close}}"
    {{$open}} end {{$close}}
    {{$open}} else {{$close}}
          syncOptions: []
    {{$open}} end {{$close}}
    {{$open}} end {{$close}}
    {{$open}} end {{$close}}
    {{$open}} if $hasIgnoreDiff {{$close}}
        ignoreDifferences:
    {{$open}} range .ignoreDifferences {{$close}}
          - {{$open}}- if hasKey . "group" {{$close}}group: "{{$open}} .group {{$close}}"{{$open}} end {{$close}}
            {{$open}}- if hasKey . "kind" {{$close}}kind: "{{$open}} .kind {{$close}}"{{$open}} end {{$close}}
            {{$open}}- if hasKey . "name" {{$close}}name: "{{$open}} .name {{$close}}"{{$open}} end {{$close}}
            {{$open}}- if hasKey . "namespace" {{$close}}namespace: "{{$open}} .namespace {{$close}}"{{$open}} end {{$close}}
            {{$open}}- if hasKey . "jsonPointers" {{$close}}
            jsonPointers:
    {{$open}} range .jsonPointers {{$close}}
              - "{{$open}} . {{$close}}"
    {{$open}} end {{$close}}
            {{$open}} end {{$close}}
            {{$open}}- if hasKey . "jqPathExpressions" {{$close}}
            jqPathExpressions:
    {{$open}} range .jqPathExpressions {{$close}}
              - "{{$open}} . {{$close}}"
    {{$open}} end {{$close}}
            {{$open}} end {{$close}}
    {{$open}} end {{$close}}
    {{$open}} end {{$close}}
