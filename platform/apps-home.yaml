apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-home
  namespace: argocd
spec:
  project: dev
  source:
    repoURL: git@github.com:ziwon/homelab.git
    targetRevision: main
    path: platform/gitops
    helm:
      releaseName: homelab-platform-home
      values: |
        environment: home
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
