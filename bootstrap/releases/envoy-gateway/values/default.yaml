crds:
  gatewayAPI:
    safeUpgradePolicy:
      enabled: false

deployment:
  replicas: 1

service:
  type: ClusterIP

config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    provider:
      type: Kubernetes
    logging:
      level:
        default: info
