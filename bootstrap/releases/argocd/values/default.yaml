notifications:
  enabled: true
  
  notifiers:
    service.slack: |
      token: $slack-token
  
  templates:
    template.app-sync-succeeded: |
      slack:
        attachments: |
          [{
            "color": "#18be52",
            "title": "✅ {{ .app.metadata.name }} Sync Completed",
            "title_link": "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}",
            "fields": [
              {"title": "Application", "value": "{{ .app.metadata.name }}", "short": true},
              {"title": "Project", "value": "{{ .app.spec.project }}", "short": true},
              {"title": "Namespace", "value": "{{ .app.spec.destination.namespace }}", "short": true},
              {"title": "Cluster", "value": "{{ .app.spec.destination.server }}", "short": true},
              {"title": "Revision", "value": "{{ .app.status.sync.revision | trunc 7 }}", "short": true},
              {"title": "Finished At", "value": "{{ .app.status.operationState.finishedAt }}", "short": true}
            ],
            "footer": "ArgoCD"
          }]
    
    template.app-sync-failed: |
      slack:
        attachments: |
          [{
            "color": "#E96D76",
            "title": "❌ {{ .app.metadata.name }} Sync Failed",
            "title_link": "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}",
            "fields": [
              {"title": "Application", "value": "{{ .app.metadata.name }}", "short": true},
              {"title": "Project", "value": "{{ .app.spec.project }}", "short": true},
              {"title": "Namespace", "value": "{{ .app.spec.destination.namespace }}", "short": true},
              {"title": "Revision", "value": "{{ .app.status.sync.revision | trunc 7 }}", "short": true},
              {"title": "Error", "value": "{{ .app.status.operationState.message | trunc 500 }}", "short": false}
            ],
            "footer": "ArgoCD | {{ .app.status.operationState.finishedAt }}"
          }]
    
    template.app-health-degraded: |
      slack:
        attachments: |
          [{
            "color": "#f4c030",
            "title": "⚠️ {{ .app.metadata.name }} Health Degraded",
            "title_link": "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}",
            "fields": [
              {"title": "Application", "value": "{{ .app.metadata.name }}", "short": true},
              {"title": "Project", "value": "{{ .app.spec.project }}", "short": true},
              {"title": "Namespace", "value": "{{ .app.spec.destination.namespace }}", "short": true},
              {"title": "Health Status", "value": "{{ .app.status.health.status }}", "short": true},
              {"title": "Sync Status", "value": "{{ .app.status.sync.status }}", "short": true}
            ],
            "footer": "ArgoCD"
          }]
    
    template.app-deployed: |
      slack:
        attachments: |
          [{
            "color": "#18be52",
            "title": "🚀 {{ .app.metadata.name }} Deployed",
            "title_link": "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}",
            "fields": [
              {"title": "Application", "value": "{{ .app.metadata.name }}", "short": true},
              {"title": "Namespace", "value": "{{ .app.spec.destination.namespace }}", "short": true},
              {"title": "Revision", "value": "{{ .app.status.sync.revision | trunc 7 }}", "short": true},
              {"title": "Images", "value": "{{range .app.status.summary.images}}{{ . }}\n{{end}}", "short": false}
            ]
          }]
    
    template.app-sync-running: |
      slack:
        attachments: |
          [{
            "color": "#0DADEA",
            "title": "🔄 {{ .app.metadata.name }} Sync Started",
            "title_link": "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}",
            "fields": [
              {"title": "Application", "value": "{{ .app.metadata.name }}", "short": true},
              {"title": "Triggered By", "value": "{{ .app.status.operationState.operation.initiatedBy.username }}", "short": true}
            ]
          }]
    
    template.app-out-of-sync: |
      slack:
        attachments: |
          [{
            "color": "#f4c030",
            "title": "🔀 {{ .app.metadata.name }} Out of Sync",
            "title_link": "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}?view=tree&resource=",
            "fields": [
              {"title": "Application", "value": "{{ .app.metadata.name }}", "short": true},
              {"title": "Current Revision", "value": "{{ .app.status.sync.revision | trunc 7 }}", "short": true}
            ]
          }]

  triggers:
    trigger.on-sync-succeeded: |
      - when: app.status.operationState.phase in ['Succeeded']
        send: [app-sync-succeeded]
    trigger.on-sync-failed: |
      - when: app.status.operationState.phase in ['Failed', 'Error']
        send: [app-sync-failed]
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [app-health-degraded]
    trigger.on-deployed: |
      - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
        oncePer: app.status.sync.revision
        send: [app-deployed]
    trigger.on-sync-running: |
      - when: app.status.operationState.phase in ['Running']
        send: [app-sync-running]
    trigger.on-sync-status-unknown: |
      - when: app.status.sync.status == 'OutOfSync'
        oncePer: app.status.sync.revision
        send: [app-out-of-sync]

  subscriptions:
    - recipients:
        - slack:alerts-cd
      triggers:
        - on-sync-succeeded
        - on-sync-failed
        - on-health-degraded
        - on-deployed
        - on-sync-status-unknown