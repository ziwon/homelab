[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-embedder"
version = "0.1.0"
description = "Repository code embedding worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "jinja2>=3.1.4",
  "pyyaml>=6.0.1",
  "requests>=2.31.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
code-embedder = "code_embedder.main:main"
code-embedder-api = "code_embedder.api:run"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
