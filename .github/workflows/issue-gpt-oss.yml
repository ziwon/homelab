name: GPT-OSS Issue Handler

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]

jobs:
  gpt-oss-resolve:
    # Trigger on 'gpt-oss' label or @gpt-oss mention
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'gpt-oss')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gpt-oss'))

    runs-on: homelab-ziwon

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Continue CLI
        run: |
          npm install -g @continuedev/cli
          cn --version

      - name: Setup Continue config
        run: |
          mkdir -p ~/.continue
          cat > ~/.continue/config.yaml << 'EOF'
          name: Local Config
          version: 1.0.0
          schema: v1
          models:
            - name: "gpt-oss-20b"
              provider: "openai"
              model: "gpt-oss-20b"
              apiKey: "not-needed"
              apiBase: "http://gpt.home.lab:8004"
              capabilities:
                - tool_use
                - autocomplete
              roles:
                - chat
                - edit
                - apply
          EOF

      - name: Test GPT-OSS connectivity
        run: |
          echo "Testing connection to GPT-OSS server..."
          curl -s http://gpt.home.lab:8004/health || echo "Failed to connect to gpt.home.lab:8004"
          curl -s http://gpt.home.lab:8004/v1/models | jq '.' || echo "Failed to get models"

      - name: Setup GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update && sudo apt-get install gh -y
          fi
          gh --version

      - name: Configure Git
        run: |
          git config user.name "gpt-oss[bot]"
          git config user.email "gpt-oss[bot]@users.noreply.github.com"

      - name: Read skill templates
        id: skills
        run: |
          # Read all skill templates from .claude/skills/
          # Use a unique delimiter to avoid conflicts with file content
          DELIM="SKILLS_END_$(date +%s)"
          ALL_SKILLS=""
          for skill_dir in .claude/skills/*/; do
            if [ -f "${skill_dir}SKILL.md" ]; then
              skill_name=$(basename "$skill_dir")
              skill_content=$(cat "${skill_dir}SKILL.md")
              ALL_SKILLS="${ALL_SKILLS}

          === SKILL: ${skill_name} ===
          ${skill_content}
          "
            fi
          done
          # Write to file to avoid GITHUB_OUTPUT parsing issues
          echo "$ALL_SKILLS" > /tmp/all_skills.txt

      - name: Resolve issue with GPT-OSS
        id: resolve
        shell: bash
        run: |
          set +e

          # Read skills from file
          ALL_SKILLS=$(cat /tmp/all_skills.txt 2>/dev/null || echo "No skills found")

          PROMPT="You are helping with a Kubernetes homelab project. An issue has been created.

          Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

          Description:
          ${{ github.event.issue.body }}

          Project context:
          - This is a GitOps-driven Kubernetes homelab with K3s, ArgoCD, and ARC
          - Follow the guidelines in CLAUDE.md and .claude/rules/
          - All infrastructure is managed via ArgoCD ApplicationSets

          AVAILABLE SKILLS (use these templates when applicable):
          ${ALL_SKILLS}

          IMPORTANT RULES:
          - When creating ArgoCD applications, use the 'apps:' list format from argocd-generator skill
          - Do NOT use raw ApplicationSet manifests
          - File location for apps: platform/stacks/{NN}-{category}/overlays/home/{app-name}.yaml

          Instructions:
          1. Analyze the issue thoroughly
          2. Determine what file operations are needed (create, modify, delete)
          3. Use the appropriate skill template when applicable
          4. Output a JSON response with the following structure:
          {
            \"analysis\": \"Brief analysis of the issue\",
            \"actions\": [
              {\"type\": \"delete\", \"path\": \"path/to/file\"},
              {\"type\": \"create\", \"path\": \"path/to/file\", \"content\": \"file content\"},
              {\"type\": \"modify\", \"path\": \"path/to/file\", \"content\": \"new content\"}
            ],
            \"commit_message\": \"chore: description of changes\",
            \"pr_title\": \"PR title\",
            \"pr_body\": \"PR description\"
          }

          IMPORTANT: Output ONLY valid JSON, no markdown or extra text."

          PAYLOAD=$(jq -n \
            --arg model "gpt-oss-20b" \
            --arg content "$PROMPT" \
            '{model: $model, messages: [{role: "user", content: $content}], max_tokens: 4096, temperature: 0.1}')

          RESPONSE=$(curl -s -X POST http://gpt.home.lab:8004/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            | jq -r '.choices[0].message.content // "Error: No response"')

          echo "Raw response: $RESPONSE"

          # Extract JSON from response (handle markdown code blocks)
          JSON_RESPONSE=$(echo "$RESPONSE" | sed -n '/^{/,/^}/p' | head -1 || echo "$RESPONSE")

          # Validate JSON
          if ! echo "$JSON_RESPONSE" | jq empty 2>/dev/null; then
            echo "Invalid JSON response, falling back to simple analysis"
            echo "analysis=Failed to parse GPT-OSS response" >> $GITHUB_OUTPUT
            echo "has_actions=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "response<<EOF" >> $GITHUB_OUTPUT
          echo "$JSON_RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "has_actions=true" >> $GITHUB_OUTPUT

      - name: Execute actions and create PR
        if: steps.resolve.outputs.has_actions == 'true'
        shell: bash
        run: |
          set +e

          RESPONSE='${{ steps.resolve.outputs.response }}'

          # Parse actions
          ACTIONS=$(echo "$RESPONSE" | jq -c '.actions // []')
          COMMIT_MSG=$(echo "$RESPONSE" | jq -r '.commit_message // "chore: automated fix by gpt-oss"')
          PR_TITLE=$(echo "$RESPONSE" | jq -r '.pr_title // "fix: Issue #${{ github.event.issue.number }}"')
          PR_BODY=$(echo "$RESPONSE" | jq -r '.pr_body // "Automated fix for issue #${{ github.event.issue.number }}"')
          ANALYSIS=$(echo "$RESPONSE" | jq -r '.analysis // "No analysis provided"')

          # Create branch
          BRANCH="gpt-oss/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"

          # Execute each action using for loop (avoid subshell issues with while)
          ACTION_COUNT=$(echo "$ACTIONS" | jq 'length')
          for i in $(seq 0 $((ACTION_COUNT - 1))); do
            action=$(echo "$ACTIONS" | jq -c ".[$i]")
            TYPE=$(echo "$action" | jq -r '.type')
            FILE_PATH=$(echo "$action" | jq -r '.path')

            case "$TYPE" in
              delete)
                if [ -f "$FILE_PATH" ]; then
                  git rm "$FILE_PATH"
                  echo "Deleted: $FILE_PATH"
                fi
                ;;
              create)
                CONTENT=$(echo "$action" | jq -r '.content')
                mkdir -p "$(dirname "$FILE_PATH")"
                echo "$CONTENT" > "$FILE_PATH"
                git add "$FILE_PATH"
                echo "Created: $FILE_PATH"
                ;;
              modify)
                CONTENT=$(echo "$action" | jq -r '.content')
                echo "$CONTENT" > "$FILE_PATH"
                git add "$FILE_PATH"
                echo "Modified: $FILE_PATH"
                ;;
            esac
          done

          # Check if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "no_changes=true" >> $GITHUB_ENV
          else
            git commit -m "$COMMIT_MSG

          Closes #${{ github.event.issue.number }}

          🤖 Generated by GPT-OSS-20B"

            git push origin "$BRANCH"

            # Create PR and capture URL
            PR_URL=$(gh pr create \
              --title "$PR_TITLE" \
              --body "## Analysis

          $ANALYSIS

          ## Changes

          $PR_BODY

          ---
          Closes #${{ github.event.issue.number }}

          🤖 *Generated by GPT-OSS-20B running on homelab*" \
              --base main \
              --head "$BRANCH" 2>&1 | tail -1)

            echo "pr_url=$PR_URL" >> $GITHUB_ENV
            echo "no_changes=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const response = process.env.RESPONSE;
            const noChanges = process.env.NO_CHANGES === 'true';
            const prUrl = process.env.PR_URL || '';

            let analysis = "Unable to parse response";
            try {
              const parsed = JSON.parse(response);
              analysis = parsed.analysis || "No analysis provided";
            } catch (e) {
              analysis = response;
            }

            const body = noChanges
              ? `## 🤖 GPT-OSS Analysis

            ${analysis}

            No changes were needed or the requested files were not found.

            ---
            *Powered by GPT-OSS-20B running on homelab*`
              : `## 🤖 GPT-OSS Analysis

            ${analysis}

            **PR Created:** ${prUrl}

            ---
            *Powered by GPT-OSS-20B running on homelab*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: body
            });
        env:
          RESPONSE: ${{ steps.resolve.outputs.response }}
          NO_CHANGES: ${{ env.no_changes }}
          PR_URL: ${{ env.pr_url }}
