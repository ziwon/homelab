name: Local LLM Issue Handler

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]

jobs:
  resolve-issue:
    runs-on: homelab-ziwon

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Determine LLM target
        id: llm
        run: |
          # Check labels and mentions to determine which LLM to use
          # Use environment variables to safely handle special characters
          LABELS="$ISSUE_LABELS"
          COMMENT="$COMMENT_BODY"

          # Default values
          LLM_NAME=""
          LLM_MODEL=""
          LLM_ENDPOINT=""

          # Check for gpt-oss
          if echo "$LABELS" | grep -q "gpt-oss" || echo "$COMMENT" | grep -q "@gpt-oss"; then
            LLM_NAME="gpt-oss"
            LLM_MODEL="gpt-oss-20b"
            LLM_ENDPOINT="http://gpt.home.lab:8004"
          fi

          # Check for qwen3
          if echo "$LABELS" | grep -q "qwen3" || echo "$COMMENT" | grep -q "@qwen3"; then
            LLM_NAME="qwen3"
            LLM_MODEL="qwen3-32b"
            LLM_ENDPOINT="http://qwen.home.lab:8003"
          fi

          # Check for restack-ai (takes precedence if multiple labels exist)
          if echo "$LABELS" | grep -q "restack-ai" || echo "$COMMENT" | grep -q "@restack-ai"; then
            LLM_NAME="restack-ai"
            LLM_MODEL="qwen3-coder:30b"
            LLM_ENDPOINT="http://restack-ai"
          fi

          # Exit if no matching label/mention found
          if [ -z "$LLM_NAME" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "name=$LLM_NAME" >> $GITHUB_OUTPUT
          echo "model=$LLM_MODEL" >> $GITHUB_OUTPUT
          echo "endpoint=$LLM_ENDPOINT" >> $GITHUB_OUTPUT
        env:
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
          COMMENT_BODY: ${{ github.event.comment.body }}

      - name: Checkout repository
        if: steps.llm.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read skill templates
        if: steps.llm.outputs.skip != 'true'
        id: skills
        run: |
          # Read all skill templates from .claude/skills/
          ALL_SKILLS=""
          for skill_dir in .claude/skills/*/; do
            if [ -f "${skill_dir}SKILL.md" ]; then
              skill_name=$(basename "$skill_dir")
              skill_content=$(cat "${skill_dir}SKILL.md")
              ALL_SKILLS="${ALL_SKILLS}

          === SKILL: ${skill_name} ===
          ${skill_content}
          "
            fi
          done
          # Write to file for prompt generation
          echo "$ALL_SKILLS" > /tmp/all_skills.txt

      - name: Prepare prompt file
        if: steps.llm.outputs.skip != 'true'
        run: |
          # Build comprehensive prompt with project context
          cat > /tmp/prompt.txt << 'PROMPT_EOF'
          You are helping with a Kubernetes homelab project.

          Project context:
          - This is a GitOps-driven Kubernetes homelab with K3s, ArgoCD, and ARC
          - Follow the guidelines in CLAUDE.md and .claude/rules/
          - All infrastructure is managed via ArgoCD ApplicationSets

          SKILLS (reference for YAML format ONLY - do NOT copy example values):
          PROMPT_EOF

          cat /tmp/all_skills.txt >> /tmp/prompt.txt

          cat >> /tmp/prompt.txt << 'PROMPT_EOF2'

          CRITICAL RULES:
          1. ALWAYS extract actual values from the issue description (URLs, versions, config)
          2. Skills show YAML FORMAT only - never copy placeholder values like 'cpu: 100m'
          3. When issue says 'helm repo add NAME URL', use that URL as repoURL
          4. For ArgoCD apps, use 'apps:' list format (NOT raw ApplicationSet)
          5. File location: platform/stacks/{NN}-{category}/overlays/home/{app-name}.yaml

          Helm URL conversion examples:
          - 'helm repo add superset http://apache.github.io/superset/' -> repoURL: 'http://apache.github.io/superset'
          - 'helm repo add grafana https://grafana.github.io/helm-charts' -> repoURL: 'https://grafana.github.io/helm-charts'

          For resources/values: Use reasonable defaults for the specific application type.
          - Web apps: cpu 200m-1000m, memory 256Mi-1Gi
          - Databases: cpu 500m-2000m, memory 512Mi-4Gi
          - ML/Analytics: cpu 1000m-4000m, memory 1Gi-8Gi

          Instructions:
          1. Analyze the issue and extract all information (URLs, versions, configs)
          2. Create the necessary YAML files following skill templates
          3. Respond in this EXACT JSON format:

          {
            "analysis": "Brief analysis of what you're implementing",
            "actions": [
              {"type": "create", "path": "platform/stacks/.../file.yaml", "content": "full YAML content here"}
            ],
            "commit_message": "feat: descriptive commit message",
            "pr_title": "feat: PR title",
            "pr_body": "Description of changes"
          }

          CRITICAL: Output ONLY the JSON object, no markdown code blocks, no extra text.
          PROMPT_EOF2

      - name: Test LLM connectivity
        if: steps.llm.outputs.skip != 'true'
        run: |
          echo "Testing connectivity to ${{ steps.llm.outputs.endpoint }}"
          curl -v -m 5 ${{ steps.llm.outputs.endpoint }}/health || echo "Health check failed"
          curl -v -m 5 ${{ steps.llm.outputs.endpoint }}/v1/models || echo "Models endpoint failed"

      - name: Call restack-code action
        if: steps.llm.outputs.skip != 'true'
        id: restack
        uses: restack/actions/actions/restack-code@v1
        with:
          llm_url: ${{ steps.llm.outputs.endpoint }}/v1/chat/completions
          model: ${{ steps.llm.outputs.model }}
          temperature: '0.1'
          max_tokens: '4096'
          timeout_ms: '300000'
          prompt_file: /tmp/prompt.txt
          issue_number: ${{ github.event.issue.number }}
          issue_title: ${{ github.event.issue.title }}
          issue_body: ${{ github.event.issue.body }}
          comment_body: ${{ github.event.comment.body }}
          commit: 'true'
          commit_message: 'chore: automated fix by ${{ steps.llm.outputs.name }}'
          create_pr: 'true'
          pr_title: 'fix: Issue #${{ github.event.issue.number }}'
          pr_body: 'Automated fix for issue #${{ github.event.issue.number }}'
          branch: ${{ steps.llm.outputs.name }}/issue-${{ github.event.issue.number }}
          base_branch: main
          bot_name: ${{ steps.llm.outputs.name }}
          post_comment: 'true'
          # GitHub App authentication
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          installation_id: ${{ secrets.APP_INSTALLATION_ID }}

      - name: Output result
        if: steps.llm.outputs.skip != 'true'
        run: |
          echo "Summary: ${{ steps.restack.outputs.summary }}"
          if [ -n "${{ steps.restack.outputs.pr_url }}" ]; then
            echo "PR created: ${{ steps.restack.outputs.pr_url }}"
          fi
          if [ -n "${{ steps.restack.outputs.commit_sha }}" ]; then
            echo "Commit SHA: ${{ steps.restack.outputs.commit_sha }}"
          fi
