name: Handle Issues by Local LLMs

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  resolve-issue:
    # Trigger conditions:
    # 1. Issue labeled with local LLM labels (gpt-oss, qwen3, restack-ai)
    # 2. Issue/comment mentions local LLM (@gpt-oss, @qwen3, @restack-ai)
    # 3. PR review comment mentions local LLM
    # 4. Skip bot comments to prevent infinite loop
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
       (contains(github.event.issue.labels.*.name, 'gpt-oss') ||
        contains(github.event.issue.labels.*.name, 'qwen3') ||
        contains(github.event.issue.labels.*.name, 'restack-ai'))) ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
       (contains(github.event.issue.body, '@gpt-oss') ||
        contains(github.event.issue.body, '@qwen3') ||
        contains(github.event.issue.body, '@restack-ai'))) ||
      (github.event_name == 'issue_comment' &&
       !contains(github.event.comment.user.login, '[bot]') &&
       !startsWith(github.event.comment.user.login, 'app/') &&
       (contains(github.event.comment.body, '@gpt-oss') ||
        contains(github.event.comment.body, '@qwen3') ||
        contains(github.event.comment.body, '@restack-ai'))) ||
      (github.event_name == 'pull_request_review_comment' &&
       !contains(github.event.comment.user.login, '[bot]') &&
       !startsWith(github.event.comment.user.login, 'app/') &&
       (contains(github.event.comment.body, '@gpt-oss') ||
        contains(github.event.comment.body, '@qwen3') ||
        contains(github.event.comment.body, '@restack-ai')))

    runs-on: homelab-ziwon

    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      CODE_EMBEDDER_URL: http://code-embedder-api.code-embedder.svc:8090
      DEBUG_LLM_RESPONSE: "true"

    steps:
      - name: Determine LLM target
        id: llm
        run: |
          # Check labels and mentions to determine which LLM to use
          # Use environment variables to safely handle special characters
          LABELS="$ISSUE_LABELS"
          COMMENT="$COMMENT_BODY"

          # Default values
          LLM_NAME=""
          LLM_MODEL=""
          LLM_ENDPOINT=""

          # Check for gpt-oss
          if echo "$LABELS" | grep -q "gpt-oss" || echo "$COMMENT" | grep -q "@gpt-oss"; then
            LLM_NAME="gpt-oss"
            LLM_MODEL="gpt-oss-20b"
            LLM_ENDPOINT="http://gpt.home.lab:8004"
          fi

          # Check for qwen3
          if echo "$LABELS" | grep -q "qwen3" || echo "$COMMENT" | grep -q "@qwen3"; then
            LLM_NAME="qwen3"
            LLM_MODEL="qwen3-32b"
            LLM_ENDPOINT="http://qwen.home.lab:8003"
          fi

          # Check for restack-ai (takes precedence if multiple labels exist)
          if echo "$LABELS" | grep -q "restack-ai" || echo "$COMMENT" | grep -q "@restack-ai"; then
            LLM_NAME="restack-ai"
            LLM_MODEL="qwen3-coder:30b"
            LLM_ENDPOINT="http://restack-ai"
          fi

          # Exit if no matching label/mention found
          if [ -z "$LLM_NAME" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "name=$LLM_NAME" >> $GITHUB_OUTPUT
          echo "model=$LLM_MODEL" >> $GITHUB_OUTPUT
          echo "endpoint=$LLM_ENDPOINT" >> $GITHUB_OUTPUT
        env:
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels.*.name || github.event.pull_request.labels.*.name) }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DIFF_URL: ${{ github.event.pull_request.diff_url }}
          REVIEW_COMMENT_PATH: ${{ github.event.comment.path }}
          REVIEW_COMMENT_LINE: ${{ github.event.comment.line }}

      - name: Checkout repository
        if: steps.llm.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Select and load relevant skills
        if: steps.llm.outputs.skip != 'true'
        id: skills
        run: |
          # Analyze issue content and load only relevant skills
          python3 << 'PY'
          import os
          import re
          import json

          # Issue context from environment
          issue_title = os.environ.get("ISSUE_TITLE", "").lower()
          issue_body = os.environ.get("ISSUE_BODY", "").lower()
          comment_body = os.environ.get("COMMENT_BODY", "").lower()
          combined_text = f"{issue_title} {issue_body} {comment_body}"

          # Skill keyword mapping
          skill_keywords = {
              "argocd-generator": [
                  "argocd", "application", "deploy", "helm", "chart",
                  "배포", "앱", "어플리케이션", "설치", "추가"
              ],
              "troubleshoot": [
                  "error", "fail", "crash", "debug", "troubleshoot",
                  "에러", "실패", "안됨", "안돼", "문제", "pending",
                  "crashloopbackoff", "imagepullbackoff", "oomkilled"
              ],
              "kubernetes-review": [
                  "review", "check", "validate", "manifest", "yaml",
                  "리뷰", "검토", "확인"
              ],
              "manifest-validator": [
                  "validate", "kubeconform", "kube-score", "policy",
                  "검증", "유효성"
              ],
              "infisical-manager": [
                  "infisical", "secret", "env", "environment",
                  "시크릿", "환경변수"
              ],
              "codex-review": [
                  "codex", "code review", "refactor",
                  "코드 리뷰", "리팩토링"
              ],
              "gemini-research": [
                  "research", "search", "find", "document",
                  "리서치", "검색", "문서"
              ],
              "local-sensitive": [
                  "sensitive", "credential", "private", "local",
                  "민감", "보안"
              ],
          }

          # Score each skill based on keyword matches
          skill_scores = {}
          for skill_id, keywords in skill_keywords.items():
              score = sum(1 for kw in keywords if kw in combined_text)
              if score > 0:
                  skill_scores[skill_id] = score

          # Select top skills (max 2) or default to argocd-generator
          if skill_scores:
              selected = sorted(skill_scores.keys(), key=lambda x: -skill_scores[x])[:2]
          else:
              # Default: most common use case
              selected = ["argocd-generator"]

          print(f"Selected skills based on keywords: {selected}")

          # Load full content for selected skills only
          skills_dir = ".claude/skills"
          loaded_skills = []

          for skill_id in selected:
              skill_file = os.path.join(skills_dir, skill_id, "SKILL.md")
              if os.path.isfile(skill_file):
                  with open(skill_file, "r", encoding="utf-8") as f:
                      content = f.read()
                  loaded_skills.append(f"\n=== SKILL: {skill_id} ===\n{content}")

          # Also load metadata for all skills (brief reference)
          all_meta = []
          for skill_name in sorted(os.listdir(skills_dir)):
              skill_file = os.path.join(skills_dir, skill_name, "SKILL.md")
              if not os.path.isfile(skill_file):
                  continue
              with open(skill_file, "r", encoding="utf-8") as f:
                  content = f.read()
              match = re.match(r"^---\s*\n(.*?)\n---", content, re.DOTALL)
              if match:
                  frontmatter = match.group(1)
                  desc = ""
                  for line in frontmatter.split("\n"):
                      if line.startswith("description:"):
                          desc = line.split(":", 1)[1].strip()
                          break
                  all_meta.append(f"  - {skill_name}: {desc}")

          # Write output
          with open("/tmp/skill_summary.txt", "w") as f:
              f.write("Available skills:\n")
              f.write("\n".join(all_meta))

          with open("/tmp/selected_skills.txt", "w") as f:
              f.write("\n".join(loaded_skills))

          with open("/tmp/selected_skill_ids.txt", "w") as f:
              f.write(",".join(selected))
          PY
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}

      - name: Prepare prompt file
        if: steps.llm.outputs.skip != 'true'
        run: |
          # Build comprehensive prompt with project context
          cat > /tmp/prompt.txt << 'PROMPT_EOF'
          You are helping with a Kubernetes homelab project.

          Project context:
          - This is a GitOps-driven Kubernetes homelab with K3s, ArgoCD, and ARC
          - Follow the guidelines in CLAUDE.md and .claude/rules/
          - All infrastructure is managed via ArgoCD ApplicationSets

          PROMPT_EOF

          # Add skill summary (metadata for reference)
          cat /tmp/skill_summary.txt >> /tmp/prompt.txt

          # Add selected skill templates (full content)
          echo "" >> /tmp/prompt.txt
          echo "LOADED SKILL TEMPLATES (use these for YAML format reference):" >> /tmp/prompt.txt
          cat /tmp/selected_skills.txt >> /tmp/prompt.txt

          cat >> /tmp/prompt.txt << 'PROMPT_EOF2'

          ## TASK
          Create ArgoCD application YAML based on the issue description.

          ## SOURCE OF TRUTH
          - Git repository files are the ONLY source of truth
          - RAG context is for FORMAT REFERENCE ONLY - do not copy directly
          - Create fresh content based on skill templates

          ## CRITICAL RULES
          1. Extract URLs/versions from issue (e.g., 'helm repo add NAME URL' -> repoURL: URL)
          2. File path: platform/stacks/{NN}-{category}/overlays/home/{app-name}.yaml
          3. Use 'apps:' list format for ArgoCD applications

          ## YAML RULES (MANDATORY)
          - Each key MUST appear EXACTLY ONCE in its parent map
          - NEVER repeat blocks like supersetNode, supersetWorker, etc.
          - Keep values MINIMAL - only include necessary overrides

          ## OUTPUT FORMAT (JSON ONLY)
          Output ONLY valid JSON in this exact format (no text before or after):

          {"analysis":"Brief analysis","actions":[{"type":"create","path":"platform/stacks/.../file.yaml","content":"YAML content"}],"commit_message":"feat: message","pr_title":"feat: title","pr_body":"description"}

          ## OUTPUT RULES (CRITICAL)
          - Start output with { (opening brace)
          - End output with } (closing brace)
          - NO markdown code blocks (no ```)
          - NO explanatory text before or after JSON
          - NO trailing commas
          - Escape quotes in content with \"
          - Use \n for newlines in content field
          PROMPT_EOF2

      - name: Fetch code RAG context
        if: steps.llm.outputs.skip != 'true'
        run: |
          python3 - << 'PY'
          import json
          import os
          import sys
          import urllib.request

          title = os.environ.get("ISSUE_TITLE") or ""
          body = os.environ.get("ISSUE_BODY") or ""
          comment = os.environ.get("COMMENT_BODY") or ""
          event_name = os.environ.get("EVENT_NAME") or ""
          review_path = os.environ.get("REVIEW_COMMENT_PATH") or ""
          review_line = os.environ.get("REVIEW_COMMENT_LINE") or ""
          pr_title = os.environ.get("PR_TITLE") or ""
          pr_body = os.environ.get("PR_BODY") or ""

          parts = [part for part in (title or pr_title, body or pr_body) if part]
          issue_text = "\n\n".join(parts).strip()
          if event_name == "issue_comment" and comment:
            issue_text = (issue_text + "\n\nComment:\n" + comment).strip()
          if event_name == "pull_request_review_comment" and comment:
            review_context = f"Review comment on {review_path}"
            if review_line:
              review_context += f" (line {review_line})"
            review_context += f":\n{comment}"
            issue_text = (issue_text + "\n\n" + review_context).strip()

          if not issue_text:
            sys.exit(0)

          query_parts = [title]
          if comment:
            query_parts.append(comment)
          query = "\n\n".join([part for part in query_parts if part]).strip()
          if not query:
            query = issue_text
          max_chars_value = os.environ.get("QUERY_MAX_CHARS") or "4000"
          try:
            max_chars = int(max_chars_value)
          except ValueError:
            max_chars = 4000
          if max_chars > 0 and len(query) > max_chars:
            query = query[:max_chars]
          payload = {
            "query": query,
            "issue_description": issue_text,
            "limit": 2,
            "use_dense": True,
            "use_bm25": True,
            "return_prompt": False,
          }

          url = os.environ["CODE_EMBEDDER_URL"].rstrip("/") + "/search"
          request = urllib.request.Request(
            url,
            data=json.dumps(payload).encode("utf-8"),
            headers={"Content-Type": "application/json"},
          )

          try:
            with urllib.request.urlopen(request, timeout=15) as response:
              data = json.load(response)
          except Exception as exc:
            print(f"RAG search failed: {exc}", file=sys.stderr)
            sys.exit(0)

          hits = data.get("hits") or []
          print(f"RAG search returned {len(hits)} hits")
          blocks = []
          for hit in hits:
            payload = hit.get("payload") or {}
            text = payload.get("text") or ""
            if not text:
              continue
            header = f"[{payload.get('path', '')}]"
            meta = []
            yaml_path = payload.get("yaml_path")
            chart_name = payload.get("chart_name")
            block_key = payload.get("block_key")
            embedded_kind = payload.get("embedded_kind")
            embedded_name = payload.get("embedded_name")
            if yaml_path:
              meta.append(f"yaml_path={yaml_path}")
            if chart_name:
              meta.append(f"chart={chart_name}")
            if block_key:
              meta.append(f"block_key={block_key}")
            if embedded_kind or embedded_name:
              embedded = "/".join([value for value in [embedded_kind, embedded_name] if value])
              meta.append(f"embedded={embedded}")
            meta_line = f" {' '.join(meta)}" if meta else ""
            blocks.append(f"{header}{meta_line}\n{text}")

          if not blocks:
            print("No valid blocks extracted from RAG hits (missing text field?)")
            sys.exit(0)

          print(f"Extracted {len(blocks)} blocks from RAG hits")
          max_context_chars = 10000
          separator = "\n\n---\n\n"
          context = ""
          for block in blocks:
            if not block:
              continue
            if not context:
              candidate = block
            else:
              candidate = context + separator + block
            if len(candidate) <= max_context_chars:
              context = candidate
              continue
            if not context:
              context = block[:max_context_chars]
            else:
              remaining = max_context_chars - len(context) - len(separator)
              if remaining > 0:
                context = context + separator + block[:remaining]
            break

          if not context:
            sys.exit(0)

          with open("/tmp/rag_context.txt", "w", encoding="utf-8") as handle:
            handle.write(context)
          PY

          if [ -s /tmp/rag_context.txt ]; then
            cat >> /tmp/prompt.txt << 'PROMPT_EOF3'

          ## RAG CONTEXT (REFERENCE ONLY - DO NOT COPY DIRECTLY)
          The following is similar code from the repository for FORMAT reference.
          DO NOT merge this with your output. Create fresh content based on the issue request.
          ---
          PROMPT_EOF3
            cat /tmp/rag_context.txt >> /tmp/prompt.txt
          fi
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_COMMENT_PATH: ${{ github.event.comment.path }}
          REVIEW_COMMENT_LINE: ${{ github.event.comment.line }}

      - name: Test LLM connectivity
        if: steps.llm.outputs.skip != 'true'
        run: |
          echo "Testing connectivity to ${{ steps.llm.outputs.endpoint }}"
          curl -v -m 5 ${{ steps.llm.outputs.endpoint }}/health || echo "Health check failed"
          curl -v -m 5 ${{ steps.llm.outputs.endpoint }}/v1/models || echo "Models endpoint failed"

      - name: Call restack-code action
        if: steps.llm.outputs.skip != 'true'
        id: restack
        uses: restack/actions/actions/restack-code@v1
        with:
          # LLM configuration
          llm_url: ${{ steps.llm.outputs.endpoint }}/v1/chat/completions
          model: ${{ steps.llm.outputs.model }}
          temperature: '0.1'
          max_tokens: '4096'
          timeout_ms: '600000'
          prompt_file: /tmp/prompt.txt
          # Issue/PR context
          issue_number: ${{ github.event.issue.number || github.event.pull_request.number }}
          issue_title: ${{ github.event.issue.title || github.event.pull_request.title }}
          issue_body: ${{ github.event.issue.body || github.event.pull_request.body }}
          comment_body: ${{ github.event.comment.body }}
          # Event context (action handles PR review comment logic automatically)
          event_name: ${{ github.event_name }}
          review_comment_path: ${{ github.event.comment.path }}
          review_comment_line: ${{ github.event.comment.line }}
          pr_head_ref: ${{ github.event.pull_request.head.ref }}
          pr_base_ref: ${{ github.event.pull_request.base.ref }}
          # Commit/PR options
          commit: 'true'
          commit_message: ''
          create_pr: 'true'
          pr_title: ''
          pr_body: ''
          branch: ${{ format('{0}/issue-{1}', steps.llm.outputs.name, github.event.issue.number) }}
          base_branch: main
          bot_name: ${{ steps.llm.outputs.name }}
          post_comment: 'true'
          # GitHub App authentication
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          installation_id: ${{ secrets.APP_INSTALLATION_ID }}

      - name: Debug LLM response
        if: always() && steps.llm.outputs.skip != 'true' && env.DEBUG_LLM_RESPONSE == 'true'
        env:
          LLM_RESPONSE: ${{ steps.restack.outputs.llm_response }}
        run: |
          set -euo pipefail
          if [ -z "${LLM_RESPONSE:-}" ]; then
            echo "LLM response is empty" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$LLM_RESPONSE" > /tmp/llm_response.txt
          echo "LLM response bytes: $(wc -c < /tmp/llm_response.txt)" >> "$GITHUB_STEP_SUMMARY"
          head -c 1000 /tmp/llm_response.txt > /tmp/llm_response_head.txt
          tail -c 1000 /tmp/llm_response.txt > /tmp/llm_response_tail.txt
          echo "LLM response head (1k):"
          cat /tmp/llm_response_head.txt
          echo ""
          echo "LLM response tail (1k):"
          cat /tmp/llm_response_tail.txt
          echo ""

      - name: Upload LLM response artifact
        if: always() && steps.llm.outputs.skip != 'true' && env.DEBUG_LLM_RESPONSE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: llm-response
          path: /tmp/llm_response.txt

      - name: Output result
        if: steps.llm.outputs.skip != 'true'
        run: |
          echo "Summary: ${{ steps.restack.outputs.summary }}"
          if [ -n "${{ steps.restack.outputs.pr_url }}" ]; then
            echo "PR created: ${{ steps.restack.outputs.pr_url }}"
          fi
          if [ -n "${{ steps.restack.outputs.commit_sha }}" ]; then
            echo "Commit SHA: ${{ steps.restack.outputs.commit_sha }}"
          fi

      - name: Add label to created PR
        if: steps.llm.outputs.skip != 'true' && steps.restack.outputs.pr_url != ''
        uses: actions/github-script@v9
        with:
          script: |
            const prUrl = '${{ steps.restack.outputs.pr_url }}';
            const labelName = '${{ steps.llm.outputs.name }}';
            const match = prUrl.match(/\/pull\/(\d+)/);

            if (match) {
              const prNumber = parseInt(match[1]);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [labelName]
              });
              core.info(`Added label '${labelName}' to PR #${prNumber}`);
            }
