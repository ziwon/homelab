name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review_comment:
    types: [created]

jobs:
  # Claude Review (only when claude label/mention)
  claude-review:
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))

    runs-on: homelab-ziwon

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing a Pull Request for a Kubernetes homelab project.

            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

            Description:
            ${{ github.event.pull_request.body }}

            Project context:
            - This is a GitOps-driven Kubernetes homelab with K3s, ArgoCD, and ARC
            - Follow the guidelines in CLAUDE.md and .claude/rules/
            - All infrastructure is managed via ArgoCD ApplicationSets

            Instructions:
            1. Review the code changes for:
               - Code quality and best practices
               - Security issues (OWASP top 10, injection vulnerabilities)
               - Kubernetes manifest correctness
               - ArgoCD application standards compliance
               - Resource limits and health checks
            2. Check ArgoCD application status if platform/stacks files changed
            3. If you find issues that can be auto-fixed, make the fixes and push them
            4. Comment on the PR with your review findings

            Be constructive and helpful in your feedback.
