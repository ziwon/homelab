name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review_comment:
    types: [created]

jobs:
  # Local LLM Review (only when gpt-oss or qwen3 label/mention)
  local-llm-review:
    runs-on: homelab-ziwon

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Determine LLM target
        id: llm
        run: |
          # Check labels and mentions to determine which LLM to use
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          COMMENT='${{ github.event.comment.body }}'

          # Default values
          LLM_NAME=""
          LLM_MODEL=""
          LLM_ENDPOINT=""

          # Check for gpt-oss
          if echo "$LABELS" | grep -q "gpt-oss" || echo "$COMMENT" | grep -q "@gpt-oss"; then
            LLM_NAME="gpt-oss"
            LLM_MODEL="gpt-oss-20b"
            LLM_ENDPOINT="http://gpt.home.lab:8004"
          fi

          # Check for qwen3
          if echo "$LABELS" | grep -q "qwen3" || echo "$COMMENT" | grep -q "@qwen3"; then
            LLM_NAME="qwen3"
            LLM_MODEL="qwen3-32b"
            LLM_ENDPOINT="http://qwen.home.lab:8003"
          fi

          # Check for restack-ai (takes precedence if multiple labels exist)
          if echo "$LABELS" | grep -q "restack-ai" || echo "$COMMENT" | grep -q "@restack-ai"; then
            LLM_NAME="restack-ai"
            LLM_MODEL="qwen3-coder:30b"
            LLM_ENDPOINT="http://restack-ai"
          fi

          # Skip if no local LLM label/mention found (claude will handle it)
          if [ -z "$LLM_NAME" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "name=$LLM_NAME" >> $GITHUB_OUTPUT
          echo "model=$LLM_MODEL" >> $GITHUB_OUTPUT
          echo "endpoint=$LLM_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Checkout repository
        if: steps.llm.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Prepare review prompt
        if: steps.llm.outputs.skip != 'true'
        run: |
          cat > /tmp/review_prompt.txt << 'PROMPT_EOF'
          You are reviewing a Pull Request for a Kubernetes homelab project.

          Project context:
          - This is a GitOps-driven Kubernetes homelab with K3s, ArgoCD, and ARC
          - Follow the guidelines in CLAUDE.md and .claude/rules/
          - All infrastructure is managed via ArgoCD ApplicationSets

          Instructions:
          Review the code changes and provide feedback.

          Focus on:
          - Code quality and best practices
          - Security issues (OWASP top 10, injection vulnerabilities)
          - Kubernetes manifest correctness
          - ArgoCD application standards compliance
          - Resource limits and health checks

          Respond in this EXACT JSON format:
          {
            "analysis": "Overall review summary and verdict (LGTM, needs changes, etc)",
            "actions": [],
            "commit_message": "",
            "pr_title": "",
            "pr_body": ""
          }

          CRITICAL: Output ONLY the JSON object, no markdown, no extra text.
          The analysis field will be posted as a PR comment automatically.
          PROMPT_EOF

      - name: Call restack-code for PR review
        if: steps.llm.outputs.skip != 'true'
        id: review
        uses: restack/actions/actions/restack-code@v1
        with:
          llm_url: ${{ steps.llm.outputs.endpoint }}/v1/chat/completions
          model: ${{ steps.llm.outputs.model }}
          temperature: '0.1'
          max_tokens: '4096'
          timeout_ms: '300000'
          prompt_file: /tmp/review_prompt.txt
          include_patch: 'true'
          pr_number: ${{ github.event.pull_request.number }}
          pr_title_context: ${{ github.event.pull_request.title }}
          pr_body_context: ${{ github.event.pull_request.body }}
          comment_body: ${{ github.event.comment.body }}
          bot_name: ${{ steps.llm.outputs.name }}
          post_comment: 'true'
          # GitHub App authentication
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          installation_id: ${{ secrets.APP_INSTALLATION_ID }}

      - name: Output review result
        if: steps.llm.outputs.skip != 'true'
        run: |
          echo "Review completed by ${{ steps.llm.outputs.name }}"
          echo "Summary: ${{ steps.review.outputs.summary }}"

  # Claude Review (only when claude label/mention)
  claude-review:
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))

    runs-on: homelab-ziwon

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing a Pull Request for a Kubernetes homelab project.

            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

            Description:
            ${{ github.event.pull_request.body }}

            Project context:
            - This is a GitOps-driven Kubernetes homelab with K3s, ArgoCD, and ARC
            - Follow the guidelines in CLAUDE.md and .claude/rules/
            - All infrastructure is managed via ArgoCD ApplicationSets

            Instructions:
            1. Review the code changes for:
               - Code quality and best practices
               - Security issues (OWASP top 10, injection vulnerabilities)
               - Kubernetes manifest correctness
               - ArgoCD application standards compliance
               - Resource limits and health checks
            2. Check ArgoCD application status if platform/stacks files changed
            3. If you find issues that can be auto-fixed, make the fixes and push them
            4. Comment on the PR with your review findings

            Be constructive and helpful in your feedback.
