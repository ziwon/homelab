name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review_comment:
    types: [created]

jobs:
  # Local LLM Review (only when gpt-oss or qwen3 label/mention)
  local-llm-review:
    runs-on: homelab-ziwon

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Determine LLM target
        id: llm
        run: |
          # Check labels and mentions to determine which LLM to use
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          COMMENT='${{ github.event.comment.body }}'

          # Default values
          LLM_NAME=""
          LLM_MODEL=""
          LLM_ENDPOINT=""

          # Check for gpt-oss
          if echo "$LABELS" | grep -q "gpt-oss" || echo "$COMMENT" | grep -q "@gpt-oss"; then
            LLM_NAME="gpt-oss"
            LLM_MODEL="gpt-oss-20b"
            LLM_ENDPOINT="http://gpt.home.lab:8004"
          fi

          # Check for qwen3 (takes precedence if both labels exist)
          if echo "$LABELS" | grep -q "qwen3" || echo "$COMMENT" | grep -q "@qwen3"; then
            LLM_NAME="qwen3"
            LLM_MODEL="qwen3-32b"
            LLM_ENDPOINT="http://qwen.home.lab:8003"
          fi

          # Skip if no local LLM label/mention found (claude will handle it)
          if [ -z "$LLM_NAME" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "name=$LLM_NAME" >> $GITHUB_OUTPUT
          echo "model=$LLM_MODEL" >> $GITHUB_OUTPUT
          echo "endpoint=$LLM_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Checkout repository
        if: steps.llm.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup GitHub CLI
        if: steps.llm.outputs.skip != 'true'
        run: |
          if ! command -v gh &> /dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update && sudo apt-get install gh -y
          fi
          gh --version

      - name: Get PR diff
        if: steps.llm.outputs.skip != 'true'
        id: diff
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }})
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Review with Local LLM
        if: steps.llm.outputs.skip != 'true'
        id: review
        shell: bash
        run: |
          set +e

          PROMPT="You are reviewing a Pull Request for a Kubernetes homelab project.

          PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

          Description:
          ${{ github.event.pull_request.body }}

          Diff:
          ${{ steps.diff.outputs.diff }}

          Project context:
          - This is a GitOps-driven Kubernetes homelab with K3s, ArgoCD, and ARC
          - Follow the guidelines in CLAUDE.md and .claude/rules/
          - All infrastructure is managed via ArgoCD ApplicationSets

          Instructions:
          1. Review the code changes for:
             - Code quality and best practices
             - Security issues (OWASP top 10, injection vulnerabilities)
             - Kubernetes manifest correctness
             - ArgoCD application standards compliance
             - Resource limits and health checks
          2. Provide constructive feedback

          Output format:
          {
            \"summary\": \"Brief summary of the changes\",
            \"issues\": [
              {\"severity\": \"high|medium|low\", \"file\": \"path/to/file\", \"description\": \"issue description\"}
            ],
            \"suggestions\": [\"suggestion 1\", \"suggestion 2\"],
            \"approval\": \"approve|request_changes|comment\"
          }

          IMPORTANT: Output ONLY valid JSON, no markdown or extra text."

          PAYLOAD=$(jq -n \
            --arg model "${{ steps.llm.outputs.model }}" \
            --arg content "$PROMPT" \
            '{model: $model, messages: [{role: "user", content: $content}], max_tokens: 4096, temperature: 0.1}')

          RESPONSE=$(curl -s -X POST ${{ steps.llm.outputs.endpoint }}/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            | jq -r '.choices[0].message.content // "Error: No response"')

          echo "Raw response: $RESPONSE"

          # Try to extract JSON
          JSON_RESPONSE=$(echo "$RESPONSE" | grep -o '{.*}' | head -1 || echo "$RESPONSE")

          echo "response<<EOF" >> $GITHUB_OUTPUT
          echo "$JSON_RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post review comment
        if: steps.llm.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const response = process.env.RESPONSE;
            const llmName = process.env.LLM_NAME;
            const llmModel = process.env.LLM_MODEL;

            let review = { summary: "Unable to parse review", issues: [], suggestions: [], approval: "comment" };
            try {
              review = JSON.parse(response);
            } catch (e) {
              review.summary = response;
            }

            const issuesList = review.issues?.length > 0
              ? review.issues.map(i => `- **[${i.severity?.toUpperCase()}]** \`${i.file}\`: ${i.description}`).join('\n')
              : 'No issues found.';

            const suggestionsList = review.suggestions?.length > 0
              ? review.suggestions.map(s => `- ${s}`).join('\n')
              : 'No additional suggestions.';

            const body = `## 🤖 ${llmName} PR Review

            ### Summary
            ${review.summary}

            ### Issues
            ${issuesList}

            ### Suggestions
            ${suggestionsList}

            ---
            *Powered by ${llmModel} running on homelab*`;

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.pull_request.number }},
              body: body,
              event: review.approval === 'approve' ? 'APPROVE' : review.approval === 'request_changes' ? 'REQUEST_CHANGES' : 'COMMENT'
            });
        env:
          RESPONSE: ${{ steps.review.outputs.response }}
          LLM_NAME: ${{ steps.llm.outputs.name }}
          LLM_MODEL: ${{ steps.llm.outputs.model }}

  # Claude Review (default, or when claude label/mention)
  claude-review:
    if: |
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'gpt-oss') && !contains(github.event.pull_request.labels.*.name, 'qwen3')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))

    runs-on: homelab-ziwon

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing a Pull Request for a Kubernetes homelab project.

            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

            Description:
            ${{ github.event.pull_request.body }}

            Project context:
            - This is a GitOps-driven Kubernetes homelab with K3s, ArgoCD, and ARC
            - Follow the guidelines in CLAUDE.md and .claude/rules/
            - All infrastructure is managed via ArgoCD ApplicationSets

            Instructions:
            1. Review the code changes for:
               - Code quality and best practices
               - Security issues (OWASP top 10, injection vulnerabilities)
               - Kubernetes manifest correctness
               - ArgoCD application standards compliance
               - Resource limits and health checks
            2. Check ArgoCD application status if platform/stacks files changed
            3. If you find issues that can be auto-fixed, make the fixes and push them
            4. Comment on the PR with your review findings

            Be constructive and helpful in your feedback.
