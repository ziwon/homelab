name: Claude Issue Resolver

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]

jobs:
  claude-resolve:
    # Trigger conditions:
    # 1. Issue labeled with 'claude'
    # 2. Issue comment mentions '@claude' or '/claude'
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'claude')) ||
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '/claude')))

    runs-on: homelab-ziwon  # Use ARC self-hosted runner for ziwon account

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write  # Required for claude-code-action OIDC

    steps:
      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            You are helping with a Kubernetes homelab project. An issue has been created.

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            Description:
            ${{ github.event.issue.body }}

            Project context:
            - This is a GitOps-driven Kubernetes homelab with K3s, ArgoCD, and ARC
            - Follow the guidelines in CLAUDE.md and .claude/rules/
            - All infrastructure is managed via ArgoCD ApplicationSets
            - Use kubectl to check cluster state if needed

            Instructions:
            1. Analyze the issue thoroughly
            2. Check ArgoCD application status if relevant
            3. Implement the fix or feature following project standards
            4. Create a commit with a clear message
            5. Create a PR or comment on the issue with your findings

            If you make changes, create a PR. If you need more information, comment on the issue.
